<!doctype html>

<title>PhysiqueOS Weekly — faithful restyle corrective pass</title>
<style>
@font-face{font-family:Jakarta;src:url('./fonts/PlusJakartaSans.ttf') format('truetype');font-weight:100 900;font-style:normal}
*{box-sizing:border-box}html,body{margin:0;background:#070b11;color:#f5fafc;font-family:Jakarta,-apple-system,BlinkMacSystemFont,sans-serif}body{padding:28px}.board{max-width:1390px;margin:auto}.board-head{margin:0 0 24px}.board-head h1{font-size:24px;margin:0 0 6px}.board-head p{margin:0;color:#98a7b8;font-size:14px}.row{display:flex;align-items:flex-start;gap:28px;flex-wrap:wrap}.column{display:grid;gap:10px}.column>h2{margin:0;font-size:13px;color:#aab7c4;font-weight:700}.phone{width:402px;overflow:hidden;border-radius:50px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.35);font-size:14px;line-height:1.42}.status{height:51px;padding:18px 27px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:800}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:22px;background:#02050a}.status-icons{letter-spacing:2px;font-size:11px}.content{padding:0 20px 56px}.nav{display:flex;gap:8px;padding:10px 0 16px}.nav-chip{height:42px;padding:0 15px;border-radius:13px;display:flex;align-items:center;gap:7px;font-weight:700;font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)}.back{font-size:20px;line-height:1}.stack{display:grid;gap:28px}.card{padding:22px;border-radius:22px;background:var(--surface);border:1px solid var(--card-line);position:relative;overflow:hidden}.card.tinted:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--tint)}.hero{background:var(--hero);border-color:var(--hero-line)}.topline{display:flex;gap:14px;justify-content:space-between;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--tint)}.support{font-size:12px;color:var(--muted)}.range{text-align:right}.confidence{display:grid;grid-template-columns:112px 1fr;gap:18px;align-items:center;margin-top:18px}.ring{--score:68;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--score)*1%),var(--track) 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--hero)}.ring-inner{position:relative;z-index:1;text-align:center}.ring-score{font-size:27px;font-weight:800;line-height:1}.ring-caption{font-size:9px;text-transform:uppercase;color:var(--muted);margin-top:5px;font-weight:700}.confidence-copy{display:grid;gap:6px}.confidence-copy strong{font-size:16px}.body-copy{color:var(--secondary);font-size:15px}.primary-reason{font-size:12px;color:var(--secondary)}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.hero h3{font-size:28px;line-height:1.08;margin:0;color:var(--text)}.hero .narrative{font-size:15px;color:var(--secondary);margin:10px 0 0}.footer-strip{display:grid;grid-template-columns:1.5fr .55fr 1.45fr;gap:12px}.footer-strip span,.metric-label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.footer-strip strong{display:block;font-size:12px;margin-top:4px}.section-head{display:flex;align-items:center;gap:9px}.icon{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:color-mix(in srgb,var(--tint) 15%,transparent);color:var(--tint);font-weight:800}.section-head .coverage{margin-left:auto}.editorial-title{font-size:20px;margin:0;color:var(--text)}.energy-statement{font-size:27px;line-height:1.1;font-weight:800;margin:12px 0 0}.card p{margin:9px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric-value{font-size:15px;font-weight:800;margin-top:4px}.chart-title{font-size:14px;font-weight:750;margin-bottom:13px}.chart{height:180px;display:grid;grid-template-columns:repeat(7,1fr);gap:7px;align-items:end;padding:8px 0 25px;position:relative;border-bottom:1px solid var(--line)}.day{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:3px;align-items:end;position:relative}.bar{border-radius:4px 4px 1px 1px;min-height:4px}.bar.intake{background:var(--amber)}.bar.expenditure{background:var(--blue)}.day-label{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}.legend{display:flex;gap:12px;margin-top:12px;color:var(--muted);font-size:11px}.swatch{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}.weight-line{display:flex;gap:10px;align-items:baseline;margin-top:16px}.weight-line strong{font-size:28px}.weight-line span{font-size:14px;color:var(--blue);font-weight:800}.training-copy{margin-top:16px}.coverage-line{font-size:12px;color:var(--muted);margin-top:10px}.sub-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green);margin:20px 0 12px}.highlight-list{display:grid;gap:12px}.highlight{padding:16px;border-radius:16px;background:var(--inset);border:1px solid var(--strong-line)}.highlight-head{display:flex;gap:10px}.trophy{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 15%,transparent)}.highlight strong{display:block}.record{font-size:10px;color:var(--green);font-weight:800;text-transform:uppercase;letter-spacing:.06em}.performance{font-size:18px;font-weight:800;margin-top:10px}.delta{font-size:13px;color:var(--green);font-weight:800;margin-top:6px}.priority-list{border-top:1px solid var(--line)}.priority{display:grid;grid-template-columns:8px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.dot{width:7px;height:7px;border-radius:50%;margin-top:7px;background:var(--tone)}.priority span{display:block;font-size:12px;color:var(--muted);margin-top:2px}.recovery{--tint:var(--cyan);background:var(--surface);border-style:dashed}.fixture-flag{font-size:9px;font-weight:800;color:var(--cyan);border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:999px;padding:4px 7px;letter-spacing:.05em}.recovery-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}.recovery-item{padding:12px;border-radius:12px;background:var(--inset)}.recovery-item strong{display:block;margin-top:4px}.recovery-note{font-size:12px;color:var(--muted)}.coach{padding:26px;border-radius:24px;background:linear-gradient(135deg,var(--coach-a),var(--coach-b));color:#fff}.coach .eyebrow{color:rgba(255,255,255,.82)}.coach h3{font-size:20px;margin:0 0 6px}.coach p{color:rgba(255,255,255,.94);font-size:15px}.coach hr{border-color:rgba(255,255,255,.22);margin:20px 0}.actions{display:grid;gap:13px}.action{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#ddd6fe;font-weight:800}.revision{border-left:3px solid var(--amber);padding:18px 19px;background:var(--surface);border-radius:0 16px 16px 0}.revision strong{display:block}.revision p{margin:5px 0 0;color:var(--secondary)}.revision .support{margin-top:7px}.baseline{--bg:#080d18;--surface:#141f31;--inset:#172235;--hero:#20264a;--hero-line:#8b8cff38;--text:#f3f6fb;--secondary:#cbd5e1;--muted:#9aa8ba;--line:#94a3b82e;--strong-line:#cbd5e1d9;--card-line:#8b8cff26;--purple:#8b8cff;--green:#4ade80;--blue:#60a5fa;--amber:#fbbf24;--cyan:#36c5d0;--track:#334155;--coach-a:#6d28d9;--coach-b:#4338ca;background:var(--bg);color:var(--text)}
.dark{--bg:#06121c;--surface:#0d2030;--inset:#112939;--hero:#0a3740;--hero-line:#35d7c04a;--text:#f4f7f8;--secondary:#c4d1d5;--muted:#8fa5ad;--line:#8da5ad2d;--strong-line:#9bb2ba61;--card-line:#4acbbb2e;--purple:#a88cff;--green:#55df9a;--blue:#54c6e7;--amber:#f2bc4d;--cyan:#44d3df;--track:#31535a;--coach-a:#143c56;--coach-b:#19336a;background:var(--bg);color:var(--text)}
.light{--bg:#eef0e8;--surface:#faf9f4;--inset:#edf2ec;--hero:#d9eeee;--hero-line:#148e7d38;--text:#0b2233;--secondary:#425967;--muted:#6f828b;--line:#18394726;--strong-line:#54717b49;--card-line:#2f5a6424;--purple:#7958dd;--green:#14956b;--blue:#1684a1;--amber:#b87813;--cyan:#118da0;--track:#a8c1c1;--coach-a:#153f57;--coach-b:#214878;background:var(--bg);color:var(--text)}
.phone{background:var(--bg);color:var(--text)}.phone .island{background:#02050a}.phone .tint-purple{--tint:var(--purple)}.phone .tint-amber{--tint:var(--amber)}.phone .tint-blue{--tint:var(--blue)}.phone .tint-green{--tint:var(--green)}.phone .tint-cyan{--tint:var(--cyan)}
.board-foot{margin-top:24px;color:#98a7b8;font-size:12px}.board-foot code{color:#d7e0e8}.screen-only{display:none}
@media(max-width:900px){body{padding:14px}.row{display:grid;justify-content:center}.column.baseline-column{display:none}}
</style>
<main class="board">
  <header class="board-head"><h1>Weekly Briefing · immutable structure, visual restyle only</h1><p>Actual Build 85 baseline structure · faithful dark · faithful mineral light</p></header>
  <div class="row" id="board-row"></div>
  <footer class="board-foot">Authority <code>b8ee8690b194cb90086b62816b9a2c8c400dc026</code> · fixture <code>weekly_briefing_2026-08-23_2026-08-29</code></footer>
</main>
<script>
const fixtureId='weekly_briefing_2026-08-23_2026-08-29';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const semantic=(key,value,html)=>`<span data-semantic="${esc(key)}" data-value="${esc(value)}">${html??esc(value)}</span>`;
const wid=(id,parent,component,inner,extra='')=>`<section data-wid="${id}" data-parent="${parent}" data-component="${component}" ${extra}>${inner}</section>`;
function status(){return `<div class="status"><span>1:05</span><span class="island"></span><span class="status-icons">▮▮▮⌁</span></div>`}
function chart(energy){
 const pts=energy.dailyBalances,max=Math.max(...pts.flatMap(p=>[p.intakeKcal||0,p.expenditureKcal||0]));
 const bars=pts.map((p,i)=>`<div class="day" data-date="${p.date}" data-paired="${p.hasPairedData}"><i class="bar intake" data-series="Intake" data-value="${p.intakeKcal}" style="height:${p.intakeKcal/max*100}%"></i><i class="bar expenditure" data-series="Estimated expenditure" data-value="${p.expenditureKcal}" style="height:${p.expenditureKcal/max*100}%"></i><span class="day-label">${p.label||p.date.slice(-2)}</span></div>`).join('');
 return `<div class="chart" role="img" aria-label="Daily intake and expenditure across ${pts.length} days" data-chart-type="grouped-bar" data-chart-series="Intake|Estimated expenditure">${bars}</div>`;
}
function recovery(){return `<section class="card tinted recovery" data-wid="R-FUTURE" data-parent="WeeklyBriefingSections" data-component="RecoveryBriefingFutureFixture" data-fixture-only="true">
 <div class="section-head"><div class="icon">☾</div><div class="eyebrow">RECOVERY</div><span class="fixture-flag">FUTURE CONTRACT · FIXTURE ONLY</span></div>
 <h3 class="editorial-title" style="margin-top:16px">Not enough data</h3><p class="body-copy">Recovery remains unavailable until the prospective Sleep evidence gate graduates.</p>
 <div class="recovery-grid"><div class="recovery-item"><span class="metric-label">Sleep signal</span><strong>Not graduated</strong></div><div class="recovery-item"><span class="metric-label">Foam context</span><strong>Context only</strong></div></div>
 <p class="recovery-note">Design fixture — not current production output · Confidence coupling: none.</p></section>`}
function renderPhone(briefing,theme,includeRecovery,label){
 const w=briefing.weekly,c=briefing.confidence,e=w.energy,t=w.training;
 const confidenceHtml=wid('W04','W02','ConfidenceAnchor',`<div class="confidence"><div class="ring" style="--score:${c.score}" data-confidence-score="${c.score}"><div class="ring-inner"><div class="ring-score">${semantic('confidence.score',c.score,c.score+'%')}</div><div class="ring-caption">Confidence</div></div></div><div class="confidence-copy"><span class="eyebrow">${semantic('confidence.band',c.band,c.band)}</span><strong>${semantic('confidence.movementDirection',c.movementDirection,`Confidence ${c.movementDirection} ${c.delta>0?'+':''}${c.delta}`)}</strong><div class="primary-reason">${semantic('confidence.primaryReason',c.primaryReason)}</div></div></div>`);
 const hero=wid('W02','WeeklyBriefingSections','BriefingLeadCard',`<div class="card hero tinted tint-purple">
   ${wid('W03','W02','LeadHeader',`<div class="topline"><span class="eyebrow">WEEKLY BRIEFING</span><span class="support range">${semantic('weekly.periodLabel',w.periodLabel)}<br>${semantic('weekly.reportingRangeLabel',w.reportingRangeLabel)}</span></div>`)}
   ${confidenceHtml}<hr>
   ${wid('W05','W02','LeadHeadline',`<h3>${semantic('weekly.heroHeadline',w.heroHeadline)}</h3>`)}
   ${wid('W06','W02','LeadNarrative',`<p class="narrative">${semantic('weekly.heroBody',w.heroBody)}</p>`)}
   <hr>${wid('W07','W02','LeadFooter',`<div class="footer-strip"><div><span>Strategy</span><strong>${semantic('weekly.strategyPhaseLabel',w.strategyPhaseLabel)}</strong></div><div><span>Week</span><strong>${semantic('weekly.strategyWeekLabel',w.strategyWeekLabel)}</strong></div><div><span>Next</span><strong>${semantic('weekly.strategyNextMilestone',w.strategyNextMilestone)}</strong></div></div>`)}
 </div>`);
 const energy=wid('W08','WeeklyBriefingSections','WeeklyEnergyCard',`<div class="card tinted tint-amber">
   ${wid('W09','W08','EnergyHeader',`<div class="section-head"><div class="icon">ϟ</div><span class="eyebrow">ENERGY BALANCE</span><span class="support coverage">${semantic('weekly.energy.pairedDayCount',e.pairedDayCount)}/${semantic('weekly.energy.eligibleDayCount',e.eligibleDayCount)} days paired</span></div>`)}
   ${wid('W10','W08','EnergyLegacyNarrative',`<h3 class="editorial-title" style="margin-top:18px">Energy Balance</h3><div class="energy-statement">${e.averageBalanceKcal>=0?'+':''}${semantic('weekly.energy.averageBalanceKcal',e.averageBalanceKcal)} kcal/day above</div><p class="body-copy">${semantic('weekly.energy.narrative',e.narrative)}</p>`)}
   <hr>${wid('W13','W08','EnergyMetrics',`<div class="metrics"><div><span class="metric-label">Avg Intake</span><strong class="metric-value">${semantic('weekly.energy.averageIntakeKcal',e.averageIntakeKcal,e.averageIntakeKcal+' kcal')}</strong></div><div><span class="metric-label">Avg Expenditure</span><strong class="metric-value">${semantic('weekly.energy.averageExpenditureKcal',e.averageExpenditureKcal,e.averageExpenditureKcal+' kcal')}</strong></div><div><span class="metric-label">Avg Balance</span><strong class="metric-value">+${e.averageBalanceKcal} kcal</strong></div></div>`)}
   <hr>${wid('W14','W08','EnergyChartTitle',`<div class="chart-title">Daily intake vs estimated expenditure</div>`)}
   ${wid('W15','W08','WeeklyEnergyChart',chart(e),`data-chart-title="Daily intake vs estimated expenditure" data-chart-point-count="${e.dailyBalances.length}"`)}
   ${wid('W16','W08','EnergySeriesLegend',`<div class="legend"><span><i class="swatch" style="background:var(--amber)"></i>Intake</span><span><i class="swatch" style="background:var(--blue)"></i>Estimated expenditure</span></div>`)}
 </div>`);
 const weight=wid('W17','WeeklyBriefingSections','WeeklyWeightCard',`<div class="card tinted tint-blue"><div class="section-head"><div class="icon">↕</div><span class="eyebrow">WEIGHT CONTEXT</span></div>${wid('W18','W17','WeightMetrics',`<div class="weight-line"><strong>${semantic('weekly.weight.averageWeightLb',w.weight.averageWeightLb,w.weight.averageWeightLb.toFixed(1)+' lb')}</strong><span>+${semantic('weekly.weight.changeLb',w.weight.changeLb,w.weight.changeLb.toFixed(1))} lb this week</span></div>`)}${wid('W19','W17','WeightNarrative',`<p class="body-copy">${semantic('weekly.weight.narrative',w.weight.narrative)}</p>`)}</div>`);
 const photos=w.photos?wid('W20','WeeklyBriefingSections','WeeklyPhotosCard',`<div class="card tinted tint-green"><h3 class="editorial-title">Photos</h3>${wid('W21','W20','PhotosNarrative',`<p class="body-copy">${semantic('weekly.photos.narrative',w.photos.narrative)}</p>`)}</div>`):'';
 const highlights=t.highlights.map((h,i)=>`<div class="highlight"><div class="highlight-head"><div class="trophy">◆</div><div><strong>${semantic(`weekly.training.highlights.${i}.exerciseName`,h.exerciseName)}</strong><span class="record">${semantic(`weekly.training.highlights.${i}.recordType`,h.recordType)}</span></div></div><div class="performance">${semantic(`weekly.training.highlights.${i}.performanceValue`,h.performanceValue)}</div><div class="delta">▲ ${semantic(`weekly.training.highlights.${i}.delta`,h.delta)}</div><p class="support">${semantic(`weekly.training.highlights.${i}.detail`,h.detail)}</p><span class="screen-only">${semantic(`weekly.training.highlights.${i}.canonicalExerciseId`,h.canonicalExerciseId)}${semantic(`weekly.training.highlights.${i}.headline`,h.headline)}${semantic(`weekly.training.highlights.${i}.tone`,h.tone)}</span></div>`).join('');
 const groups=t.priorityGroups.map((g,i)=>`<div class="priority"><i class="dot" style="--tone:${g.tone==='warning'?'var(--amber)':g.tone==='evidence'?'var(--blue)':'var(--green)'}"></i><div><strong>${semantic(`weekly.training.priorityGroups.${i}.label`,g.label)}</strong><span>${semantic(`weekly.training.priorityGroups.${i}.statusLabel`,g.statusLabel)} across ${semantic(`weekly.training.priorityGroups.${i}.comparableExerciseCount`,g.comparableExerciseCount)} exercises.</span><span class="screen-only">${semantic(`weekly.training.priorityGroups.${i}.areaId`,g.areaId)}${semantic(`weekly.training.priorityGroups.${i}.tone`,g.tone)}</span></div></div>`).join('');
 const training=wid('W23','WeeklyBriefingSections','BriefingTrainingResponseCard',`<div class="card tinted tint-green">
   ${wid('W24','W23','TrainingHeader',`<div class="section-head"><div class="icon">◆</div><span class="eyebrow">TRAINING RESPONSE</span></div>`)}
   ${wid('W25','W23','TrainingHeadline',`<h3 class="editorial-title training-copy">${semantic('weekly.training.headline',t.headline)}</h3>`)}
   ${wid('W26','W23','TrainingNarrative',`<p class="body-copy">${semantic('weekly.training.narrative',t.narrative)}</p>`)}
   ${wid('W27','W23','TrainingCoverage',`<div class="coverage-line">${semantic('weekly.training.trainingDayCount',t.trainingDayCount)} training days · ${semantic('weekly.training.comparableCategoryCount',t.comparableCategoryCount)} reviewed categories · ${semantic('weekly.training.improvingCount',t.improvingCount)} improving · ${semantic('weekly.training.steadyCount',t.steadyCount)} steady · ${semantic('weekly.training.plateauingCount',t.plateauingCount)} plateauing<span class="screen-only">${semantic('weekly.training.insufficientCount',t.insufficientCount)}</span></div>`)}
   ${wid('W28','W23','TrainingHighlights',`<div class="sub-label">🔥 HIGHLIGHTS</div><div class="highlight-list">${highlights}</div>`)}
   ${wid('W29','W23','TrainingPriorityGroups',`<div class="sub-label" style="color:var(--muted)">🎯 PRIORITY MUSCLE GROUPS</div><div class="priority-list">${groups}</div>`)}
 </div>`);
 const coach=wid('W33','WeeklyBriefingSections','BriefingCoachFinale',`<div class="coach"><span class="eyebrow">COACH'S TAKE</span>${wid('W34','W33','FinaleTakeaway',`<div style="margin-top:20px"><h3>💡 Biggest Takeaway</h3><p>${semantic('weekly.coachTake.biggestTakeaway',w.coachTake.biggestTakeaway)}</p></div>`)}<hr>${wid('W35','W33','FinaleRecommendation',`<div><h3>🧠 What To Do</h3><p>${semantic('weekly.coachTake.recommendation',w.coachTake.recommendation)}</p></div>`)}<hr>${wid('W36','W33','FinaleActions',`<h3>🎯 Into Next Week</h3><div class="actions">${w.coachTake.intoNextWeek.map((a,i)=>`<div class="action"><span class="num">${i+1}</span><p>${semantic(`weekly.coachTake.intoNextWeek.${i}`,a)}</p></div>`).join('')}</div>`)}</div>`);
 const rev=briefing.revisionProvenance?wid('W37','BriefingDetailView','BriefingRevisionBanner',`<div class="revision"><strong>This Briefing was revised</strong><p>${semantic('revisionProvenance.reason',briefing.revisionProvenance.reason)}</p><p class="support">First published Aug 30, 9:15 AM · ${semantic('replacedHistory.0.headline',briefing.replacedHistory[0].headline)}<span class="screen-only">${semantic('revisionProvenance.priorPublicationId',briefing.revisionProvenance.priorPublicationId)}${semantic('revisionProvenance.priorPublicationVersion',briefing.revisionProvenance.priorPublicationVersion)}${semantic('revisionProvenance.replacementTimestamp',briefing.revisionProvenance.replacementTimestamp)}${semantic('replacedHistory.0.generatedAt',briefing.replacedHistory[0].generatedAt)}${semantic('replacedHistory.0.replacedReason',briefing.replacedHistory[0].replacedReason)}</span></p></div>`):'';
 return `<article class="phone ${theme}" data-theme="${theme}" data-label="${esc(label)}" data-fixture-id="${briefing.id}">${status()}<div class="content">${wid('W01','BriefingDetailView','BriefingDetailPreHeroNavigation',`<nav class="nav"><div class="nav-chip"><span class="back">‹</span> Home</div><div class="nav-chip">▦ Briefing History</div></nav>`)}<div class="stack">${hero}${energy}${weight}${photos}${training}${includeRecovery?recovery():''}${coach}${rev}</div></div></article>`;
}
async function main(){const all=globalThis.__FIXTURES__||await fetch('./NATIVE-BRIEFINGS-FIXTURE.json').then(r=>r.json());const b=all.find(x=>x.id===fixtureId);if(!b)throw Error('Fixture not found');const row=document.getElementById('board-row');row.innerHTML=`<div class="column baseline-column"><h2>Build 85 structural baseline</h2>${renderPhone(b,'baseline',false,'Build 85 baseline')}</div><div class="column"><h2>Faithful dark</h2>${renderPhone(b,'dark',true,'Faithful dark')}</div><div class="column"><h2>Faithful mineral light</h2>${renderPhone(b,'light',true,'Faithful mineral light')}</div>`;document.documentElement.dataset.ready='true'}
main();
</script>
