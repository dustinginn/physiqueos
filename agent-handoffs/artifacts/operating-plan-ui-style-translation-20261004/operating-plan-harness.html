<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Operating Plan translation</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#04080d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit}
.op-phone{--op-bg:#06131e;--op-text:#f5f7f5;--op-muted:#92a5ae;--op-line:#203541;--op-surface:#0e2230;--op-surface-2:#142c39;--op-deep:#0a1c29;--op-teal:#27c8ba;--op-green:#54dfa0;--op-cyan:#47c8da;--op-amber:#f1bd54;--op-purple:#9e80ff;--op-navy:#123e62;--op-red:#ed7081;width:402px;min-height:874px;color:var(--op-text);background:var(--op-bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0009}
.op-phone.light{--op-bg:#efeee7;--op-text:#0b1c2d;--op-muted:#61737b;--op-line:#cbd5d0;--op-surface:#fbfaf6;--op-surface-2:#dcebe7;--op-deep:#143f61;--op-teal:#0b9185;--op-green:#138a5e;--op-cyan:#168a9b;--op-amber:#b5740a;--op-purple:#7354da;--op-navy:#143f61;--op-red:#c24f63}
.status{height:46px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between;font-size:13px;font-weight:850;position:relative}.island{position:absolute;top:11px;left:50%;width:118px;height:34px;border-radius:22px;background:#01050a;transform:translateX(-50%)}
.op-nav{min-height:48px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid var(--op-line);color:var(--op-muted);font-size:14px;font-weight:760}.op-nav .back{min-height:44px;display:flex;align-items:center;gap:6px}.op-page{padding:18px 18px 34px}.op-eyebrow{font-size:10px;line-height:1.25;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--op-purple)}h1,h2,h3,p{margin:0}h1{font-size:31px;line-height:1.04;letter-spacing:-.045em}h2{font-size:18px;line-height:1.18;letter-spacing:-.02em}h3{font-size:15px;line-height:1.2}.op-body{font-size:14px;line-height:1.46;color:var(--op-muted)}.op-small{font-size:12px;line-height:1.4;color:var(--op-muted)}.op-header{margin-bottom:19px}.op-header h1{margin:7px 0 8px}.op-header .op-body{max-width:348px}
.op-domain-list{display:grid;gap:11px}.op-domain{min-height:102px;padding:14px 14px 13px;border:1px solid var(--op-line);border-radius:18px;background:var(--op-surface);display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:start}.light .op-domain{box-shadow:0 8px 22px #173b5010}.op-domain.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--op-teal) 18%,var(--op-surface)),color-mix(in srgb,var(--op-navy) 34%,var(--op-surface)))}.light .op-domain.primary{background:linear-gradient(135deg,#d8eee8,#d8e5ec)}.op-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#27c8ba20;color:var(--op-teal);font-size:17px;font-weight:900}.nutrition .op-icon{background:#54dfa01d;color:var(--op-green)}.training .op-icon{background:#47c8da1c;color:var(--op-cyan)}.op-domain-label{font-size:9px;font-weight:900;letter-spacing:.1em;color:var(--op-muted);text-transform:uppercase;margin:1px 0 4px}.op-domain h2{font-size:16px}.op-domain .op-small{margin-top:5px}.op-chip{align-self:start;display:flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;background:#54dfa017;color:var(--op-green);font-size:10px;font-weight:850}.op-chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.op-chevron{font-size:18px;color:var(--op-muted);margin-top:41px}.op-domain.compact{min-height:76px;grid-template-columns:34px 1fr auto;padding:11px 13px}.op-domain.compact .op-icon{width:34px;height:34px;border-radius:11px;font-size:14px}.op-domain.compact .op-domain-label{margin-top:0}.op-domain.compact .op-chevron{margin-top:23px}.op-divider-label{display:flex;align-items:center;gap:9px;margin:20px 0 10px}.op-divider-label:after{content:"";height:1px;flex:1;background:var(--op-line)}
.op-strategy-hero{border-radius:22px;padding:18px;margin:0 0 17px;background:linear-gradient(145deg,#118e86,#123f63);color:white;position:relative;overflow:hidden}.op-strategy-hero:after{content:"";position:absolute;width:190px;height:190px;border:34px solid #50dda04a;border-radius:50%;right:-83px;bottom:-121px}.light .op-strategy-hero{background:linear-gradient(145deg,#d3ebe6,#c8dee9);color:var(--op-text)}.op-strategy-hero .op-eyebrow{color:#d5c9ff}.light .op-strategy-hero .op-eyebrow{color:var(--op-purple)}.op-strategy-hero h1{font-size:28px;max-width:300px;margin:7px 0 8px}.op-strategy-hero p{color:#d5e2e5;max-width:318px}.light .op-strategy-hero p{color:var(--op-muted)}
.op-meta{display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #ffffff3a;margin-top:16px;padding-top:13px;position:relative;z-index:1}.light .op-meta{border-color:#46687135}.op-meta>div+div{border-left:1px solid #ffffff2a;padding-left:11px}.light .op-meta>div+div{border-color:#46687135}.op-label{font-size:9px;line-height:1.2;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#a7c0c5;margin-bottom:5px}.light .op-label{color:var(--op-muted)}.op-value{font-size:13px;line-height:1.25;font-weight:820}.op-active{display:flex;align-items:center;gap:6px;color:#72efb2}.light .op-active{color:var(--op-green)}.op-active:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.op-section{padding:17px 2px 0}.op-section-title{display:flex;align-items:center;gap:9px;margin-bottom:11px}.op-section-title span{width:28px;height:28px;border-radius:9px;background:#27c8ba1c;color:var(--op-teal);display:grid;place-items:center;font-size:13px;font-weight:900}.op-section-title h2{font-size:16px}.op-metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}.op-metric{min-height:96px;border-radius:17px;padding:14px;background:var(--op-surface)}.op-metric.energy{background:linear-gradient(145deg,#123c55,#102735)}.light .op-metric.energy{background:linear-gradient(145deg,#163f61,#176d73);color:white}.light .op-metric.energy .op-label{color:#d7e4e6}.op-metric strong{display:block;font-size:22px;line-height:1.1;letter-spacing:-.025em;margin-top:6px}.op-fields{border-top:1px solid var(--op-line)}.op-field{display:grid;grid-template-columns:126px 1fr;gap:10px;padding:13px 2px;border-bottom:1px solid var(--op-line);align-items:start}.op-field .op-label{margin:2px 0 0}.op-field .op-value{font-size:14px;line-height:1.36}.op-field.rule{grid-template-columns:1fr}.op-field.rule .op-label{margin-bottom:4px}.op-note{margin-top:16px;padding:13px 14px;border-left:3px solid var(--op-cyan);background:#47c8da0d;border-radius:0 13px 13px 0}.op-note b{display:block;font-size:13px;margin-bottom:4px}.op-action{min-height:52px;margin-top:19px;border:0;border-radius:15px;background:var(--op-navy);color:white;display:grid;place-items:center;width:100%;font-size:15px;font-weight:860}.op-action.nutrition{background:linear-gradient(135deg,#168c79,#153d63)}.op-action.training{background:linear-gradient(135deg,#15899a,#163d63)}.op-readonly{display:flex;align-items:center;gap:8px;margin-top:17px;color:var(--op-muted);font-size:12px;line-height:1.4}.op-readonly span{width:25px;height:25px;border-radius:8px;background:var(--op-surface);display:grid;place-items:center}.op-bottom{height:22px}
@media(max-width:440px){body{background:var(--op-bg,#04080d)}}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search);const surface=q.get('surface')||'root';const theme=q.get('theme')||'dark';
const details={
energy:{eyebrow:'ENERGY STRATEGY',title:'Lean Mass Build Energy Plan',purpose:'Follow the current intake and activity targets for this phase while watching how the body responds and keeping the Guardrail in view.',goal:'Your Build Lean Mass goal',started:'August 15, 2026',fields:[['Plan Type',"Following the active phase's targets"],['Caloric Intake','2,500 kcal/day'],['Activity Target','800 kcal/day'],['Evidence Monitoring','Weekly evidence review'],['Strategic Review','Monthly · DEXA and body composition aligned'],['Strategy Changes','Adjusted as the evidence supports it']],action:null},
nutrition:{eyebrow:'NUTRITION STRATEGY',title:'Macro Strategy',purpose:'Define how daily intake is composed across protein, carbohydrates, and fats to support your Build Lean Mass goal.',goal:'Your Build Lean Mass goal',started:'July 25, 2026',fields:[['Protein Target','1 g per lb of body weight'],['Carbohydrate Approach','Performance'],['Fat Approach','Sustainable Minimum'],['Macro Philosophy','Flexible across training and rest days']],action:'Edit Strategy'},
training:{eyebrow:'TRAINING STRATEGY',title:'Build Lean Mass Training',purpose:'Build the weekly structure, training focus, and progression needed to support your Build Lean Mass goal.',goal:'Your Build Lean Mass goal',started:'July 25, 2026',fields:[['Weekly Structure','9 area sessions'],['Training Focus','Chest, Back'],['Progression','Moderate'],['Current Goal Phase','Lean Mass Build'],['Training Context','Goal-level strategy']],action:'Edit Strategy'}
};
const rootDomains=[
['energy','ENERGY STRATEGY','Current Phase Energy Plan','2,500 kcal/day intake · 800 kcal/day activity · Monthly review','⌁'],
['nutrition','NUTRITION','Calorie Calibration','1 g per lb of body weight · intake adjusted gradually','◒'],
['training','TRAINING','Maintenance Training Strategy','9 weekly area sessions · Moderate progression','◇'],
['compact','RECOVERY','Recovery Strategy','Foam Rolling','◉'],
['compact','PEPTIDES','Peptide Strategy','Retatrutide, Tesamorelin','✦'],
['compact','SUPPLEMENTS','Supplement Strategy','Current daily support','＋'],
['compact','TRACKING','Tracking','Morning Weigh-In Support','◫'],
['compact','COACHING UPDATES','Coaching Updates','Midweek calibration and weekly synthesis','▤']
];
function chrome(content){return `<main class="op-phone ${theme==='light'?'light':''}" data-theme="${theme}" data-surface="${surface}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span><div class="island"></div></div>${surface==='root'?'<div class="op-nav"><span class="back">‹ You</span></div>':'<div class="op-nav"><span class="back">‹ Operating Plan</span></div>'}${content}<div class="op-bottom"></div></main>`}
function rootPage(){return `<div class="op-page"><header class="op-header"><div class="op-eyebrow">OPERATING PLAN</div><h1>Your Operating Plan</h1><p class="op-body">Current strategy across every domain, and the protocols that support it.</p></header><div class="op-domain-list">${rootDomains.map((d,i)=>`<section class="op-domain ${i<3?'primary ':''}${d[0]}" data-domain="${d[1]}"><div class="op-icon" aria-hidden="true">${d[4]}</div><div><div class="op-domain-label">${d[1]}</div><h2>${d[2]}</h2><p class="op-small">${d[3]}</p><div class="op-chip" style="margin-top:8px;width:max-content">Active</div></div><div class="op-chevron">›</div></section>`).join('')}</div></div>`}
function detailPage(d,key){const leading=d.fields.slice(0,key==='training'?1:2),rest=d.fields.slice(leading.length);return `<div class="op-page"><section class="op-strategy-hero"><div class="op-eyebrow">${d.eyebrow}</div><h1>${d.title}</h1><p class="op-body">${d.purpose}</p><div class="op-meta"><div><div class="op-label">Goal</div><div class="op-value">${d.goal}</div></div><div><div class="op-label">Started</div><div class="op-value">${d.started}</div></div><div><div class="op-label">Status</div><div class="op-value op-active">Active</div></div></div></section><section class="op-section" data-section="Current Strategy"><div class="op-section-title"><span>${key==='energy'?'⌁':key==='nutrition'?'◒':'◇'}</span><h2>Current Strategy</h2></div><div class="op-metrics">${leading.map(x=>`<div class="op-metric ${key==='energy'?'energy':''}"><div class="op-label">${x[0]}</div><strong>${x[1]}</strong></div>`).join('')}</div><div class="op-fields">${rest.map(x=>`<div class="op-field" data-field="${x[0]}"><div class="op-label">${x[0]}</div><div class="op-value">${x[1]}</div></div>`).join('')}</div></section>${d.action?`<button class="op-action ${key}" type="button">${d.action}</button>`:''}</div>`}
document.getElementById('app').innerHTML=chrome(surface==='root'?rootPage():detailPage(details[surface],surface));
</script></body></html>
