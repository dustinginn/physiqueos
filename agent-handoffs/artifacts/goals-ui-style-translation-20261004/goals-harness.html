lor:var(--green)}.phase.completed .phase-status{color:var(--amber)}.phase h3{margin:3px 0 4px}.phase .mini-progress{width:100%;margin-top:8px}.guardrail{margin:19px 0 4px;padding:16px 16px 16px 18px;background:linear-gradient(90deg,#23b9c026,transparent);border-left:4px solid var(--cyan);border-radius:0 16px 16px 0}.light .guardrail{background:linear-gradient(90deg,#2cb9be1e,#ffffff99)}.guardrail .eyebrow{color:var(--cyan)}.guardrail h3{margin:6px 0}.state{display:inline-flex;align-items:center;gap:6px;margin-top:8px;border-radius:16px;background:#3add9820;color:var(--green);font-size:11px;font-weight:800;padding:6px 9px}.comp{width:100%;border-collapse:collapse;margin-top:4px}.comp th,.comp td{text-align:right;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px}.comp th:first-child,.comp td:first-child{text-align:left}.comp th{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.comp td{font-weight:750}.comp td:first-child{color:var(--muted);font-weight:650}.goal-progress{margin-top:16px}.goal-progress-head{display:flex;justify-content:space-between;margin-bottom:8px}.goal-progress strong{font-size:21px}.evidence-list{display:grid;gap:0}.evidence-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.evidence-row:last-child{border-bottom:0}.evidence-row b:last-child{margin-left:auto;color:var(--green)}.timeline{padding-left:5px}.milestone{border-left:2px solid var(--line);padding:0 0 21px 18px;position:relative}.milestone:before{content:"";position:absolute;width:9px;height:9px;background:var(--teal);left:-5px;top:2px;border-radius:50%}.milestone:last-child{padding-bottom:0}.coach{background:linear-gradient(145deg,#1d3360,#112946);border:1px solid #785ff55a;border-radius:20px;padding:18px}.light .coach{background:linear-gradient(145deg,#dce3f8,#d0e4eb)}.coach-block{padding-top:13px;margin-top:13px;border-top:1px solid #ffffff24}.light .coach-block{border-color:#142d4830}.button{min-height:46px;border-radius:13px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;margin-top:15px;font-size:13px;font-weight:800}.light .button{background:#143e60}.phase-hero{margin:0 -18px;padding:23px 22px;background:linear-gradient(145deg,#0c7b72,#0b3e5a)}.light .phase-hero{background:linear-gradient(145deg,#d5eee8,#c6dde6)}.phase-hero.completed{background:linear-gradient(145deg,#6b4b16,#243343)}.light .phase-hero.completed{background:linear-gradient(145deg,#f4e2bc,#dde2dd)}.phase-hero h1{margin:8px 0}.phase-hero .progress{margin-top:18px}.phase-hero.completed .progress i{background:var(--amber)}.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden}.fact{background:var(--surface);padding:14px}.fact.wide{grid-column:1/-1}.fact .value{font-size:14px}.empty-data{border-left:3px solid var(--line);padding:10px 0 10px 13px;margin-top:11px}.empty-data p{font-size:12px;color:var(--muted)}.completed-hero{margin:0 -18px;padding:22px;background:linear-gradient(145deg,#654717,#17324b)}.light .completed-hero{background:linear-gradient(145deg,#f1ddb6,#cfdfdf)}.trophy{width:54px;height:54px;border-radius:18px;background:#f5bd4a26;color:var(--amber);display:grid;place-items:center;font-size:27px}.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo{aspect-ratio:3/4;border-radius:18px;background:linear-gradient(160deg,#1e3b45,#0d1925);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);position:relative;overflow:hidden}.light .photo{background:linear-gradient(160deg,#d2dfd9,#b9cbc8)}.photo:before{content:"AUTHENTICATED\A FOUNDER MEDIA";white-space:pre;text-align:center;font-size:9px;font-weight:850;letter-spacing:.08em;line-height:1.5}.photo:after{content:"";position:absolute;width:70px;height:180px;border:2px solid currentColor;border-radius:44px;opacity:.23}.photo-meta{margin-top:8px}.photo-meta .label{color:var(--text </style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'root',theme=q.get('theme')||'dark';
const chrome=(content,{back='',nav=true}={})=>`<main class="phone ${theme==='light'?'light':''}" data-surface="${surface}" data-theme="${theme}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span></div><div class="island"></div>${back?`<div class="crumb">‹ ${back}</div>`:''}${content}${nav?`<div class="nav"><div>⌂<span>Home</span></div><div class="selected"><b>◎</b>Goals</div><div><b>＋</b>Log</div><div><b>▣</b>Evidence</div><div><b>●</b>You</div></div>`:''}</main>`;
const section=(eye,title,body,cls='')=>`<section class="section ${cls}" data-section="${title.toLowerCase().replaceAll(' ','-').replaceAll("'",'')}"><div class="section-head"><div><div class="eyebrow">${eye}</div><h2>${title}</h2></div></div>${body}</section>`;
const phase=(order,name,status,dates,progress)=>`<div class="phase ${status==='Completed'?'completed':''}" data-phase="${order}"><div class="phase-top"><span class="phase-status">Phase ${order} · ${status}</span><span class="small">›</span></div><h3>${name}</h3><p class="small">${dates}</p><div class="mini-progress" role="progressbar" aria-label="${name} ${progress} percent" aria-valuenow="${progress}"><i style="width:${progress}%"></i></div></div>`;
const journey=()=>`<div class="journey">${phase(1,'Establish Maintenance','Completed','Started Jul 19 · Completed',100)}${phase(2,'Lean Mass Build','Active','Started Aug 15 · Monthly DEXA',58)}</div><p class="body" style="margin-top:11px">Build meaningful lean mass from the newly established maintenance baseline while protecting body composition.</p>`;
const guardrail=()=>`<div class="guardrail" data-role="guardrail"><div class="eyebrow">Persistent guardrail · Across both phases</div><h3>Maintain approximately 8–9% body fat</h3><span class="state">● 8.1% · Within range</span><p class="body" style="margin-top:9px">Inside the range, so the guardrail is not limiting the build.</p></div>`;
const root=()=>chrome(`<div class="screen"><div class="root-head"><div class="eyebrow">Goals</div><h1>Your Goals</h1><p class="body">Every goal is continuously evaluated using the best available evidence.</p></div>${section('Current journey','Primary Goal',`<a class="goal-row"><div class="row-top"><div class="icon">↗</div><div class="row-copy"><div class="eyebrow">Active Goal</div><h2>Build Lean Mass</h2><div class="status-line"><b class="strong">Active</b><span>•</span><span>79% confidence</span></div><div class="phase-line">Phase 2 · Lean Mass Build</div></div><div class="row-arrow">›</div></div><div class="mini-progress" role="progressbar" aria-label="Goal progress 58 percent" aria-valuenow="58"><i style="width:58%"></i></div><div class="status-line" style="justify-content:space-between;margin-top:7px"><span>58% complete</span><span>Oct 31 destination</span></div></a>`)}${section('History','Completed Goals',`<a class="goal-row completed"><div class="row-top"><div class="icon">✓</div><div class="row-copy"><div class="eyebrow accent-amber">Completed Goal</div><h2>Visible Abs at Rest</h2><div class="status-line"><span>Completed</span><span>•</span><span>May 24 → Jul 18</span></div><div class="phase-line">7.7% Body Fat</div></div><div class="row-arrow">›</div></div></a>`)}<div style="margin-top:18px"><div class="goal-row neutral"><div class="row-top"><div class="icon">＋</div><div class="row-copy"><h3>Add Goal</h3><p class="small">Founder Production is read-only.</p></div></div></div></div></div>`);
const active=()=>chrome(`<div class="hero" data-section="hero"><div class="eyebrow">Active Goal</div><div class="hero-title strong">Build Lean Mass</div><p class="destination">Build 10 lb of lean mass by October 31, 2026</p><div class="confidence"><div class="ring" aria-label="79 percent confidence, Moderate"><b>79%</b><span>CONFIDENCE</span></div><div class="confidence-copy"><b>Moderate</b><p style="margin-top:5px">You are more than halfway to the 10 lb lean-mass goal. The build plan is clearly working. There is enough time to finish ahead of schedule if this level of progress continues.</p><div class="provenance">As of the Sep 23 Midweek Briefing</div></div></div></div>${section('The path','Your Journey',journey())}${section('Current progress','Body Composition',`<div class="surface"><table class="comp"><thead><tr><th></th><th>Baseline<br>Jul 18</th><th>Latest<br>Sep 12</th><th>Change</th></tr></thead><tbody><tr><td>Lean Mass</td><td>147.5 lb</td><td>153.3 lb</td><td class="accent-green">+5.8 lb</td></tr><tr><td>Fat Mass</td><td>12.8 lb</td><td>14.2 lb</td><td>+1.4 lb</td></tr><tr><td>Body Fat</td><td>7.7%</td><td>8.1%</td><td>+0.4 pts</td></tr><tr><td>Weight</td><td>167.4 lb</td><td>174.7 lb</td><td>+7.3 lb</td></tr></tbody></table><p class="footnote">DEXA · goal baseline and latest scan</p></div><div class="goal-progress"><div class="goal-progress-head"><b>Goal progress</b><strong>58%</strong></div><div class="progress" role="progressbar" aria-label="Goal progress 58 percent" aria-valuenow="58"><i style="width:58%"></i></div><div class="status-line" style="justify-content:space-between;margin-top:8px"><span>4.2 lb to go</span><span>Measured by monthly DEXA</span></div></div>`)}${guardrail()}${section('Since Aug 15 · 38 training days','Training Progress',`<p class="body strong">15 of 23 comparable movements are improving, led by lower body, upper body and arms. Single-Leg Leg Press is down.</p><div class="evidence-list"><div class="evidence-row"><span>↗</span><b>Leg Press High And Narrow Feet</b><b>+67.2%</b></div><div class="evidence-row"><span>↗</span><b>Leg Extensions</b><b>+50.0%</b></div><div class="evidence-row"><span>↗</span><b>Hack Squats</b><b>+48.1%</b></div></div>`)}${section('Major milestones','Evidence Turning Points',`<div class="timeline"><div class="milestone"><div class="eyebrow">Jul 18</div><h3>Goal baseline DEXA</h3><p class="small">The starting point every later scan is measured against.</p></div><div class="milestone"><div class="eyebrow">Aug 15</div><h3>Establish Maintenance completed · Lean Mass Build began</h3><p class="small">Establish Maintenance was completed and Lean Mass Build began. The Aug 15 DEXA showed +0.8 lb of lean mass from the baseline.</p></div><div class="milestone"><div class="eyebrow">Sep 12</div><h3>Past halfway to the lean-mass target</h3><p class="small">Lean mass rose 5.0 lb in the month since the Aug 15 scan, and body fat moved into the guardrail range.</p></div></div>`)}${section('Latest coaching',"Coach's Take",`<div class="coach"><div class="eyebrow">Sep 23 Midweek Briefing · Coach's Take</div><div class="coach-block"><h3>What To Do</h3><p class="body" style="margin-top:5px">Keep executing consistently. Keep the current setup in place.</p></div><div class="coach-block"><h3>What To Watch</h3><p class="body" style="margin-top:5px">Treat the calorie estimate as directional: calorie totals come from logged meals rather than a confirmed full-day total, active calories are a wearable estimate, and food and activity were both recorded on 2 of 3 days. Keep calorie targets where they are unless something more than the estimate calls for a change. The next DEXA will show whether this kind of progress continues while body fat stays in a good place.</p></div><div class="button">Open Midweek Briefing <span>›</span></div></div>`)}`,{back:'Goals'});
const phasePage=(completed=false)=>chrome(`<div class="phase-hero ${completed?'completed':''}"><div class="eyebrow ${completed?'accent-amber':'accent-green'}">Phase ${completed?'1':'2'} · ${completed?'Completed':'Active'}</div><h1>${completed?'Establish Maintenance':'Lean Mass Build'}</h1><p class="body">${completed?'Started Jul 19 · Completed':'Started Aug 15 · Monthly DEXA'}</p>${!completed?'<p class="body" style="margin-top:12px;color:var(--text)">Build meaningful lean mass from the newly established maintenance baseline while protecting body composition.</p>':''}<div class="progress" role="progressbar" aria-label="Phase progress ${completed?100:58} percent" aria-valuenow="${completed?100:58}"><i style="width:${completed?100:58}%"></i></div><div class="status-line" style="justify-content:space-between;margin-top:8px"><span>Phase progress</span><b>${completed?100:58}%</b></div></div>${!completed?section('Phase evidence','Evidence in View',`<div class="surface"><div class="eyebrow">Build Lean Mass</div><p class="body strong" style="margin-top:7px">15 of 23 comparable movements are improving, led by lower body, upper body and arms. Single-Leg Leg Press is down.</p></div>`):''}${!completed?section('What stays protected','Guardrail reference',`<div class="guardrail"><div class="eyebrow">Goal-level requirement</div><h3>Maintain approximately 8–9% body fat</h3><p class="small">Referenced here, but owned by the Goal across phases.</p></div>`):''}${section('Distinct measures','Goal Context',`<div class="facts"><div class="fact"><div class="label">Goal progress</div><div class="value">58%</div></div><div class="fact"><div class="label">Confidence</div><div class="value">79% · Moderate</div></div><div class="fact wide"><div class="label">Guardrail</div><div class="value">8.1% · Within range</div></div></div>`)}`,{back:'Build Lean Mass'});
const completed=()=>chrome(`<div class="completed-hero"><div style="display:flex;justify-content:space-between;gap:15px"><div><div class="eyebrow accent-amber">Completed Goal</div><h1 style="margin:8px 0">Visible Abs at Rest</h1><p class="body">Completed · May 24 → Jul 18</p></div><div class="trophy">★</div></div><div class="metric-strip"><div><div class="label">Outcome</div><div class="value">7.7%</div></div><div><div class="label">Measure</div><div class="value">Body Fat</div></div><div><div class="label">State</div><div class="value">Complete</div></div></div></div>${section('The story','Journey Recap',`<p class="body">This journey began with a clear finish line: reveal visible abdominal definition without sacrificing the muscle built before the cut. Across eight deliberate weeks, body fat moved from 13.6% to 7.7%, the waist and midsection became substantially leaner, and training continued to protect the shape underneath. The final DEXA and relaxed photos told the same story—the goal had reached its intended conclusion.</p>`)}${section('The moments that mattered','Journey Highlights',`<div class="timeline"><div class="milestone"><div class="eyebrow">May 24</div><h3>The measured starting point</h3><p class="small">13.6% body fat established the journey baseline.</p></div><div class="milestone"><div class="eyebrow">Jun 20</div><h3>Definition became measurable</h3><p class="small">DEXA reached 10.7% body fat as upper-ab definition and waist separation became increasingly visible.</p></div><div class="milestone"><div class="eyebrow">Jul 18</div><h3>The finish line aligned</h3><p class="small">The final DEXA reached 7.7% body fat and the relaxed photo confirmed visible abdominal definition at rest.</p></div><div class="milestone"><div class="eyebrow">Jul 18</div><h3>Lean mass largely preserved</h3><p class="small">The journey finished with 147.5 lb of measured lean mass—within the established preservation tolerance.</p></div></div>`)}${section('The transformation','Beginning → Completion',photosMarkup())}${section('Final Body Composition','The measurement that closed the journey',`<div class="outcome"><div class="eyebrow accent-green">Jul 18 DEXA</div><div class="facts" style="margin-top:13px"><div class="fact"><div class="label">Body Fat</div><div class="value">7.7%</div></div><div class="fact"><div class="label">Lean Mass</div><div class="value">147.5 lb</div></div><div class="fact"><div class="label">Fat Mass</div><div class="value">12.8 lb</div></div><div class="fact"><div class="label">Weight</div><div class="value">167.4 lb</div></div></div><p class="body" style="margin-top:15px">This scan represents the successful conclusion of the cut because the numerical target and the final visual confirmation converged: fat mass fell meaningfully, abdominal definition was visible at rest, and measured lean mass remained within the journey’s preservation tolerance.</p><div class="button">View Final Goal Briefing <span>›</span></div></div>`)}${section('The foundation','How This Goal Was Achieved',`<div class="check"><i>✓</i><span>Body fat reduced from 13.6% to 7.7%.</span></div><div class="check"><i>✓</i><span>Lean mass largely preserved through the cut.</span></div><div class="check"><i>✓</i><span>Nutrition consistency maintained through the finish.</span></div><div class="check"><i>✓</i><span>Training performance remained strong enough to protect muscularity.</span></div>`)}<section class="section"><div class="unlocked"><div class="eyebrow">What This Unlocked</div><h2 style="margin:8px 0">Build Lean Mass</h2><p class="body">Reaching 7.7% body fat while largely preserving lean mass created an excellent foundation for the next Build Lean Mass journey.</p><div class="button">View Current Goal <span>›</span></div></div></section>`,{back:'Goals'});
function photosMarkup(){return `<div class="photo-pair" data-photo-requirement="first-final-real"><div><div class="photo" role="img" aria-label="Beginning front relaxed photo, May 24"></div><div class="photo-meta"><div class="label">Beginning</div><div class="small">May 24 · Front relaxed</div></div></div><div><div class="photo" role="img" aria-label="Completion front relaxed photo, Jul 18"></div><div class="photo-meta"><div class="label">Completion</div><div class="small">Jul 18 · Front relaxed</div></div></div></div><p class="footnote">Review harness redacts pixels. Production binding remains the authenticated first goal-related and qualified final front-relaxed media IDs.</p><div class="button">View full photo history <span>›</span></div>`}
const journeyFocus=()=>chrome(`<div class="screen"><div class="eyebrow">Build Lean Mass</div><h1 style="margin:7px 0 5px">Your Journey</h1><p class="body">One Goal, two sequential phases, one cross-phase guardrail.</p>${section('Sequential plan','Phases',journey())}${guardrail()}${section('Goal destination','Build 10 lb of lean mass',`<div class="goal-progress"><div class="goal-progress-head"><b>Overall progress</b><strong>58%</strong></div><div class="progress" role="progressbar" aria-label="Overall progress 58 percent" aria-valuenow="58"><i style="width:58%"></i></div><p class="small" style="margin-top:8px">4.2 lb to go · Target October 31, 2026</p></div>`)}</div>`,{back:'Build Lean Mass'});
const photoFocus=()=>chrome(`<div class="screen"><div class="eyebrow">Visible Abs at Rest</div><h1 style="margin:7px 0 5px">Beginning → Completion</h1><p class="body">The completed Goal's first and final real progress-photo roles.</p>${section('Authenticated evidence','Front relaxed',photosMarkup())}<div class="notice">Pixels intentionally redacted in this design harness. Build 85 fetches each opaque mediaId through Founder Production authentication; the tiles themselves are not expandable.</div></div>`,{back:'Completed Goal'});
const relationship=()=>chrome(`<div class="screen"><div class="eyebrow">Goal architecture</div><h1 style="margin:7px 0 5px">Goal, phases & guardrail</h1><p class="body">Structure is conveyed by geometry and labels, never by color alone.</p>${section('Destination','Build Lean Mass',`<div class="surface"><div class="label">Goal</div><h2>Build 10 lb of lean mass</h2><p class="small" style="margin-top:5px">One strategic outcome · Oct 31, 2026</p></div>`)}${section('Sequential plan','Two phases',`<div class="relationship"><div class="rel-phase done"><div class="dot">1</div><div><div class="phase-status accent-amber">Completed</div><h3>Establish Maintenance</h3></div></div><div class="rel-line"></div><div class="rel-phase"><div class="dot">2</div><div><div class="phase-status">Active</div><h3>Lean Mass Build</h3></div></div><div class="rel-guard"><div class="eyebrow accent-teal">Persistent constraint · Not Phase 3</div><h3 style="margin-top:6px">Maintain approximately 8–9% body fat</h3><p class="small" style="margin-top:4px">Applies across the Goal wherever relevant.</p></div></div>`)}</div>`,{back:'Goals'});
const statesPage=()=>chrome(`<div class="screen"><div class="eyebrow">Goals</div><h1 style="margin-top:7px">System states</h1>${section('Representative','Loading, error & empty',`<div class="states"><div class="state-card" data-state="loading"><div class="spinner"></div><h3>Loading Goals</h3><p class="small" style="margin-top:5px">Progress announced to VoiceOver.</p></div><div class="state-card" data-state="error"><div class="icon">!</div><h3 style="margin-top:10px">Goals could not be loaded.</h3><p class="small" style="margin-top:5px">Pull to refresh remains available.</p></div><div class="state-card" data-state="empty"><div class="icon">＋</div><h3 style="margin-top:10px">Add Goal</h3><p class="small" style="margin-top:5px">Founder Production is read-only.</p></div><div class="state-card" data-state="unavailable"><div class="icon">↯</div><h3 style="margin-top:10px">This goal is unavailable.</h3><p class="small" style="margin-top:5px">Supporting-objective routes resolve here in current Founder Production.</p></div></div>`)}</div>`);
const screens={root,active,'phase-current':()=>phasePage(false),'phase-completed':()=>phasePage(true),completed,'journey':journeyFocus,'photos':photoFocus,'relationship':relationship,'states':statesPage};document.getElementById('app').innerHTML=(screens[surface]||root)();
</script></body></html>
