<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Photos + DEXA Founder Review</title><link rel="stylesheet" href="source/evidence.css"></head><body><main class="review"><header class="review-head"><div class="kicker">Founder review · production parity correction</div><h1 id="review-title">Progress Photos + DEXA</h1><p id="review-copy">Dark and mineral-light pairs for every corrected structural and disclosure state.</p></header><section id="review-pairs"></section></main><script>
const all={photos:[['P1','Photos root'],['P2','Uploaded Photos expanded'],['P3','Gallery paired comparison'],['P4','Source History expanded'],['P5','Full-screen inspection'],['P6','Media states']],dexa:[['D1','DEXA exact root order'],['D2','Core Trends complete'],['D3','Supplemental collapsed'],['D4','Supplemental expanded'],['D5','Regional Lean collapsed'],['D6','Regional Lean expanded'],['D7','Regional Fat collapsed'],['D8','Regional Fat expanded'],['D9','Scan History collapsed'],['D10','Scan History expanded']]};
const family=new URLSearchParams(location.search).get('family')||'all';
const groups=family==='all'?['photos','dexa']:[family];
if(family==='photos'){document.getElementById('review-title').textContent='Progress Photos Evidence';document.getElementById('review-copy').textContent='Production hierarchy, paired comparison, detail sections, pose navigation and media interactions.'}
if(family==='dexa'){document.getElementById('review-title').textContent='DEXA Evidence';document.getElementById('review-copy').textContent='Exact root order plus every independent collapsed and expanded disclosure with complete graphs, metrics and units.'}
document.getElementById('review-pairs').innerHTML=groups.map(group=>`<div class="family-divider"><h2>${group==='photos'?'Progress Photos':'DEXA'}</h2><p>${group==='photos'?'6 paired states':'10 paired states'}</p></div>`+all[group].map(([id,title])=>`<section class="review-row"><article class="review-panel"><h2>${id} · ${title} · Dark</h2><img src="screens/evidence-${id.toLowerCase()}.png" alt="${title}, dark"></article><article class="review-panel"><h2>${id} · ${title} · Mineral light</h2><img src="screens/evidence-${id.toLowerCase()}-light.png" alt="${title}, mineral light"></article></section>`).join('')).join('');
</script></body></html>
