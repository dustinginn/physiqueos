<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysiqueOS Home Widget · Final Design Batch 3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#02070c}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.stage{display:grid;place-items:center;min-height:100vh}
.widget{position:relative;overflow:hidden;color:var(--ink);background:var(--bg);isolation:isolate}.widget:before{content:"";position:absolute;z-index:-2;width:260px;height:260px;border:35px solid var(--orbit);border-radius:50%;right:-154px;top:-132px;opacity:.7}.widget:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(145deg,var(--wash),transparent 47%);pointer-events:none}
.dark{--bg:#06131e;--bg2:#0b202c;--ink:#f5f8f7;--muted:#91a6ae;--soft:#bfd0d2;--line:rgba(185,218,219,.17);--teal:#3ad6c6;--green:#5bdd94;--amber:#f6bd50;--cyan:#44bed6;--purple:#a18aff;--warning:#f6bd50;--orbit:rgba(52,211,198,.16);--wash:rgba(20,105,112,.24);--action1:#149e9b;--action2:#174b78;--actionInk:#fff;--actionMuted:rgba(255,255,255,.76);--redact:rgba(183,208,211,.30)}
.light{--bg:#eef1eb;--bg2:#dfeae6;--ink:#0a1c29;--muted:#60737c;--soft:#354f58;--line:rgba(21,65,72,.16);--teal:#078f87;--green:#0c9363;--amber:#b47510;--cyan:#0e8ca7;--purple:#7255dc;--warning:#9a5f08;--orbit:rgba(13,143,135,.14);--wash:rgba(61,178,166,.14);--action1:#0b817f;--action2:#163f62;--actionInk:#fff;--actionMuted:rgba(255,255,255,.78);--redact:rgba(42,79,84,.24)}
.small{width:170px;height:170px;border-radius:22px;padding:12px}.large{width:360px;height:376px;border-radius:26px;padding:16px}.eyebrow{font-size:7px;line-height:1;font-weight:800;letter-spacing:.85px;color:var(--purple);text-transform:uppercase}.header{height:26px;display:flex;align-items:flex-start;gap:6px}.title{font-size:15px;line-height:18px;font-weight:760;letter-spacing:-.25px}.large .title{font-size:17px;line-height:22px}.spacer{flex:1}.freshness{font-size:8px;line-height:19px;font-weight:750;color:var(--muted);white-space:nowrap}.large .freshness{font-size:10px;line-height:28px}.freshness.warning{color:var(--warning)}.refresh{width:30px;height:30px;margin-top:-5px;border:0;padding:0;background:transparent;color:var(--teal);font-size:17px;display:grid;place-items:center;font-weight:800}.large .refresh{width:36px;height:36px;margin-top:-6px;font-size:19px}.refresh span{display:inline-block;line-height:1;transform:rotate(-35deg)}
.small-main{height:89px;display:flex;flex-direction:column}.nutrition-label,.metric-label,.row-label{font-size:7px;font-weight:800;letter-spacing:.65px;color:var(--muted);text-transform:uppercase}.calorie-line{display:flex;align-items:baseline;gap:3px;margin-top:1px}.calories{font-size:23px;line-height:26px;font-weight:790;letter-spacing:-.7px}.unit{font-size:9px;font-weight:750;color:var(--muted)}.macros{font-size:8px;line-height:10px;font-weight:680;color:var(--soft);white-space:nowrap}.small-divider{height:1px;background:var(--line);margin:4px 0}.small-split{display:grid;grid-template-columns:1fr 1px 1fr;gap:7px;min-height:27px}.small-split.one{grid-template-columns:1fr}.vline{background:var(--line)}.small-metric .metric-value{font-size:10px;line-height:14px;font-weight:770;white-space:nowrap}.small-empty{padding-top:9px}.empty-title{font-size:11px;line-height:14px;font-weight:780}.empty-detail{font-size:8px;line-height:11px;font-weight:600;color:var(--muted);margin-top:3px}.action{height:31px;border-radius:10px;background:linear-gradient(105deg,var(--action1),var(--action2));color:var(--actionInk);display:flex;align-items:center;gap:7px;padding:0 9px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}.action-icon{font-size:14px;font-weight:800}.action-title{font-size:10px;font-weight:780;line-height:12px;white-space:nowrap}.action-arrow{font-size:10px;margin-left:auto}.large .action{height:49px;border-radius:14px;padding:0 13px;gap:10px}.large .action-icon{font-size:20px}.large .action-title{font-size:13px;line-height:15px}.action-detail{font-size:10px;line-height:12px;font-weight:650;color:var(--actionMuted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:235px}.action-copy{min-width:0}
.large-header{height:34px;display:flex;align-items:flex-start}.large-rule{height:1px;background:var(--line);margin:5px 0 2px}.rows{height:247px}.row{min-height:58px;display:grid;grid-template-columns:28px 1fr 14px;gap:8px;align-items:center;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row-icon{width:25px;height:25px;border-radius:8px;background:color-mix(in srgb,var(--row-color) 17%,transparent);color:var(--row-color);display:grid;place-items:center;font-size:12px;font-weight:800}.row-copy{min-width:0}.row-label{color:var(--row-color);margin-bottom:2px}.row-value{font-size:12px;line-height:14px;font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row-value.secondary{margin-top:1px;color:var(--muted);font-size:10px}.chev{font-size:15px;color:var(--muted);opacity:.62}.nutrition-values{display:flex;gap:12px;align-items:baseline}.nutrition-values span{font-size:12px;font-weight:790}.nutrition-values small{font-size:9px;font-weight:700;color:var(--muted);margin-left:2px}.missing{color:var(--muted);font-weight:650}.large-empty{height:247px;padding:56px 16px 0;border-bottom:1px solid var(--line)}.large-empty .empty-title{font-size:16px;line-height:20px}.large-empty .empty-detail{font-size:12px;line-height:16px;max-width:275px;margin-top:7px}.privacy .sensitive{color:transparent!important;background:var(--redact);border-radius:4px;text-shadow:none;box-decoration-break:clone;-webkit-box-decoration-break:clone}.privacy .nutrition-values .sensitive{display:inline-block;min-width:31px}.privacy .small-metric .sensitive{display:inline-block;min-width:43px}.privacy .calories.sensitive{min-width:58px}.privacy .macros.sensitive{display:inline-block;min-width:112px}.privacy .row-value.sensitive{display:block;width:72%;height:12px}.privacy .row-value.secondary.sensitive{width:49%;height:9px}.privacy .action-detail.sensitive{display:block;width:165px;height:9px;margin-top:2px}.swatch{width:5px;height:5px;border-radius:50%;background:var(--purple);display:inline-block;margin-right:4px;vertical-align:1px}.hidden{display:none!important}
</style>
</head>
<body>
<main class="stage"><section id="widget" class="widget"></section></main>
<script>
const q=new URLSearchParams(location.search);const family=q.get('family')||'small';const theme=q.get('theme')||'dark';const state=q.get('state')||'fresh';
const data={
 fresh:{fs:'18m',fl:'Updated 18m ago',training:['Strength Training · 58 min','Outdoor Walk · 24 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:'176.1 lb'},
 'no-weight':{fs:'18m',fl:'Updated 18m ago',training:['Strength Training · 58 min','Outdoor Walk · 24 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:null},
 'active-workout':{fs:'18m',fl:'Updated 18m ago',training:['Strength Training · 58 min','Outdoor Walk · 24 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:'176.1 lb',activeWorkout:true,progress:'Chest & Shoulders · 6/18 sets'},
 'stale-offline':{fs:'Offline 5h',fl:'Offline · 5h ago',training:['Strength Training · 58 min','Outdoor Walk · 24 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:'176.1 lb',warning:true},
 waiting:{fs:'Waiting',fl:'Waiting for today',empty:true,es:'Waiting for today',el:'Waiting for today’s totals',ds:'Prior-day totals stay hidden.',dl:'Yesterday’s Nutrition, Activity, and Weight are intentionally hidden.'},
 unavailable:{fs:'Refresh',fl:'Open PhysiqueOS to refresh',empty:true,es:'Open app to refresh',el:'Open PhysiqueOS to refresh',ds:'Prior-day totals stay hidden.',dl:'Today’s canonical Logged Today summary is not available yet.'},
 'privacy-redacted':{fs:'18m',fl:'Updated 18m ago',training:['Strength Training · 58 min','Outdoor Walk · 24 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:'176.1 lb',privacy:true},
 'long-training':{fs:'18m',fl:'Updated 18m ago',training:['Traditional Strength Training · Chest, Shoulders & Triceps · 1 hr 42 min','2 Outdoor Walks · 37 min'],cal:'2,463',p:'182',c:'167',f:'110',active:'890',weight:'176.1 lb'}
}[state];
const refresh=`<button class="refresh" data-action="Refresh totals in PhysiqueOS" data-hit="44" aria-label="Refresh totals in PhysiqueOS"><span>↻</span></button>`;
const action=()=>`<div class="action" data-action="${data.activeWorkout?'Resume Workout':'Start Workout Logger'}" data-hit="${family==='small'?'170':'49'}"><div class="action-icon">${data.activeWorkout?'↻':'＋'}</div><div class="action-copy"><div class="action-title">${data.activeWorkout?'Resume Workout':family==='small'?'Start Logger':'Start Workout Logger'}</div>${data.activeWorkout&&family==='large'?`<div class="action-detail sensitive">${data.progress}</div>`:''}</div><div class="action-arrow">↗</div></div>`;
const small=()=>`<div class="header"><div class="title"><span class="swatch"></span>Today</div><div class="spacer"></div><div class="freshness ${data.warning?'warning':''}">${data.fs}</div>${refresh}</div>${data.empty?`<div class="small-main small-empty"><div class="empty-title">${data.es}</div><div class="empty-detail">${data.ds}</div></div>`:`<div class="small-main"><div class="nutrition-label">Nutrition</div><div class="calorie-line"><span class="calories sensitive">${data.cal}</span><span class="unit">cal</span></div><div class="macros sensitive">P ${data.p} · C ${data.c} · F ${data.f}</div><div class="small-divider"></div><div class="small-split ${data.weight?'':'one'}"><div class="small-metric"><div class="metric-label">Active</div><div class="metric-value sensitive">${data.active} cal</div></div>${data.weight?`<div class="vline"></div><div class="small-metric"><div class="metric-label">Weight</div><div class="metric-value sensitive">${data.weight}</div></div>`:''}</div></div>`}${action()}`;
const icon={Training:'◆',Nutrition:'↗',Activity:'≈',Weight:'◇'};
const row=(label,color,value,second='')=>`<div class="row" style="--row-color:${color}" data-action="Open ${label}" data-hit="58"><div class="row-icon">${icon[label]}</div><div class="row-copy"><div class="row-label">${label}</div>${value}${second}</div><div class="chev">›</div></div>`;
const large=()=>`<div class="large-header"><div><div class="eyebrow">PhysiqueOS</div><div class="title">Logged Today</div></div><div class="spacer"></div><div class="freshness ${data.warning?'warning':''}">${data.fl}</div>${refresh}</div><div class="large-rule"></div>${data.empty?`<div class="large-empty"><div class="empty-title">${data.el}</div><div class="empty-detail">${data.dl}</div></div>`:`<div class="rows">${row('Training','var(--teal)',`<div class="row-value sensitive">${data.training[0]}</div>`,`<div class="row-value secondary sensitive">${data.training[1]}</div>`)}${row('Nutrition','var(--green)',`<div class="nutrition-values"><span class="sensitive">${data.cal}<small>cal</small></span><span class="sensitive">${data.p}<small>P</small></span><span class="sensitive">${data.c}<small>C</small></span><span class="sensitive">${data.f}<small>F</small></span></div>`)}${row('Activity','var(--amber)',`<div class="row-value sensitive">${data.active} active cal so far</div>`)}${row('Weight','var(--cyan)',data.weight?`<div class="row-value sensitive">${data.weight}</div>`:`<div class="row-value missing">— &nbsp;Not logged today</div>`)}</div>`}${action()}`;
const w=document.getElementById('widget');w.className=`widget ${family} ${theme} ${data.privacy?'privacy':''}`;w.innerHTML=family==='small'?small():large();w.dataset.family=family;w.dataset.theme=theme;w.dataset.state=state;
</script>
</body>
</html>
