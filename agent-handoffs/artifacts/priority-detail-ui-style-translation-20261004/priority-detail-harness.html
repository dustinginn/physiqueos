<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Priority Detail family</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#05090f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.phone{--bg:#06121d;--text:#f4f7f5;--muted:#95a6ae;--line:#203441;--surface:#102432;--surface2:#142e3a;--teal:#20c5b7;--green:#4ee09a;--amber:#f3ba49;--cyan:#40c7d7;--purple:#9f7cff;--red:#ef6f82;--navy:#123d61;width:402px;min-height:874px;background:var(--bg);color:var(--text);overflow:hidden;border-radius:48px;position:relative;padding:0 18px 36px;box-shadow:0 22px 70px #0008}.phone.light{--bg:#f0eee6;--text:#0a1b2c;--muted:#65767d;--line:#cad4cf;--surface:#fbfaf6;--surface2:#dcebe8;--teal:#0e9186;--green:#138c60;--amber:#b9780d;--cyan:#168d9d;--purple:#7655dc;--red:#c44f64;--navy:#143e60}.status{height:46px;display:flex;align-items:end;justify-content:space-between;padding:0 8px 9px;font-size:13px;font-weight:800}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:22px;background:#01050a}.crumb{height:46px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:750;color:var(--muted);border-bottom:1px solid var(--line)}.screen{padding-top:17px}.eyebrow{font-size:11px;line-height:1.2;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:var(--purple)}h1,h2,h3,p{margin:0}h1{font-size:32px;line-height:1.04;letter-spacing:-.045em}h2{font-size:18px;line-height:1.15;letter-spacing:-.015em}h3{font-size:15px;line-height:1.22}.body{font-size:14px;line-height:1.45;color:var(--muted)}.small{font-size:12px;line-height:1.42;color:var(--muted)}.header{padding:7px 2px 18px}.header h1{margin:7px 0 7px}.state{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--green)}.state:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.state.upcoming{color:var(--cyan)}.state.paused{color:var(--amber)}.state.completed{color:var(--green)}.state.error{color:var(--red)}.summary{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:17px;overflow:hidden;margin-bottom:17px}.summary>div{background:var(--surface);padding:14px}.summary .wide{grid-column:1/-1}.label{font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.value{font-size:15px;font-weight:850;line-height:1.25}.sections{border-top:1px solid var(--line)}.section{padding:15px 2px;border-bottom:1px solid var(--line)}.section-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}.glyph{width:28px;height:28px;border-radius:9px;background:#24bbae22;color:var(--teal);display:grid;place-items:center;font-size:13px;font-weight:900;flex:0 0 auto}.section[data-kind="dose"] .glyph,.section[data-kind="next"] .glyph{background:#9f7cff20;color:var(--purple)}.section[data-kind="preparation"] .glyph{background:#efb64422;color:var(--amber)}.field+ .field{margin-top:11px}.field h3{margin-bottom:3px}.action-zone{padding-top:18px}.dose-editor{background:linear-gradient(145deg,var(--surface2),var(--surface));border-radius:18px;padding:15px;margin-bottom:12px}.dose-row{display:flex;align-items:center;gap:10px;margin-top:11px}.dose-value{margin-left:auto;min-height:44px;min-width:86px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;place-items:center;font-weight:850}.button{min-height:52px;border-radius:15px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:0 16px;font-size:15px;font-weight:850}.button.teal{background:linear-gradient(135deg,#159f95,#153d69)}.button.amber{background:#c9871e}.button-row{display:grid;grid-template-columns:1fr;gap:9px}.secondary{min-height:44px;display:grid;place-items:center;color:var(--muted);font-size:14px;font-weight:750}.complete-box,.paused-box,.notice-box{border-radius:17px;padding:15px;display:flex;gap:11px;align-items:flex-start}.complete-box{background:#32c98718;color:var(--green)}.paused-box{background:#eca93d18;color:var(--amber)}.notice-box{background:var(--surface);color:var(--muted)}.complete-box b,.paused-box b,.notice-box b{color:var(--text)}.weight{margin-bottom:16px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#12a69a2a,#143d622e);display:flex;align-items:center;justify-content:space-between}.weight strong{font-size:23px}.weight .button-mini{min-height:44px;padding:0 13px;border-radius:12px;background:var(--navy);color:white;display:grid;place-items:center;font-size:12px;font-weight:800}.evidence-banner{margin-bottom:16px;padding:17px;border-radius:19px;background:linear-gradient(135deg,#16a69c,#17436d);color:white}.light .evidence-banner{background:linear-gradient(135deg,#d5eee8,#c9dfe9);color:var(--text)}.evidence-banner h2{font-size:21px;margin:6px 0}.evidence-banner p{color:color-mix(in srgb,currentColor 72%,transparent)}.error-page{min-height:700px;display:flex;align-items:center;justify-content:center;text-align:center}.error-icon{width:54px;height:54px;border-radius:18px;background:#ef6f8218;color:var(--red);display:grid;place-items:center;font-size:23px;font-weight:900;margin:0 auto 15px}.error-page h1{font-size:25px}.error-page p{margin-top:8px;max-width:285px}.retry{margin:18px auto 0;width:200px}.foot{font-size:10px;color:var(--muted);line-height:1.45;margin-top:10px}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'generic',theme=q.get('theme')||'dark';
const data={
generic:{title:'Server Priority',subtitle:'Server-owned occurrence',status:'Open',sections:[['What','Server Priority','Production'],['When','Sep 10','Scheduled by the operating plan.']],primary:'Mark Complete',secondary:'Mark Skipped'},
morning:{title:'Morning Weigh-In',subtitle:'Daily · Morning',status:'Open',sections:[['What','Record your weight','A valid Weight recorded for Oct 4 satisfies this routine automatically.'],['When','Daily · Morning','Timing comes from the saved Support schedule.'],['Execution Notes','Saved Support note','Before food or fluids.'],['Why it matters','Track the body-weight trend','This evidence helps PI evaluate progress and energy strategy against the current goal.']],primary:'Log Weight'},
foam:{title:'Foam Rolling',subtitle:'Today · 7:15 PM',status:'Open',sections:[['What','Foam Rolling','Complete the scheduled recovery support.'],['When','Daily · 7:15 PM','Timing comes from the saved Support schedule.'],['Execution Notes','Saved Support note','Focus on lower body after leg sessions.'],['Why it matters','Supports the current recovery strategy','This recovery method supports training readiness and consistency.']],primary:'Mark Complete',secondary:'Mark Skipped'},
peptide:{title:'Tesamorelin',subtitle:'Tonight · 10:29 PM',status:'Open',sections:[['What','Tesamorelin','Complete the scheduled Execution action.'],['When','Sun–Thu · 10:29 PM','fasted before bed'],['Dose','0.5 mg','May 24 – Until changed'],['Preparation','Finish eating approximately 2–3 hours before injection','Preserve the normal fasted-before-bed timing window.'],['Preparation','Take fasted before bed','Use the saved Execution conditions.'],['Execution Notes','Saved Support note','Taken five times per week, Sunday through Thursday, at night, fasted before bed.'],['Why it matters','Supports the current operating plan','This Execution action supports the current operating plan.'],['Next Execution Change','None scheduled','No upcoming Execution phase is scheduled.']],dosePrompt:'Took a different amount?',doseCaption:'Planned 0.5 mg. Edit only if you took a different amount.',primary:'Mark Complete',secondary:'Mark Skipped'},
paused:{title:'Retatrutide',subtitle:'Thursday · 9:45 PM',status:'Paused',sections:[['What','Retatrutide is paused','Resume it from the Operating Plan to record doses again.'],['When','Thursday · 9:45 PM','fasted before bed'],['Dose','1.5 mg','Aug 6 – Until changed'],['Next Execution Change','2.5 mg','Begins Oct 8.']],pausedCopy:'Paused since Sep 12. Resume from the Operating Plan to continue.',primary:'Go to Retatrutide'},
supplement:{title:'Fadogia Agrestis',subtitle:'Every other day',status:'Open',sections:[['What','Fadogia Agrestis','Complete the scheduled supplement support.'],['When','Every other day','Timing comes from the saved Support schedule.'],['Dose / Quantity','Not specified','No quantity is currently configured.'],['Execution Notes','Saved Support note','Every-other-day supplement. Available for reminders if desired, but not currently surfaced by default.'],['Why it matters','Supports the current supplement strategy','This supplement supports the current strategy.']],primary:'Mark Complete'},
evidence:{title:'Progress Photos',subtitle:'Scheduled for this afternoon.',status:'Open',sections:[['What','Progress Photos',"Upload Front Relaxed, Back Relaxed, and Back Flexed to complete today's check-in."],['When','Saturday · Afternoon','This occurrence follows your saved Progress Photos schedule.'],['Execution Notes','Saved Support note','Capture the grouped progress photo set under comparable conditions.'],['Why it matters','Visual calibration','Progress photos support qualitative goals without replacing DEXA or weight evidence.']],primary:'Upload Photos'},
dexa:{title:'DEXA tomorrow',subtitle:'Tomorrow at 7:30 AM',status:'Upcoming',sections:[['What','DEXA tomorrow','Your DEXA appointment remains scheduled. This priority does not complete the scan itself.'],['When','Saturday, August 15, 2026 · 7:30 AM','Timing uses America/Los_Angeles.'],['Preparation','Saved preparation note','Use the saved clinic instructions.'],['Why it matters','Body-composition calibration','Confirmed DEXA evidence updates the body-composition record supporting your current strategy.']],primary:'View DEXA Appointment'},
completed:{title:'Foam Rolling',subtitle:'Today · 7:15 PM',status:'Completed',sections:[['What','Foam Rolling','Complete the scheduled recovery support.'],['When','Daily · 7:15 PM','Timing comes from the saved Support schedule.'],['Why it matters','Supports the current recovery strategy','This recovery method supports training readiness and consistency.']],completedCopy:'Priority complete for today.'}
};
const iconFor=t=>t==='When'?'◷':t.includes('Dose')?'◌':t==='Preparation'?'✦':t.includes('Change')?'↗':t==='Execution Notes'?'≡':t==='Why it matters'?'◎':'◆';
const kindFor=t=>t.includes('Dose')?'dose':t==='Preparation'?'preparation':t.includes('Change')?'next':'plain';
function chrome(inner){return `<main class="phone ${theme==='light'?'light':''}" data-surface="${surface}" data-theme="${theme}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span></div><div class="island"></div><div class="crumb">‹ Home</div>${inner}</main>`}
function groupSections(rows){const groups=[];for(const r of rows){const last=groups.at(-1);if(last&&last[0]===r[0])last.push(r);else groups.push([r])}return groups}
function sections(rows){return `<div class="sections">${groupSections(rows).map(g=>`<section class="section" data-section="${g[0][0]}" data-kind="${kindFor(g[0][0])}"><div class="section-head"><span class="glyph" aria-hidden="true">${iconFor(g[0][0])}</span><h2>${g[0][0]}</h2></div>${g.map(r=>`<div class="field"><h3>${r[1]}</h3><p class="small">${r[2]}</p></div>`).join('')}</section>`).join('')}</div>`}
function action(d){if(d.completedCopy)return `<div class="action-zone"><div class="complete-box" role="status"><span>✓</span><div><b>${d.completedCopy}</b></div></div></div>`;if(d.pausedCopy)return `<div class="action-zone"><div class="paused-box"><span>Ⅱ</span><div><b>Paused</b><p class="small">${d.pausedCopy}</p></div></div><div class="button amber" style="margin-top:11px">${d.primary}</div></div>`;return `<div class="action-zone">${d.dosePrompt?`<div class="dose-editor"><div class="eyebrow">${d.dosePrompt}</div><div class="dose-row"><b>Amount taken</b><div class="dose-value">0.5</div><b>mg</b></div><p class="small" style="margin-top:8px">${d.doseCaption}</p></div>`:''}<div class="button ${['morning','evidence'].includes(surface)?'teal':''}">${d.primary}</div>${d.secondary?`<div class="secondary">${d.secondary}</div>`:''}</div>`}
function statusClass(s){return s.toLowerCase()}
function page(d){const evidence=['morning','evidence','dexa'].includes(surface);return chrome(`<div class="screen"><header class="header"><div class="eyebrow">Priority</div><h1>${d.title}</h1><div class="state ${statusClass(d.status)}">${d.status}</div><p class="body" style="margin-top:7px">${d.subtitle}</p></header>${surface==='morning'?`<div class="weight"><div><div class="label">Evidence state</div><strong>Evidence-driven</strong><p class="small">No valid Weight yet for Oct 4.</p></div><div class="button-mini">Log Weight</div></div>`:''}${evidence&&surface!=='morning'?`<div class="evidence-banner"><div class="eyebrow" style="color:inherit">Canonical evidence</div><h2>${surface==='dexa'?'The scan completes with evidence.':'The photo set completes with evidence.'}</h2><p class="small">No separate manual completion is recorded here.</p></div>`:''}${surface==='morning'?'':action(d)}${sections(d.sections)}</div>`)}
function errorPage(){return chrome(`<div class="error-page" data-state="error"><div><div class="error-icon">!</div><div class="eyebrow">Priority</div><h1>This priority could not be loaded.</h1><p class="body">Pull to refresh and try again.</p><div class="button retry">Try Again</div></div></div>`)}
document.getElementById('app').innerHTML=surface==='error'?errorPage():page(data[surface]||data.generic);
</script></body></html>
