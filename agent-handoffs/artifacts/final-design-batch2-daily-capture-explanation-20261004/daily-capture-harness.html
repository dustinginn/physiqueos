<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Final Design Batch 2</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05090f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}.phone{--bg:#06131e;--bg2:#081a27;--surface:#0e2230;--surface2:#132b39;--surface3:#173846;--line:#25404b;--text:#f2f6f4;--secondary:#aec0c7;--muted:#7f98a2;--purple:#a88bf5;--teal:#2ccdc0;--teal2:#0e8e84;--green:#53dda0;--amber:#f3bd50;--red:#ff7187;--nav:#071621;--input:#0a1b27;--shadow:rgba(0,0,0,.34);width:402px;min-height:874px;color:var(--text);background:var(--bg);position:relative;overflow:hidden;border-radius:50px}.phone.light{--bg:#efeee7;--bg2:#e5eae4;--surface:#fbfaf6;--surface2:#e5f1ee;--surface3:#d3e8e4;--line:#c7d1cd;--text:#0b2030;--secondary:#536b73;--muted:#789097;--purple:#7658d7;--teal:#0c8f84;--teal2:#08756d;--green:#13895e;--amber:#b77412;--red:#c54157;--nav:#e9ece6;--input:#f8f8f3;--shadow:rgba(36,55,59,.12)}
.status{height:56px;padding:18px 27px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:800;letter-spacing:.01em}.island{position:absolute;top:13px;left:144px;width:114px;height:34px;border-radius:18px;background:#02070c}.light .island{background:#0a1923}.app{padding:0 18px 94px;min-height:818px}.topbar{height:52px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin:0 -18px 18px;padding:0 18px}.back,.icon-button{border:0;background:transparent;color:var(--secondary);font:700 14px inherit;min-height:44px;padding:0;display:flex;align-items:center;gap:7px}.back:before{content:'‹';font-size:27px;line-height:1}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}h1,h2,h3,p{margin:0}h1{font-size:31px;line-height:1.03;letter-spacing:-.035em;font-weight:800}h2{font-size:20px;line-height:1.1;letter-spacing:-.02em;font-weight:780}h3{font-size:15px;line-height:1.25;font-weight:800}.lede{margin-top:8px;color:var(--secondary);font-size:15px;line-height:1.38}.date{margin-top:7px;color:var(--secondary);font-size:13px;font-weight:650}.hero{padding:4px 0 20px}.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 0 10px}.section-title span:first-child{font-size:14px;font-weight:800}.section-title .hint{font-size:12px;color:var(--muted);font-weight:700}.field{display:block;margin-top:13px}.field-label{font-size:12px;font-weight:800;color:var(--secondary);margin-bottom:7px}.input,.select,.date-input,.text-area{width:100%;min-height:52px;border:1px solid var(--line);background:var(--input);border-radius:13px;color:var(--text);padding:0 14px;font:750 17px inherit;display:flex;align-items:center;justify-content:space-between}.input.large{min-height:74px;font-size:34px;letter-spacing:-.03em}.input .unit{font-size:16px;color:var(--secondary)}.placeholder{color:var(--muted)}.text-area{height:68px;align-items:flex-start;padding-top:12px;color:var(--muted);font-size:13px;font-weight:600}.form-surface{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 8px 24px var(--shadow)}.light .form-surface{box-shadow:0 8px 20px var(--shadow)}.metric-field{display:grid;grid-template-columns:1fr 104px;gap:10px}.primary,.secondary{width:100%;min-height:52px;border:0;border-radius:14px;margin-top:14px;font:800 15px inherit}.primary{background:linear-gradient(120deg,var(--teal),#2a83a7);color:#03191e}.light .primary{background:#0c837a;color:#fff}.primary.amber{background:linear-gradient(120deg,#f3bd50,#d98824);color:#11202b}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}button[disabled]{opacity:.62}.message{margin-top:12px;border-left:3px solid var(--teal);background:var(--surface2);border-radius:0 13px 13px 0;padding:12px 13px;color:var(--secondary);font-size:13px;line-height:1.4;font-weight:650}.message.error{border-left-color:var(--red);color:var(--red)}.message.success{border-left-color:var(--green);color:var(--text)}.message.processing{border-left-color:var(--amber)}
.priority{border-top:1px solid var(--line);padding:15px 0}.priority:first-of-type{border-top:0}.priority-meta{color:var(--muted);font-size:12px;font-weight:650;margin-top:4px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.choice{min-height:44px;border:1px solid var(--line);border-radius:11px;background:var(--input);color:var(--secondary);font:760 12px inherit}.choice.selected{background:color-mix(in srgb,var(--teal) 17%,var(--surface));border-color:var(--teal);color:var(--text)}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:color-mix(in srgb,var(--nav) 95%,transparent);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 9px 14px}.nav span{min-height:44px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;font-size:10px;color:var(--muted);font-weight:700}.nav b{font-size:17px;line-height:1}.nav .active{color:var(--purple)}
.sheet-phone{padding-top:34px;background:linear-gradient(var(--bg2) 0 34px,var(--surface) 34px)}.sheet{background:var(--surface);border-radius:30px 30px 0 0;border-top:1px solid var(--line);padding:10px 20px 34px;min-height:840px}.grabber{width:42px;height:5px;background:var(--muted);opacity:.5;border-radius:3px;margin:0 auto 21px}.confidence-header{display:grid;grid-template-columns:1fr 82px;gap:14px;align-items:start}.confidence-ring{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) 0 79%,color-mix(in srgb,var(--muted) 24%,transparent) 79%);position:relative}.confidence-ring:after{content:'';position:absolute;inset:8px;border-radius:50%;background:var(--surface)}.confidence-ring b{position:relative;z-index:2;font-size:23px}.band{display:inline-flex;align-items:center;gap:7px;margin:15px 0 5px;color:var(--green);font-size:13px;font-weight:800}.band:before{content:'';width:8px;height:8px;background:var(--green);border-radius:50%}.narrative{font-size:15px;line-height:1.45;color:var(--secondary);margin-top:6px}.factor{padding:17px 0;border-top:1px solid var(--line)}.factor:first-of-type{margin-top:14px}.factor-title{font-size:13px;font-weight:850;text-transform:none;display:flex;gap:9px;align-items:center}.factor-title i{font-style:normal;color:var(--teal);width:22px}.factor ul{padding:0;margin:10px 0 0;list-style:none}.factor li{font-size:14px;line-height:1.42;color:var(--secondary);padding-left:18px;position:relative;margin-top:8px}.factor li:before{content:'•';position:absolute;left:2px;color:var(--teal)}.callout{margin-top:10px;padding:14px;border-radius:15px;background:var(--surface2);border-left:3px solid var(--purple)}
.history-head{margin-bottom:18px}.count{color:var(--muted);font-size:12px;font-weight:750;margin-top:7px}.history-list{border-top:1px solid var(--line)}.history-row{min-height:78px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:42px 1fr 22px;gap:10px;align-items:center}.history-icon{width:36px;height:36px;border-radius:12px;background:var(--surface2);display:grid;place-items:center;color:var(--teal);font-size:16px}.history-copy{padding:12px 0}.cadence{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:850;color:var(--purple)}.history-copy h3{margin-top:3px}.history-copy p{font-size:12px;color:var(--muted);font-weight:650;margin-top:4px}.chev{color:var(--muted);font-size:22px}.state-center{min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--secondary);gap:14px}.spinner{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--teal);border-radius:50%}.empty-glyph{width:64px;height:64px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;color:var(--teal);font-size:25px}.check-panel{margin-top:26px;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:20px;text-align:center}.check{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--green) 17%,var(--surface));color:var(--green);font-size:29px;margin:0 auto 14px}.hidden-label{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}
</style></head><body><main id="mount"></main>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'confidence-v3',theme=q.get('theme')||'dark';
const status=`<div class="status"><span>1:05</span><span>▮▮▮ ⌁</span></div><div class="island"></div>`;
const nav=(active='Home')=>`<div class="nav">${[['⌂','Home'],['◎','Goals'],['＋','Log'],['▣','Evidence'],['●','You']].map(([i,n])=>`<span class="${n===active?'active':''}"><b>${i}</b>${n}</span>`).join('')}</div>`;
const toolbar=(label='Back')=>`<div class="topbar"><button class="back">${label}</button><button class="icon-button" aria-label="More"></button></div>`;
const shell=(body,active='Home')=>`<div class="phone ${theme==='light'?'light':''}">${status}<div class="app">${body}</div>${nav(active)}</div>`;
const factor=(icon,title,items)=>`<section class="factor"><div class="factor-title"><i>${icon}</i>${title}</div><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul></section>`;
function confidence(v3=true){const body=v3?`<div class="confidence-header"><div><div class="eyebrow">Goal confidence</div><h1>Why confidence is 79%</h1><p class="lede">The evidence currently supporting and limiting the overall trajectory.</p></div><div class="confidence-ring"><b>79%</b></div></div><div class="band">Current confidence: Moderate</div><section class="factor"><div class="factor-title"><i>↗</i>Why confidence is here</div><p class="narrative">You are more than halfway to the 10 lb lean-mass goal. The build plan is clearly working. There is enough time to finish ahead of schedule if this level of progress continues.</p></section>${factor('↑','What increased it',['You added 5.0 lb of lean mass since August 15.','Body fat stayed controlled at 8.1%.'])}${factor('✓','What supports it now',['4.2 lb remain with 49 days left.'])}${factor('!','What is holding it back',['One excellent response does not guarantee the same result until the next DEXA.'])}${factor('＋','What could raise it',['Consistent execution can strengthen confidence before the next DEXA.','The next DEXA showing that the progress continues.','Reaching the goal.'])}${factor('−','What could lower it',['Meaningful missed work or persistent departures from the plan.','Body fat moving outside the intended range of 8–9.','Training performance materially declining.','Progress stalling or a new result contradicting the current outlook.','Falling far enough behind that there is no longer enough time to finish the goal.'])}<section class="factor"><div class="factor-title"><i>◇</i>Next evidence</div><p class="narrative">The next DEXA is about whether this kind of progress continues while body fat stays in a good place—not whether the plan works. That question has been answered.</p></section><section class="factor"><div class="factor-title"><i>✦</i>Coach's take</div><p class="narrative">Keep executing consistently. Keep the current setup in place.</p></section>`:`<div class="confidence-header"><div><div class="eyebrow">Goal confidence</div><h1>Why confidence is 74%</h1><p class="lede">The evidence currently supporting and limiting the overall trajectory.</p></div><div class="confidence-ring" style="background:conic-gradient(var(--green) 0 74%,color-mix(in srgb,var(--muted) 24%,transparent) 74%)"><b>74%</b></div></div><div class="band">Current confidence: Moderate</div><p class="narrative">Training and adherence have both been strong recently.</p>${factor('↔','What changed',['Confidence increased because training consistency improved.'])}${factor('✓','What supports confidence',['Training has been consistently strong for the last few weeks.'])}${factor('?','What limits confidence',['Calories still need more consistency before we can tell whether this intake is right.'])}${factor('↗','What will make confidence clearer',['Another body-composition check will confirm the trend.'])}`;return `<div class="phone ${theme==='light'?'light':''} sheet-phone">${status}<div class="sheet"><div class="grabber"></div>${body}</div></div>`}
const priority=(name,meta,selected='completed')=>`<div class="priority"><h3>${name}</h3><div class="priority-meta">${meta}</div><div class="choices">${['completed','skipped','note'].map(x=>`<button class="choice ${selected===x?'selected':''}">${x==='completed'?'Completed':x==='skipped'?'Skipped':'Add note'}</button>`).join('')}</div><div class="text-area" data-field="optional-note">Add context if it will help later.</div></div>`;
function morning(kind){let content=`${toolbar('Home')}<div class="hero"><div class="eyebrow">Morning Weigh-In</div><h1>${kind==='complete'?'Weigh-in complete':'Good morning'}</h1><p class="date">Thursday, September 24, 2026</p></div>`;if(kind==='complete'){content+=`<div class="check-panel"><div class="check">✓</div><h2>Priorities reconciled and weight saved</h2></div><button class="primary">Return Home</button>`;return shell(content)}if(kind==='reconcile'){content+=`<div class="section-title"><span>Yesterday’s unfinished priorities</span><span class="hint">Choose one each</span></div><div class="form-surface">${priority('Tesamorelin','Yesterday · 10:29 PM · 0.5 mg','completed')}${priority('Foam Rolling','Yesterday · 7:15 PM','skipped')}</div>`}const morningValue=kind==='existing'||kind==='processing'||kind==='saving'?'172.9':'150.5',placeholder=kind==='empty'||kind==='reconcile'||kind==='validation';content+=`<div class="section-title"><span>What’s your weight today?</span></div><div class="form-surface"><div class="input large" data-field="morning-weight"><span class="${placeholder?'placeholder':''}">${morningValue}</span><span class="unit">lb</span></div></div>`;if(kind==='validation')content+=`<div class="message error">Enter a valid weight.</div>`;if(kind==='processing')content+=`<div class="message processing">Morning Check-In was accepted and is still reconciling. It is safe to leave this screen or retry the same submission.</div>`;content+=`<button class="primary" ${kind==='saving'?'disabled':''}>${kind==='saving'?'Saving…':'Complete Morning Weigh-In'}</button>`;return shell(content)}
function weight(kind){const value=kind==='new'||kind==='failed'?'':kind==='validation'?'1200':'172.9',date=kind==='new'?'Sep 24, 2026':'Sep 10, 2026',isPlaceholder=!value;let content=`${toolbar('Log')}<div class="hero"><div class="eyebrow">Log Weight</div><h1>Record a weigh-in</h1><p class="lede">Add or correct a measured weight for a specific date.</p></div><div class="form-surface"><label class="field"><div class="field-label">Date measured</div><div class="date-input" data-field="date-measured"><span>${date}</span><span>▣</span></div></label><div class="metric-field"><label class="field"><div class="field-label">Weight</div><div class="input" data-field="weight-value"><span class="${isPlaceholder?'placeholder':''}">${value||'150.5'}</span></div></label><label class="field"><div class="field-label">Unit</div><div class="select" data-field="weight-unit"><span>lb</span><span>⌄</span></div></label></div></div>`;if(kind==='validation')content+=`<div class="message error">Weight must be between 50 and 1,000 lb.</div>`;if(kind==='success')content+=`<div class="message success">Weight saved for Sep 10, 2026.</div>`;if(kind==='failed')content+=`<div class="message error">This weigh-in could not be saved.</div>`;if(kind==='processing')content+=`<div class="message processing">Weight accepted and still reconciling. It is safe to leave this screen or retry the same value.</div>`;content+=`<button class="primary" ${kind==='saving'?'disabled':''}>${kind==='saving'?'Saving…':'Save Weight'}</button>`;if(kind==='success')content+=`<button class="secondary">Return to Log</button>`;return shell(content,'Log')}
const rows=[['▦','Weekly Briefing','Weekly Briefing','Sep 27, 2026 at 5:00 AM'],['◷','Midweek Briefing','Midweek Briefing','Sep 23, 2026 at 3:01 AM'],['◉','Photo Event Briefing','Photo Event','Sep 19, 2026 at 11:24 PM'],['⌁','DEXA Event Briefing','DEXA Event','Sep 13, 2026 at 12:28 AM'],['▦','Weekly Briefing','Weekly Briefing','Sep 13, 2026 at 5:00 AM'],['◷','Midweek Briefing','Midweek Briefing','Sep 9, 2026 at 5:00 AM'],['◌','Monthly Briefing','Monthly Briefing','Sep 1, 2026 at 5:00 AM']];
function history(kind){let content=`${toolbar('Back')}<div class="history-head"><div class="eyebrow">Briefings</div><h1>Briefing History</h1><div class="count">${kind==='loaded'?'7':kind==='empty'?'0':'—'} published briefings</div></div>`;if(kind==='loaded')content+=`<div class="history-list">${rows.map(r=>`<div class="history-row" role="button"><div class="history-icon">${r[0]}</div><div class="history-copy"><div class="cadence">${r[1]}</div><h3>${r[2]}</h3><p>${r[3]}</p></div><div class="chev">›</div></div>`).join('')}</div>`;if(kind==='empty')content+=`<div class="state-center"><div class="empty-glyph">▦</div><h2>No Briefings have been published yet.</h2></div>`;if(kind==='loading')content+=`<div class="state-center"><div class="spinner"></div><p>Loading published briefings</p></div>`;if(kind==='failed')content+=`<div class="state-center"><div class="empty-glyph">!</div><h2>Briefing History could not be loaded.</h2></div>`;return shell(content)}
let html;if(surface==='confidence-v3')html=confidence(true);else if(surface==='confidence-v2')html=confidence(false);else if(surface.startsWith('morning-'))html=morning(surface.slice(8));else if(surface.startsWith('weight-'))html=weight(surface.slice(7));else if(surface.startsWith('history-'))html=history(surface.slice(8));else html=shell('<h1>Unknown surface</h1>');document.getElementById('mount').innerHTML=html;
</script></body></html>
