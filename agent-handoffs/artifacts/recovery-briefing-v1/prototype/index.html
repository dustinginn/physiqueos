<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recovery Briefing V1 — approved one-card prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--surface:#101827;--raised:#141f31;--soft:#172235;--text:#f3f6fb;--secondary:#cbd5e1;--muted:#9aa8ba;--subtle:#748196;--line:rgba(148,163,184,.18);--green:#4ade80;--yellow:#fbbf24;--red:#fb7185;--violet:#a78bfa;--shadow:0 18px 44px rgba(0,0,0,.3)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -12%,#1d2442 0,transparent 40%),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.shell{width:393px;min-height:760px;margin:0 auto;padding:28px 16px 44px}.proto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:22px;color:var(--subtle);font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.proto span:first-child{display:flex;align-items:center;gap:7px}.proto span:first-child:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 14px var(--violet)}.back{color:var(--secondary);font-size:13px;font-weight:720;margin-bottom:18px}.recovery-card{border:1px solid rgba(167,139,250,.24);border-radius:25px;background:linear-gradient(155deg,var(--raised),var(--surface));box-shadow:var(--shadow);overflow:hidden}.head{padding:18px 18px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:10px}.moon{display:grid;place-items:center;width:32px;height:32px;border-radius:11px;background:var(--soft);color:#c4b5fd;font-size:16px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.period{margin-top:3px;color:var(--muted);font-size:9px;font-weight:700}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;border:1px solid currentColor;background:rgba(255,255,255,.025)}.status i{display:block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.unavailable{color:var(--muted)}.metrics{display:flex;align-items:end;justify-content:space-between;gap:18px;padding:4px 18px 12px}.average strong{display:block;font-size:32px;line-height:1;letter-spacing:-.04em}.average span,.comparison span{display:block;margin-top:6px;color:var(--muted);font-size:9px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.comparison{text-align:right;color:var(--secondary);font-size:12px;font-weight:850}.comparison.negative{color:var(--yellow)}.comparison.severe{color:var(--red)}.chart-wrap{padding:12px 14px 9px}svg{display:block;width:100%;height:145px;border-radius:17px;background:#101a2a}.grid{stroke:rgba(148,163,184,.13);stroke-width:1}.baseline{stroke:#748196;stroke-width:1.3;stroke-dasharray:4 4}.area{fill:url(#area)}.line{fill:none;stroke:#a78bfa;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:#a78bfa;stroke:#141f31;stroke-width:2}.point.low{fill:var(--yellow)}.point.severe{fill:var(--red)}.labels{display:grid;grid-template-columns:repeat(var(--count),1fr);padding:7px 8px 0;color:var(--subtle);font-size:8px;font-weight:750;text-align:center}.inline-commentary{padding:8px 18px 17px}.inline-commentary strong{font-size:13px;color:var(--text)}.inline-commentary p{margin:5px 0 0;color:var(--secondary);font-size:11px;line-height:1.55;font-weight:620}.inline-commentary .association{color:var(--muted);font-size:9px;line-height:1.5}.foam{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:14px 18px}.foam-left{display:flex;align-items:center;gap:10px}.roller{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;background:var(--soft);font-size:14px}.foam strong{display:block;font-size:11px}.foam small{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:650}.foam-value{white-space:nowrap;text-align:right;font-size:12px;font-weight:900;color:var(--secondary)}.foot{padding:11px 18px 14px;background:rgba(3,7,18,.18);color:var(--subtle);font-size:8px;font-weight:700;line-height:1.45}.insufficient{margin:5px 18px 18px;padding:18px 0;border-top:1px dashed rgba(148,163,184,.28);border-bottom:1px dashed rgba(148,163,184,.28);color:var(--muted)}.insufficient b{display:block;color:var(--secondary);font-size:13px}.insufficient p{margin:6px 0 0;font-size:10px;line-height:1.55;font-weight:650}.scenario-note{margin-top:11px;text-align:center;color:var(--subtle);font-size:8px;font-weight:700}@media(max-width:430px){.shell{width:100%}}
  </style>
</head>
<body><main class="shell" id="app"></main>
<script>
const scenarios={
  "weekly-green":{cadence:"Weekly",period:"Sep 20–26",status:"green",label:"Green",values:[405,418,397,431,409,392,410],baseline:404,foam:"5 / 7",foamSub:"Two misses · status unchanged"},
  "weekly-yellow":{cadence:"Weekly",period:"Synthetic example",status:"yellow",label:"Yellow",values:[399,348,337,344,359,352,397],baseline:405,foam:"6 / 7",foamSub:"Execution remains supportive",commentary:{headline:"Sleep was persistently below baseline.",body:"Five nights were materially low. The period average was meaningfully below your prior 28 nights."}},
  "weekly-red":{cadence:"Weekly",period:"Synthetic example",status:"red",label:"Red",values:[324,301,287,296,310,293,276],baseline:407,foam:"4 / 7",foamSub:"Execution context only",commentary:{headline:"Sleep strain was severe and persistent.",body:"Six nights were severely low and the period average remained well below baseline.",association:"Training also showed a material interruption after the Sleep decline. The timing is associated; causation is not inferred."}},
  "midweek-green":{cadence:"Midweek · Sun–Tue",period:"Oct 4–6",status:"green",label:"Green",values:[407,419,411],baseline:405,foam:"2 / 3",foamSub:"One miss · status unchanged"},
  "monthly-yellow":{cadence:"Monthly",period:"Synthetic month",status:"yellow",label:"Yellow",values:[411,402,390,372,348],labels:["W1","W2","W3","W4","W5"],baseline:404,foam:"18 / 22",foamSub:"3 excused · 1 missed",commentary:{headline:"Sleep softened across the second half.",body:"Two completed weeks were meaningfully below your prior 28-night baseline. No downstream training constraint was established."}},
  "insufficient-data":{cadence:"Weekly",period:"Synthetic example",status:"unavailable",label:"Not enough data",unavailable:true,baseline:405,foam:"3 observed",foamSub:"Schedule authority unavailable"},
  "green-imperfect-foam":{cadence:"Weekly",period:"Synthetic example",status:"green",label:"Green",values:[403,412,395,418,407,399,416],baseline:405,foam:"4 / 7",foamSub:"Three misses · status unchanged"},
  "yellow-training-holds":{cadence:"Weekly",period:"Synthetic example",status:"yellow",label:"Yellow",values:[395,349,343,351,358,346,416],baseline:406,foam:"7 / 7",foamSub:"Full execution · status unchanged",commentary:{headline:"Sleep was persistently below baseline.",body:"Five nights were materially low. Training performance held."}},
  "red-corroborated":{cadence:"Weekly",period:"Synthetic example",status:"red",label:"Red",values:[315,298,285,302,279,291,294],baseline:405,foam:"2 / 7",foamSub:"Context only · not a status driver",commentary:{headline:"Severe Sleep strain had a downstream companion.",body:"All seven nights were severely low and the period average remained well below baseline.",association:"A material training interruption followed the Sleep decline. This is an association to monitor—not evidence that Sleep caused the interruption."}}
};
const key=new URLSearchParams(location.search).get("scenario")||"weekly-green";const s=scenarios[key]||scenarios["weekly-green"];
const average=s.unavailable?null:Math.round(s.values.reduce((a,b)=>a+b,0)/s.values.length);const delta=average==null?null:average-s.baseline;
function graph(){const vals=s.values;const labels=s.labels||["Su","Mo","Tu","We","Th","Fr","Sa"].slice(0,vals.length);const W=330,H=145,p=14;const all=[...vals,s.baseline];const min=Math.min(...all)-25,max=Math.max(...all)+25;const x=i=>p+i*(W-2*p)/Math.max(1,vals.length-1);const y=v=>p+(max-v)*(H-2*p)/(max-min);const points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");const area=`${x(0)},${H-p} ${points} ${x(vals.length-1)},${H-p}`;const dots=vals.map((v,i)=>{const d=v-s.baseline;const cls=d<=-75?"severe":d<=-30?"low":"";return `<circle class="point ${cls}" cx="${x(i)}" cy="${y(v)}" r="4"/>`}).join("");return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep trend"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><path class="grid" d="M14 ${H*.3}H316 M14 ${H*.62}H316"/><line class="baseline" x1="14" y1="${y(s.baseline)}" x2="316" y2="${y(s.baseline)}"/><polygon class="area" points="${area}"/><polyline class="line" points="${points}"/>${dots}</svg><div class="labels" style="--count:${labels.length}">${labels.map(v=>`<span>${v}</span>`).join("")}</div></div>`}
function duration(m){return `${Math.floor(m/60)}h ${String(m%60).padStart(2,"0")}m`}
function comparison(){if(delta==null)return "28-night baseline unavailable";const sign=delta>0?"+":delta<0?"−":"±";return `${sign}${Math.abs(delta)}m vs 28-night baseline`;}
function commentary(){if(!s.commentary)return "";return `<div class="inline-commentary" data-commentary="inline"><strong>${s.commentary.headline}</strong><p>${s.commentary.body}</p>${s.commentary.association?`<p class="association">${s.commentary.association}</p>`:""}</div>`}
document.getElementById("app").innerHTML=`<div class="proto"><span>Non-shipping prototype</span><span>Synthetic / redacted</span></div><div class="back">← Briefing History</div><article class="recovery-card" data-recovery-card="true"><header class="head"><div class="identity"><span class="moon">◒</span><div><div class="eyebrow">Recovery</div><div class="period">${s.cadence} · ${s.period}</div></div></div><span class="status ${s.status}"><i></i>${s.label}</span></header>${s.unavailable?`<div class="metrics"><div class="average"><strong>—</strong><span>Period average</span></div><div class="comparison">2 / 7 nights<span>available</span></div></div><div class="insufficient"><b>Keep wearing Apple Watch to sleep</b><p>Recovery needs at least 5 nights for a weekly status and 14 prior nights for a personal baseline.</p></div>`:`<div class="metrics"><div class="average"><strong>${duration(average)}</strong><span>Period average</span></div><div class="comparison ${s.status==="red"?"severe":s.status==="yellow"?"negative":""}">${comparison()}<span>${duration(s.baseline)} baseline</span></div></div>${graph()}${commentary()}`}<div class="foam"><div class="foam-left"><span class="roller">≋</span><span><strong>Foam rolling</strong><small>${s.foamSub}</small></span></div><span class="foam-value">${s.foam}</span></div><div class="foot">Personal baseline excludes this period. Foam rolling cannot change status. Associations do not imply causation.</div></article><div class="scenario-note">Scenario: ${key} · recovery_briefing_v1 · one-card revision</div>`;
</script></body></html>
