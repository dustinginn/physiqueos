<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Recovery Briefing V1 — non-shipping prototype</title>
  <style>
    :root{color-scheme:dark;--bg:#080d18;--surface:#101827;--raised:#141f31;--soft:#172235;--text:#f3f6fb;--secondary:#cbd5e1;--muted:#9aa8ba;--subtle:#748196;--line:rgba(148,163,184,.18);--green:#4ade80;--yellow:#fbbf24;--red:#fb7185;--blue:#60a5fa;--violet:#a78bfa;--shadow:0 16px 36px rgba(0,0,0,.28)}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#1d2442 0,transparent 38%),var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}.shell{width:393px;min-height:840px;margin:0 auto;padding:28px 16px 42px}.proto{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:22px;color:var(--subtle);font-size:9px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.proto span:first-child{display:flex;align-items:center;gap:7px}.proto span:first-child:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet);box-shadow:0 0 14px var(--violet)}.back{color:var(--secondary);font-size:13px;font-weight:720;margin-bottom:18px}.hero{padding:18px;border:1px solid rgba(167,139,250,.24);border-radius:27px;background:linear-gradient(145deg,#172235,#121a2c 55%,#1b1836);box-shadow:0 24px 66px -35px rgba(139,140,255,.7)}.hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.hero-label{font-size:10px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd}.period{text-align:right;font-size:9px;line-height:1.45;color:var(--muted);font-weight:750}.hero h1{font-size:24px;line-height:1.12;margin:14px 0 7px;letter-spacing:-.025em}.hero p{font-size:12px;line-height:1.55;color:var(--secondary);font-weight:620;margin:0}.context{display:flex;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:9px;font-weight:750}.recovery{margin-top:12px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(155deg,var(--raised),var(--surface));box-shadow:var(--shadow);overflow:hidden}.head{padding:17px 17px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.eyebrow{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.11em;text-transform:uppercase}.moon{display:grid;place-items:center;width:30px;height:30px;border-radius:11px;background:var(--soft);color:#c4b5fd;font-size:16px}.status{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;border:1px solid currentColor;background:rgba(255,255,255,.025)}.status i{display:block;width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.unavailable{color:var(--muted)}.title{padding:0 17px}.title h2{font-size:21px;line-height:1.18;letter-spacing:-.02em;margin:0}.summary{margin-top:5px;color:var(--muted);font-size:11px;font-weight:650}.chart-wrap{padding:17px 13px 10px}.chart-meta{display:flex;justify-content:space-between;align-items:end;padding:0 4px 10px}.chart-meta strong{font-size:22px;letter-spacing:-.03em}.chart-meta span{font-size:9px;font-weight:800;color:var(--muted)}svg{display:block;width:100%;height:128px;border-radius:16px;background:#101a2a}.grid{stroke:rgba(148,163,184,.13);stroke-width:1}.baseline{stroke:#748196;stroke-width:1.3;stroke-dasharray:4 4}.area{fill:url(#area)}.line{fill:none;stroke:#a78bfa;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.point{fill:#a78bfa;stroke:#141f31;stroke-width:2}.point.low{fill:var(--yellow)}.point.severe{fill:var(--red)}.labels{display:grid;grid-template-columns:repeat(var(--count),1fr);padding:7px 8px 0;color:var(--subtle);font-size:8px;font-weight:750;text-align:center}.commentary{margin:7px 17px 15px;padding:13px 14px;border-left:3px solid currentColor;border-radius:12px;background:rgba(255,255,255,.035)}.commentary strong{font-size:12px}.commentary p{margin:4px 0 0;color:var(--secondary);font-size:11px;line-height:1.55;font-weight:620}.corroboration{display:flex;gap:9px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);color:var(--muted);font-size:9px;line-height:1.45}.foam{display:flex;align-items:center;justify-content:space-between;gap:14px;border-top:1px solid var(--line);padding:14px 17px}.foam-left{display:flex;align-items:center;gap:10px}.roller{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;background:var(--soft);font-size:14px}.foam strong{display:block;font-size:11px}.foam small{display:block;margin-top:2px;color:var(--muted);font-size:9px;font-weight:650}.foam-value{white-space:nowrap;text-align:right;font-size:11px;font-weight:850;color:var(--secondary)}.foot{padding:11px 17px 14px;background:rgba(3,7,18,.18);color:var(--subtle);font-size:8px;font-weight:700;line-height:1.45}.unavailable-panel{margin:18px 17px 17px;padding:19px 15px;border:1px dashed rgba(148,163,184,.28);border-radius:16px;text-align:center;color:var(--muted)}.unavailable-panel b{display:block;color:var(--secondary);font-size:13px}.unavailable-panel p{margin:6px 0 0;font-size:10px;line-height:1.5;font-weight:650}.monthly .chart-wrap{padding-top:14px}.monthly svg{height:160px}.monthly .title h2{font-size:22px}.scenario-note{margin-top:10px;text-align:center;color:var(--subtle);font-size:8px;font-weight:700}
    @media(max-width:430px){.shell{width:100%}}
  </style>
</head>
<body><main class="shell" id="app"></main>
<script>
const scenarios={
  "weekly-green":{cadence:"Weekly Briefing",period:"Sep 20–26",hero:"The week stayed on plan.",heroBody:"Training and Energy remain the decision-leading evidence.",status:"green",label:"Green",title:"Recovery was in its usual range",summary:"6 hr 49 min average · 7 of 7 nights",values:[405,418,397,431,409,392,410],baseline:404,foam:"5 of 7 completed",foamSub:"Two misses · status unchanged",commentary:null},
  "weekly-yellow":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"One pattern is worth watching.",heroBody:"No strategy change is implied by Recovery alone.",status:"yellow",label:"Yellow",title:"Sleep ran meaningfully below your usual range",summary:"6 hr 02 min average · 7 of 7 nights",values:[399,348,337,344,359,352,397],baseline:405,foam:"6 of 7 completed",foamSub:"Execution remains supportive",commentary:{title:"Lower sleep persisted",body:"Five nights were below your personal range, including a three-night run. The whole-week average was 43 minutes below baseline."}},
  "weekly-red":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"Recovery needs attention before adding load.",heroBody:"This is a protective context signal, not a Confidence decision.",status:"red",label:"Red",title:"Sleep strain was severe and persistent",summary:"4 hr 58 min average · 7 of 7 nights",values:[324,301,287,296,310,293,276],baseline:407,foam:"4 of 7 completed",foamSub:"Shown as context only",commentary:{title:"Sustained short sleep",body:"Six nights were severely below your personal range and the weekly average was 109 minutes below baseline.",corroboration:"Training also showed an unusual interruption after the sleep decline. The timing is associated; causation is not inferred."}},
  "midweek-green":{cadence:"Midweek Briefing",period:"Sun–Tue",hero:"The week is settling in normally.",heroBody:"Early signals stay intentionally light until the completed week.",status:"green",label:"Green",title:"Recovery is tracking normally so far",summary:"6 hr 52 min average · 3 of 3 nights",values:[407,419,411],baseline:405,foam:"2 of 3 completed",foamSub:"One miss · status unchanged",commentary:null,midweek:true},
  "monthly-yellow":{cadence:"Monthly Briefing",period:"Synthetic month",hero:"The month was steady, with one Recovery watch.",heroBody:"Monthly Recovery shows persistence across weeks—not a larger score.",status:"yellow",label:"Yellow",title:"Sleep softened across the second half",summary:"6 hr 25 min average · 27 of 30 nights",values:[411,402,390,372,348],labels:["W1","W2","W3","W4","W5"],baseline:404,foam:"18 of 22 completed",foamSub:"3 excused · 1 missed",commentary:{title:"A multi-week shift",body:"Two completed weeks were meaningfully below your prior 28-night baseline. No downstream training constraint was established."},monthly:true},
  "insufficient-data":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"The week is ready, with one evidence gap.",heroBody:"Missing Recovery evidence is not interpreted as poor Recovery.",status:"unavailable",label:"Not enough data",title:"Recovery status is unavailable",summary:"2 of 7 nights available",unavailable:true,foam:"3 completions observed",foamSub:"Schedule authority unavailable"},
  "green-imperfect-foam":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"The week stayed stable.",heroBody:"Foam rolling supports the context without dominating it.",status:"green",label:"Green",title:"Sleep stayed in your usual range",summary:"6 hr 47 min average · 7 of 7 nights",values:[403,412,395,418,407,399,416],baseline:405,foam:"4 of 7 completed",foamSub:"Three misses · status unchanged",commentary:null},
  "yellow-training-holds":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"Sleep is the watch; training still held.",heroBody:"The two signals are shown together without forcing a causal story.",status:"yellow",label:"Yellow",title:"Sleep was persistently below baseline",summary:"6 hr 05 min average · 7 of 7 nights",values:[395,349,343,351,358,346,416],baseline:406,foam:"7 of 7 completed",foamSub:"Full execution · status unchanged",commentary:{title:"Sleep moved; training did not",body:"Five nights were materially low and the weekly average was 41 minutes below baseline.",corroboration:"Comparable training performance held. That reduces concern about a current downstream constraint; it does not prove resilience or erase the Sleep signal."}},
  "red-corroborated":{cadence:"Weekly Briefing",period:"Synthetic example",hero:"Protect the next training decision.",heroBody:"Corroboration raises salience only after a severe Sleep pattern exists.",status:"red",label:"Red",title:"Severe sleep strain had a downstream companion",summary:"4 hr 55 min average · 7 of 7 nights",values:[315,298,285,302,279,291,294],baseline:405,foam:"2 of 7 completed",foamSub:"Context only · not a status driver",commentary:{title:"Persistent Sleep strain, then training constraint",body:"All seven nights were severely below your personal range and the weekly average was 110 minutes below baseline.",corroboration:"A repeated training interruption followed similar Sleep windows. This is a useful association to monitor—not evidence that short sleep caused the interruption."}}
};
const query=new URLSearchParams(location.search);const key=query.get("scenario")||"weekly-green";const s=scenarios[key]||scenarios["weekly-green"];
function graph(s){const vals=s.values||[];const labels=s.labels||["Su","Mo","Tu","We","Th","Fr","Sa"].slice(0,vals.length);const W=330,H=s.monthly?160:128,p=14;const all=[...vals,s.baseline||400];const min=Math.min(...all)-25,max=Math.max(...all)+25;const x=i=>p+i*(W-2*p)/Math.max(1,vals.length-1);const y=v=>p+(max-v)*(H-2*p)/(max-min);const points=vals.map((v,i)=>`${x(i)},${y(v)}`).join(" ");const area=`${x(0)},${H-p} ${points} ${x(vals.length-1)},${H-p}`;const by=y(s.baseline);const dots=vals.map((v,i)=>{const delta=v-s.baseline;const cls=delta<=-75?"severe":delta<=-35?"low":"";return `<circle class="point ${cls}" cx="${x(i)}" cy="${y(v)}" r="4"/>`}).join("");return `<div class="chart-wrap"><div class="chart-meta"><div><strong>${duration(Math.round(vals.reduce((a,b)=>a+b,0)/vals.length))}</strong><br><span>PERIOD AVERAGE</span></div><span>28-night baseline · ${duration(s.baseline)}</span></div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sleep trend"><defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".3"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs><path class="grid" d="M14 ${H*.3}H316 M14 ${H*.62}H316"/><line class="baseline" x1="14" y1="${by}" x2="316" y2="${by}"/><polygon class="area" points="${area}"/><polyline class="line" points="${points}"/>${dots}</svg><div class="labels" style="--count:${labels.length}">${labels.map(v=>`<span>${v}</span>`).join("")}</div></div>`}
function duration(m){return `${Math.floor(m/60)} hr ${String(m%60).padStart(2,"0")} min`}
function commentary(c,status){if(!c)return "";return `<section class="commentary ${status}"><strong>${c.title}</strong><p>${c.body}</p>${c.corroboration?`<div class="corroboration"><span>↗</span><span>${c.corroboration}</span></div>`:""}</section>`}
document.getElementById("app").innerHTML=`<div class="proto"><span>Non-shipping prototype</span><span>Synthetic / redacted</span></div><div class="back">← Briefing History</div><section class="hero"><div class="hero-top"><span class="hero-label">✦ ${s.cadence}</span><span class="period">${s.period}<br>Recovery V1</span></div><h1>${s.hero}</h1><p>${s.heroBody}</p><div class="context"><span>Current strategy · Build Lean Mass</span><span>Confidence unchanged</span></div></section><article class="recovery ${s.monthly?"monthly":""}"><header class="head"><div class="eyebrow"><span class="moon">◒</span><span>Recovery</span></div><span class="status ${s.status}"><i></i>${s.label}</span></header><div class="title"><h2>${s.title}</h2><div class="summary">${s.summary}</div></div>${s.unavailable?`<div class="unavailable-panel"><b>Keep wearing Apple Watch to sleep</b><p>Recovery needs at least 5 nights for a weekly status and 14 prior nights for a personal baseline.</p></div>`:graph(s)}${commentary(s.commentary,s.status)}<div class="foam"><div class="foam-left"><span class="roller">≋</span><span><strong>Foam rolling</strong><small>${s.foamSub}</small></span></div><span class="foam-value">${s.foam}</span></div><div class="foot">Sleep uses the prior 28 reliable nights and excludes this period. Foam rolling cannot set the Recovery status. Associations do not imply causation.</div></article><div class="scenario-note">Scenario: ${key} · recovery_briefing_v1</div>`;
</script></body></html>
