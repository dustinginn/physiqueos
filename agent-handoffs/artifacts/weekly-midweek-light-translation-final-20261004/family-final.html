<!doctype html>
<html lang="en">
<head>

<title>PhysiqueOS recurring briefing family refinement</title>
<style>
@font-face{font-family:Jakarta;src:url("fonts/PlusJakartaSans.ttf") format("truetype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;background:#070b11;color:#f4f7f8;font-family:Jakarta,-apple-system,BlinkMacSystemFont,sans-serif}body{padding:28px}.board{display:flex;align-items:flex-start;justify-content:center;gap:36px;flex-wrap:wrap}.column{display:grid;gap:10px}.column>h2{margin:0;color:#aab7c4;font-size:13px}.phone.dark{--bg:#06121c;--surface:#0d2030;--text:#f4f7f8;--secondary:#c4d1d5;--muted:#91a5ad;--line:#9bb3bb31;--purple:#aa8cff;--green:#55df9a;--blue:#54c6e7;--amber:#f2bc4d;--cyan:#44d3df;--track:#294a52}.phone.light{--bg:#f1f1e9;--surface:#fbfbf7;--text:#102638;--secondary:#4e6470;--muted:#576b73;--line:#19384824;--purple:#684ac7;--green:#0b6b4d;--blue:#0e607a;--amber:#875400;--cyan:#0d6670;--track:#d6dfda}.phone{width:402px;overflow:hidden;border-radius:50px;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.4);font-size:14px;line-height:1.42;background:var(--bg);color:var(--text)}
.status{height:51px;padding:18px 27px 0;display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;font-weight:800}.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:22px;background:#02050a}.status-icons{letter-spacing:2px;font-size:11px}.content{padding:0 15px 60px}.nav{display:flex;gap:8px;padding:10px 0}.nav-chip{height:44px;padding:0 12px;border-radius:12px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:11px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 72%,transparent)}
.hero{min-height:632px;margin:0 -15px;padding:30px 24px 28px;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(155deg,#087f76,#0b4860 58%,#142a55)}.hero:before{content:"";position:absolute;width:430px;height:430px;border:62px solid rgba(85,223,154,.22);border-radius:50%;right:-220px;bottom:-84px;z-index:-1}.weekly .hero{min-height:640px}.topline{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}.eyebrow,.section-label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:800}.eyebrow{color:var(--purple)}.range{text-align:right;font-size:12px;color:var(--muted)}.confidence{position:relative;margin-top:26px;min-height:196px}.ring{width:188px;height:188px;margin-left:auto;border-radius:50%;background:conic-gradient(var(--green) calc(var(--score)*1%),rgba(64,111,117,.62) 0);display:grid;place-items:center;position:relative}.midweek .ring{width:158px;height:158px}.ring:after{content:"";position:absolute;inset:10px;border-radius:50%;background:#0c4252}.ring-inner{position:relative;z-index:1;text-align:center}.ring-score{font-size:46px;font-weight:800;line-height:1}.midweek .ring-score{font-size:39px}.ring-caption{font-size:10px;text-transform:uppercase;color:var(--secondary);margin-top:5px;font-weight:700}.confidence-copy{display:grid;gap:5px;margin-top:-46px;width:210px}.confidence-copy .band{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--green);font-weight:800}.confidence-copy strong{font-size:15px}.confidence-copy p{font-size:12px;line-height:1.48;color:var(--secondary);margin:0}.hero-rule{border:0;border-top:1px solid rgba(255,255,255,.18);margin:20px 0 18px}.hero h1{font-size:40px;line-height:1.06;margin:0;max-width:345px;letter-spacing:-.025em}.midweek .hero h1{font-size:32px}.hero .meaning{font-size:15px;line-height:1.52;color:var(--secondary);margin:12px 0 0;max-width:345px}.hero-footer{display:grid;grid-template-columns:1.5fr .55fr 1.45fr;gap:12px;margin-top:24px;padding-top:14px;border-top:1px solid rgba(255,255,255,.18)}.midweek .hero-footer{grid-template-columns:1fr}.label,.metric-label{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}.hero-footer strong{display:block;font-size:12px;margin-top:4px}.section{padding:20px 4px;border-bottom:1px solid var(--line);position:relative}.section-head{display:flex;align-items:center;gap:8px}.section-head .coverage{margin-left:auto;color:var(--muted);font-size:12px}.icon{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;font-weight:800;background:color-mix(in srgb,var(--tone) 15%,transparent);color:var(--tone)}.section-label{color:var(--tone)}.section-title{font-size:24px;line-height:1.08;margin:15px 0 0}.statement{font-size:27px;line-height:1.06;font-weight:800;margin:10px 0 0}.body-copy{color:var(--secondary);font-size:15px;margin:9px 0 0}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 0;margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.metric-value{font-size:14px;font-weight:800;margin-top:4px}.daily-rows{display:grid;margin-top:12px;border-top:1px solid var(--line)}.daily-row{display:flex;justify-content:space-between;align-items:center;min-height:42px;border-bottom:1px solid var(--line);font-size:13px}.chart-title{font-size:13px;font-weight:750;margin:16px 0 10px}.energy-chart{height:145px;display:grid;gap:5px;align-items:end;padding:8px 0 25px;position:relative;border-bottom:1px solid var(--line)}.energy-chart.week{grid-template-columns:repeat(7,1fr)}.energy-chart.mid{grid-template-columns:repeat(2,1fr);gap:22px;padding-left:14px;padding-right:14px}.energy-day{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:3px;align-items:end;position:relative}.energy-day i{min-height:4px;border-radius:1px 1px 0 0}.intake{background:var(--amber)}.expenditure{background:var(--blue)}.day-label{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-size:10px;color:var(--muted);font-weight:700}.legend{display:flex;gap:14px;margin-top:11px;color:var(--muted);font-size:11px}.swatch{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:-1px}.weight-grid{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:center;margin-top:14px}.weight-value{font-size:27px;line-height:1;font-weight:800;white-space:nowrap}.weight-delta{display:block;font-size:13px;color:var(--blue);font-weight:800;margin-top:7px}.weight-note{font-size:15px;line-height:1.45;color:var(--secondary)}
.body-top{display:flex;align-items:center}.scan-date{margin-left:auto;color:var(--muted);font-size:12px}.body-metrics{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.body-metric{padding:12px 7px}.body-metric+.body-metric{border-left:1px solid var(--line)}.body-metric strong{display:block;font-size:15px;margin-top:4px}.body-objective{font-size:11px;color:var(--muted);margin-top:10px}.training .section-title{font-size:25px;max-width:330px}.coverage-copy{font-size:12px;color:var(--muted);margin:10px 0 0}.coverage-rail{height:9px;display:flex;margin-top:10px;background:var(--track);gap:3px}.coverage-rail i{display:block}.coverage-rail .improving{background:var(--green)}.coverage-rail .steady{background:var(--blue)}.coverage-rail .plateauing{background:var(--amber)}.coverage-rail .insufficient{background:var(--muted)}.coverage-legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:7px}.sub-label{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--green);margin:20px 0 0;padding-bottom:9px;border-bottom:1px solid var(--line)}.highlight{display:grid;grid-template-columns:1.2fr .9fr auto;gap:8px;padding:13px 0;border-bottom:1px solid var(--line);align-items:center}.highlight strong{display:block;font-size:13px}.record{display:block;font-size:10px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:2px}.performance{font-size:14px;font-weight:800}.delta{font-size:12px;color:var(--green);font-weight:800;white-space:nowrap}.detail{grid-column:1/4;color:var(--muted);font-size:11px;margin-top:-3px}.priority-list{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.priority{display:grid;grid-template-columns:8px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}.priority-dot{width:7px;height:7px;border-radius:50%;margin-top:6px;background:var(--tone)}.priority strong{display:block;font-size:12px}.priority span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.priority-rail{height:3px;background:var(--track);margin-top:6px}.priority-rail i{display:block;height:100%;background:var(--tone)}
.recovery{padding:24px 4px;background:linear-gradient(120deg,rgba(68,211,223,.07),rgba(170,140,255,.025) 72%)}.fixture-flag{margin-left:auto;font-size:8px;font-weight:800;color:var(--cyan);border:1px solid color-mix(in srgb,var(--cyan) 45%,transparent);border-radius:999px;padding:4px 6px;letter-spacing:.04em}.recovery-lead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}.recovery-lead h2{font-size:24px;line-height:1.12;margin:0}.status-pill{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:12px;font-weight:800;white-space:nowrap}.status-pill i{width:7px;height:7px;border-radius:50%;background:currentColor}.recovery-summary{color:var(--muted);font-size:12px;margin-top:5px}.recovery-kpis{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:17px}.period-average strong{display:block;font-size:30px;line-height:1}.period-average span,.baseline-copy span{display:block;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}.baseline-copy{text-align:right;color:var(--secondary);font-size:12px;font-weight:800}.sleep-chart{margin-top:12px}.sleep-chart svg{display:block;width:100%;height:144px;background:rgba(9,26,40,.62);border-radius:14px}.sleep-grid{stroke:rgba(155,179,187,.17);stroke-width:1}.sleep-baseline{stroke:#91a5ad;stroke-width:1.2;stroke-dasharray:4 4}.sleep-area{fill:url(#sleep-week-area)}.midweek .sleep-area{fill:url(#sleep-mid-area)}.sleep-line{fill:none;stroke:var(--purple);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.sleep-point{fill:var(--purple);stroke:#102a39;stroke-width:2}.sleep-axis{display:grid;color:var(--muted);font-size:9px;font-weight:700;text-align:center;padding:6px 8px 0}.recovery-meta{display:grid;grid-template-columns:1fr auto;gap:14px;margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}.foam strong{display:block;font-size:12px}.foam span{display:block;color:var(--muted);font-size:10px;margin-top:2px}.foam-value{font-size:13px;font-weight:800;white-space:nowrap}.recovery-foot{font-size:10px;color:var(--muted);line-height:1.45;margin-top:13px}.coach{padding:24px 18px 26px;margin:0 -4px;background:linear-gradient(120deg,#15354b,#172f59);color:#fff}.coach .eyebrow{color:rgba(255,255,255,.8)}.coach-block{padding:15px 0;border-top:1px solid rgba(255,255,255,.16)}.coach-block:first-of-type{margin-top:14px}.coach-block h3{font-size:15px;margin:0}.coach-block p{font-size:15px;line-height:1.5;color:rgba(255,255,255,.92);margin:7px 0 0}.actions{display:grid}.action{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:start;padding:10px 0}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#ddd6fe;font-weight:800}.revision{padding:18px 4px;border-bottom:1px solid var(--line)}.revision strong{display:block}.revision p{margin:5px 0 0;color:var(--secondary);font-size:12px}.screen-only{display:none!important}.tone-amber{--tone:var(--amber)}.tone-blue{--tone:var(--blue)}.tone-purple{--tone:var(--purple)}.tone-green{--tone:var(--green)}.tone-cyan{--tone:var(--cyan)}
.light{box-shadow:0 20px 48px rgba(17,39,52,.16)}.light .hero{background:linear-gradient(155deg,#d9eeea,#c7e3e3 58%,#d8e0ef)}.light .hero:before{border-color:rgba(22,137,99,.17)}.light .hero-rule,.light .hero-footer{border-color:rgba(16,38,56,.14)}.light .ring{background:conic-gradient(var(--green) calc(var(--score)*1%),rgba(97,132,137,.24) 0)}.light .ring:after{background:#e5efeb}.light .ring-caption{color:var(--secondary)}.light .nav-chip{background:rgba(255,255,255,.46)}.light .recovery{background:linear-gradient(120deg,rgba(19,137,144,.09),rgba(115,88,212,.035) 72%)}.light .sleep-chart svg{background:rgba(211,230,226,.72)}.light .sleep-grid{stroke:rgba(16,38,56,.13)}.light .sleep-baseline{stroke:#617880}.light .sleep-point{stroke:#e5efeb}.light .coach{background:linear-gradient(120deg,#e5edf0,#e6e2f0);color:var(--text)}.light .coach .eyebrow{color:var(--purple)}.light .coach-block{border-color:rgba(16,38,56,.14)}.light .coach-block p{color:var(--secondary)}.light .num{background:rgba(16,38,56,.09);color:var(--purple)}
@media(max-width:880px){body{padding:12px}.board{gap:24px}.phone{width:min(402px,100vw - 24px);border-radius:42px}}
</style>
</head>
<body><main class="board" id="board"></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sem=(scope,key,value,html)=>`<span data-semantic="${scope}.${key}" data-value="${esc(value)}">${html??esc(value)}</span>`;
const status=()=>`<div class="status"><span>1:05</span><span class="island"></span><span class="status-icons">▮▮▮⌁</span></div>`;
const nav=cadence=>`<nav class="nav" data-section="${cadence}-navigation"><span class="nav-chip">‹ Home</span><span class="nav-chip">▦ Briefing History</span></nav>`;
function energyChart(points,cadence){const max=Math.max(...points.flatMap(p=>[p.intakeKcal,p.expenditureKcal]));return `<div class="energy-chart ${cadence==='weekly'?'week':'mid'}" data-chart="${cadence}-energy" data-point-count="${points.length}" role="img" aria-label="Daily intake and estimated expenditure across ${points.length} days">${points.map((p,i)=>`<div class="energy-day" data-date="${p.date}"><i class="intake" style="height:${p.intakeKcal/max*100}%" data-series="Intake" data-value="${p.intakeKcal}" data-source-key="${cadence}.energy.dailyBalances.${i}.intakeKcal"></i><i class="expenditure" style="height:${p.expenditureKcal/max*100}%" data-series="Estimated expenditure" data-value="${p.expenditureKcal}" data-source-key="${cadence}.energy.dailyBalances.${i}.expenditureKcal"></i><span class="day-label">${p.label||p.date.slice(-2)}</span></div>`).join('')}</div>`}
function sleepGraph(id,values,baseline,labels,summary){const W=330,H=144,p=14,all=[...values,baseline],min=Math.min(...all)-18,max=Math.max(...all)+18,x=i=>p+i*(W-2*p)/Math.max(1,values.length-1),y=v=>p+(max-v)*(H-2*p)/(max-min),points=values.map((v,i)=>`${x(i)},${y(v)}`).join(' '),area=`${x(0)},${H-p} ${points} ${x(values.length-1)},${H-p}`;return `<div class="sleep-chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(summary)}"><title>${esc(summary)}</title><defs><linearGradient id="${id}-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#aa8cff" stop-opacity=".28"/><stop offset="1" stop-color="#aa8cff" stop-opacity="0"/></linearGradient></defs><path class="sleep-grid" d="M14 ${H*.32}H316 M14 ${H*.67}H316"/><line class="sleep-baseline" x1="14" y1="${y(baseline)}" x2="316" y2="${y(baseline)}"/><polygon class="sleep-area" style="fill:url(#${id}-area)" points="${area}"/><polyline class="sleep-line" points="${points}"/>${values.map((v,i)=>`<circle class="sleep-point" cx="${x(i)}" cy="${y(v)}" r="4" data-source-key="recovery.${id}.nightlyMinutes.${i}" data-value="${v}"/>`).join('')}</svg><div class="sleep-axis" style="grid-template-columns:repeat(${labels.length},1fr)">${labels.map(v=>`<span>${v}</span>`).join('')}</div></div>`}
const weeklyRecovery={id:'weekly',period:'Synthetic example',status:'Green',values:[403,412,395,418,407,399,416],baseline:405,average:407,coverage:'7 of 7 nights',foam:'4 of 7 completed',foamSub:'Three misses · status unchanged'};
const midweekRecovery={id:'mid',period:'Oct 4–6',status:'Green',values:[407,419,411],baseline:405,average:412,coverage:'3 of 3 nights',foam:'2 of 3 completed',foamSub:'One miss · status unchanged'};
const weeklyBody={sourceFixtureId:'weekly_briefing_2026-07-12_2026-07-18',scanDate:'2026-07-18',scanDateDisplay:'Jul 18',bodyFatPercent:'8.2%',leanMassLb:'149.0 lb',fatMassLb:'13.4 lb',objective:'Visible Abs at Rest',narrative:'This scan closed the goal: the numerical target and the visual confirmation converged.'};
const duration=m=>`${Math.floor(m/60)}h ${String(m%60).padStart(2,'0')}m`;
function recoverySection(cadence,r){const labels=cadence==='weekly'?['Su','Mo','Tu','We','Th','Fr','Sa']:['Su','Mo','Tu'];return `<section class="section recovery tone-cyan" data-section="${cadence}-recovery" data-fixture-only="true" data-confidence-coupling="none"><div class="section-head"><span class="icon">◒</span><span class="section-label">Recovery</span><span class="fixture-flag">FUTURE CONTRACT · FIXTURE ONLY</span></div><div class="recovery-lead"><div><h2>Sleep stayed in your usual range</h2><div class="recovery-summary">${duration(r.average)} average · ${r.coverage}</div></div><span class="status-pill"><i></i>${r.status}</span></div><div class="recovery-kpis"><div class="period-average"><strong data-recovery-key="periodAverageMinutes" data-value="${r.average}">${duration(r.average)}</strong><span>Period average</span></div><div class="baseline-copy">28-night baseline · ${duration(r.baseline)}<span data-recovery-key="personalBaselineMinutes" data-value="${r.baseline}">Personal baseline</span></div></div>${sleepGraph(r.id,r.values,r.baseline,labels,`${cadence} Sleep trend: ${labels.map((v,i)=>`${v} ${r.values[i]} minutes`).join(', ')}. Baseline ${r.baseline} minutes. Status ${r.status}.`)}<div class="recovery-meta"><div class="foam"><strong>Foam rolling</strong><span>${r.foamSub}</span></div><div class="foam-value">${r.foam}</div></div><p class="recovery-foot">Personal baseline excludes this period. Foam rolling cannot change status. Associations do not imply causation. Confidence coupling: none.</p></section>`}
function heroWeekly(b){const w=b.weekly,c=b.confidence;return `<section class="hero" data-section="weekly-hero"><div class="topline"><span class="eyebrow">Weekly Briefing</span><span class="range">${sem('weekly','periodLabel',w.periodLabel)}<br>${sem('weekly','reportingRangeLabel',w.reportingRangeLabel)}</span></div><div class="confidence"><div class="ring" style="--score:${c.score}" role="img" aria-label="Confidence ${c.score} percent"><div class="ring-inner"><div class="ring-score">${sem('weekly','confidence.score',c.score,c.score+'%')}</div><div class="ring-caption">Confidence</div></div></div><div class="confidence-copy"><span class="band">${sem('weekly','confidence.band',c.band)}</span><strong>Confidence ${sem('weekly','confidence.movementDirection',c.movementDirection)} ${sem('weekly','confidence.delta',c.delta,'+'+c.delta)}</strong><p>${sem('weekly','confidence.primaryReason',c.primaryReason)}</p></div></div><hr class="hero-rule"><h1>${sem('weekly','heroHeadline',w.heroHeadline)}</h1><p class="meaning">${sem('weekly','heroBody',w.heroBody)}</p><div class="hero-footer"><div><span class="label">Strategy</span><strong>${sem('weekly','strategyPhaseLabel',w.strategyPhaseLabel)}</strong></div><div><span class="label">Week</span><strong>${sem('weekly','strategyWeekLabel',w.strategyWeekLabel)}</strong></div><div><span class="label">Next</span><strong>${sem('weekly','strategyNextMilestone',w.strategyNextMilestone)}</strong></div></div></section>`}
function energyWeekly(w){const e=w.energy;return `<section class="section tone-amber" data-section="weekly-energy"><div class="section-head"><span class="icon">ϟ</span><span class="section-label">Energy Balance</span><span class="coverage">${sem('weekly','energy.pairedDayCount',e.pairedDayCount)}/${sem('weekly','energy.eligibleDayCount',e.eligibleDayCount)} days paired</span></div><h2 class="section-title">Energy Balance</h2><p class="statement">+${sem('weekly','energy.averageBalanceKcal',e.averageBalanceKcal)} kcal/day above</p><p class="body-copy">${sem('weekly','energy.narrative',e.narrative)}</p><div class="metrics"><div><span class="metric-label">Avg intake</span><div class="metric-value">${sem('weekly','energy.averageIntakeKcal',e.averageIntakeKcal)} kcal</div></div><div><span class="metric-label">Avg expenditure</span><div class="metric-value">${sem('weekly','energy.averageExpenditureKcal',e.averageExpenditureKcal)} kcal</div></div><div><span class="metric-label">Avg balance</span><div class="metric-value">+${e.averageBalanceKcal} kcal</div></div></div><div class="chart-title">Daily intake vs estimated expenditure</div>${energyChart(e.dailyBalances.map(p=>({...p,label:p.date.slice(-2)})),'weekly')}<div class="legend"><span><i class="swatch" style="background:var(--amber)"></i>Intake</span><span><i class="swatch" style="background:var(--blue)"></i>Estimated expenditure</span></div></section>`}
function weightWeekly(w){return `<section class="section tone-blue" data-section="weekly-weight"><div class="section-head"><span class="icon">↕</span><span class="section-label">Weight Context</span></div><div class="weight-grid"><div><div class="weight-value">${sem('weekly','weight.averageWeightLb',w.weight.averageWeightLb,w.weight.averageWeightLb.toFixed(1)+' lb')}</div><span class="weight-delta">+${sem('weekly','weight.changeLb',w.weight.changeLb,w.weight.changeLb.toFixed(1))} lb this week</span></div><p class="weight-note">${sem('weekly','weight.narrative',w.weight.narrative)}</p></div></section>`}
function trainingWeekly(w){const t=w.training,total=t.improvingCount+t.steadyCount+t.plateauingCount+t.insufficientCount;return `<section class="section training tone-green" data-section="weekly-training"><div class="section-head"><span class="icon">◆</span><span class="section-label">Training Response</span></div><h2 class="section-title">${sem('weekly','training.headline',t.headline)}</h2><p class="body-copy">${sem('weekly','training.narrative',t.narrative)}</p><p class="coverage-copy">${sem('weekly','training.trainingDayCount',t.trainingDayCount)} training days · ${sem('weekly','training.comparableCategoryCount',t.comparableCategoryCount)} reviewed categories · ${sem('weekly','training.improvingCount',t.improvingCount)} improving · ${sem('weekly','training.steadyCount',t.steadyCount)} steady · ${sem('weekly','training.plateauingCount',t.plateauingCount)} plateauing</p><div class="coverage-rail" role="img" aria-label="${t.improvingCount} improving, ${t.steadyCount} steady, ${t.plateauingCount} plateauing, ${t.insufficientCount} insufficient"><i class="improving" style="width:${t.improvingCount/total*100}%"></i><i class="steady" style="width:${t.steadyCount/total*100}%"></i><i class="plateauing" style="width:${t.plateauingCount/total*100}%"></i><i class="insufficient" style="width:${t.insufficientCount/total*100}%"></i></div><div class="sub-label">🔥 Highlights</div>${t.highlights.map((h,i)=>`<div class="highlight"><div><strong>${sem('weekly',`training.highlights.${i}.exerciseName`,h.exerciseName)}</strong><span class="record">${sem('weekly',`training.highlights.${i}.recordType`,h.recordType)}</span></div><span class="performance">${sem('weekly',`training.highlights.${i}.performanceValue`,h.performanceValue)}</span><span class="delta">▲ ${sem('weekly',`training.highlights.${i}.delta`,h.delta)}</span><span class="detail">${sem('weekly',`training.highlights.${i}.detail`,h.detail)}</span></div>`).join('')}<div class="sub-label" style="color:var(--muted)">🎯 Priority Muscle Groups</div><div class="priority-list">${t.priorityGroups.map((g,i)=>{const tone=g.tone==='warning'?'var(--amber)':g.tone==='evidence'?'var(--blue)':'var(--green)';return `<div class="priority"><i class="priority-dot" style="--tone:${tone}"></i><div><strong>${sem('weekly',`training.priorityGroups.${i}.label`,g.label)}</strong><span>${sem('weekly',`training.priorityGroups.${i}.statusLabel`,g.statusLabel)} across ${sem('weekly',`training.priorityGroups.${i}.comparableExerciseCount`,g.comparableExerciseCount)} exercises.</span><div class="priority-rail"><i style="width:${g.comparableExerciseCount*24}%;--tone:${tone}"></i></div></div></div>`}).join('')}</div></section>`}
function bodyWeekly(){const b=weeklyBody;return `<section class="section tone-purple" data-section="weekly-body-composition" data-founder-target="body-composition-parity" data-source-fixture="${b.sourceFixtureId}"><div class="body-top"><div class="section-head"><span class="icon">◇</span><span class="section-label">Body Composition</span></div><span class="scan-date">${b.scanDateDisplay}</span></div><div class="body-metrics"><div class="body-metric"><span class="label">Body Fat</span><strong data-target-key="bodyComposition.bodyFatPercent" data-value="${b.bodyFatPercent}">${b.bodyFatPercent}</strong></div><div class="body-metric"><span class="label">Lean Mass</span><strong data-target-key="bodyComposition.leanMassLb" data-value="${b.leanMassLb}">${b.leanMassLb}</strong></div><div class="body-metric"><span class="label">Fat Mass</span><strong data-target-key="bodyComposition.fatMassLb" data-value="${b.fatMassLb}">${b.fatMassLb}</strong></div></div><p class="body-copy">${b.narrative}</p><p class="body-objective">Current objective · ${b.objective} · latest real available fixture context</p></section>`}
function coachWeekly(w){return `<section class="coach" data-section="weekly-finale"><span class="eyebrow">Coach's Take</span><div class="coach-block"><h3>💡 Biggest Takeaway</h3><p>${sem('weekly','coachTake.biggestTakeaway',w.coachTake.biggestTakeaway)}</p></div><div class="coach-block"><h3>🧠 What To Do</h3><p>${sem('weekly','coachTake.recommendation',w.coachTake.recommendation)}</p></div><div class="coach-block"><h3>🎯 Into Next Week</h3><div class="actions">${w.coachTake.intoNextWeek.map((a,i)=>`<div class="action"><span class="num">${i+1}</span><p>${sem('weekly',`coachTake.intoNextWeek.${i}`,a)}</p></div>`).join('')}</div></div></section>`}
function weeklyPhone(b,theme){const w=b.weekly;return `<article class="phone weekly ${theme}" data-variant="weekly-${theme}">${status()}<div class="content">${nav('weekly')}<div class="stack">${heroWeekly(b)}${energyWeekly(w)}${weightWeekly(w)}${bodyWeekly()}${trainingWeekly(w)}${recoverySection('weekly',weeklyRecovery)}${coachWeekly(w)}<section class="revision" data-section="weekly-provenance"><strong>This Briefing was revised</strong><p>${sem('weekly','revision.reason',b.revisionProvenance.reason)}</p><p>First published Aug 30, 9:15 AM · ${sem('weekly','revision.previousHeadline',b.replacedHistory[0].headline)}</p></section></div></div></article>`}
function heroMid(m){const l=m.lead,c=l.confidence;return `<section class="hero" data-section="midweek-hero"><div class="topline"><span class="eyebrow">${sem('midweek','lead.eyebrow',l.eyebrow)}</span><span class="range">${sem('midweek','evidenceWindow.displayRange',m.artifact.evidenceWindow.displayRange)}</span></div><div class="confidence"><div class="ring" style="--score:${c.score}" role="img" aria-label="Confidence ${c.score} percent"><div class="ring-inner"><div class="ring-score">${sem('midweek','lead.confidence.score',c.score,c.score+'%')}</div><div class="ring-caption">Confidence</div></div></div><div class="confidence-copy"><span class="band">${sem('midweek','lead.confidence.band',c.band)}</span><strong>${sem('midweek','lead.confidence.movementLabel',c.movementLabel)}</strong><p>${sem('midweek','lead.confidence.reason',c.reason)}</p></div></div><hr class="hero-rule"><h1>${sem('midweek','lead.headline',l.headline)}</h1><p class="meaning">${sem('midweek','lead.meaning',l.meaning)}</p><div class="hero-footer"><div><span class="label">Goal &amp; Phase</span><strong>${sem('midweek','lead.goal',l.goal)} · ${sem('midweek','lead.phase',l.phase)}</strong></div></div></section>`}
function energyMid(m){const e=m.energy;return `<section class="section tone-amber" data-section="midweek-energy"><div class="section-head"><span class="icon">ϟ</span><span class="section-label">Energy Balance</span><span class="coverage">${e.pairedDayCount}/${e.eligibleDayCount} days paired</span></div><h2 class="section-title">${sem('midweek','energy.headline',e.headline)}</h2><p class="statement">${sem('midweek','energy.balanceHeadline',e.balanceHeadline)}</p><div class="daily-rows">${e.dailyBalances.map((p,i)=>`<div class="daily-row"><strong>${sem('midweek',`energy.dailyBalances.${i}.weekday`,p.weekday)}</strong><span>${p.balanceKcal<0?'−':''}${Math.abs(p.balanceKcal)} kcal</span></div>`).join('')}</div><div class="metrics"><div><span class="metric-label">Avg intake</span><div class="metric-value">${sem('midweek','energy.averageIntakeKcal',e.averageIntakeKcal)} kcal</div></div><div><span class="metric-label">Avg expenditure</span><div class="metric-value">${sem('midweek','energy.averageExpenditureKcal',e.averageExpenditureKcal)} kcal</div></div><div><span class="metric-label">Avg balance</span><div class="metric-value">−${Math.abs(e.averageBalanceKcal)} kcal</div></div></div><div class="chart-title">${sem('midweek','energy.chartTitle',e.chartTitle)}</div>${energyChart(e.dailyBalances,'midweek')}<div class="legend"><span><i class="swatch" style="background:var(--amber)"></i>Intake</span><span><i class="swatch" style="background:var(--blue)"></i>Estimated expenditure</span></div></section>`}
function weightMid(m){const w=m.weight;return `<section class="section tone-blue" data-section="midweek-weight"><div class="section-head"><span class="icon">↕</span><span class="section-label">Weight Context</span></div><div class="weight-grid"><div><div class="weight-value">${sem('midweek','weight.averageWeightLb',w.averageWeightLb,w.averageWeightLb.toFixed(1)+' lb')}</div><span class="weight-delta">${sem('midweek','weight.changeLb',w.changeLb,'−'+Math.abs(w.changeLb).toFixed(1))} lb</span></div><p class="weight-note">Sunday–Tuesday average · 3 observations</p></div></section>`}
function bodyMid(m){const b=m.bodyComposition;return `<section class="section tone-purple" data-section="midweek-body-composition"><div class="body-top"><div class="section-head"><span class="icon">◇</span><span class="section-label">Body Composition</span></div><span class="scan-date">${sem('midweek','bodyComposition.scanDateDisplay',b.scanDateDisplay)}</span></div><div class="body-metrics"><div class="body-metric"><span class="label">Body Fat</span><strong>${sem('midweek','bodyComposition.bodyFatPercent',b.bodyFatPercent)}</strong></div><div class="body-metric"><span class="label">Lean Mass</span><strong>${sem('midweek','bodyComposition.leanMassLb',b.leanMassLb)}</strong></div><div class="body-metric"><span class="label">Fat Mass</span><strong>${sem('midweek','bodyComposition.fatMassLb',b.fatMassLb)}</strong></div></div></section>`}
function trainingMid(m){const t=m.training,total=t.improvingCount+t.steadyCount;return `<section class="section training tone-green" data-section="midweek-training"><div class="section-head"><span class="icon">◆</span><span class="section-label">Training Response</span></div><h2 class="section-title">${sem('midweek','training.headline',t.headline)}</h2><p class="coverage-copy">${sem('midweek','training.trainingDayCount',t.trainingDayCount)} training days · ${sem('midweek','training.comparableCategoryCount',t.comparableCategoryCount)} reviewed categories · ${sem('midweek','training.improvingCount',t.improvingCount)} improving · ${sem('midweek','training.steadyCount',t.steadyCount)} steady</p><div class="coverage-rail" role="img" aria-label="2 improving and 3 steady"><i class="improving" style="width:${t.improvingCount/total*100}%"></i><i class="steady" style="width:${t.steadyCount/total*100}%"></i></div><div class="coverage-legend"><span>● 2 improving</span><span>■ 3 steady</span></div><div class="sub-label">🔥 Highlights</div>${t.highlights.map((h,i)=>`<div class="highlight"><div><strong>${sem('midweek',`training.highlights.${i}.exerciseName`,h.exerciseName)}</strong><span class="record">${sem('midweek',`training.highlights.${i}.recordType`,h.recordType)}</span></div><span class="performance">${sem('midweek',`training.highlights.${i}.performanceValue`,h.performanceValue)}</span><span class="delta">▲ ${sem('midweek',`training.highlights.${i}.delta`,h.delta)}</span><span class="detail">${sem('midweek',`training.highlights.${i}.headline`,h.headline)} ${sem('midweek',`training.highlights.${i}.detail`,h.detail)}</span></div>`).join('')}</section>`}
function coachMid(m){const takeaway=m.suppressed.coachTake.text,action=m.coaching.find(x=>x.section==='action').text,watch=m.coaching.find(x=>x.section==='watch').text;return `<section class="coach" data-section="midweek-finale" data-founder-target="biggest-takeaway-parity"><span class="eyebrow">Coach's Take</span><div class="coach-block"><h3>💡 Biggest Takeaway</h3><p data-target-key="midweek.coaching.coachTake" data-value="${esc(takeaway)}">${esc(takeaway)}</p></div><div class="coach-block"><h3>🧠 What To Do</h3><p>${sem('midweek','coaching.action',action)}</p></div><div class="coach-block"><h3>👀 What To Watch</h3><p>${sem('midweek','coaching.watch',watch)}</p></div></section>`}
function midweekPhone(m,theme){return `<article class="phone midweek ${theme}" data-variant="midweek-${theme}">${status()}<div class="content">${nav('midweek')}<div class="stack">${heroMid(m)}${energyMid(m)}${weightMid(m)}${bodyMid(m)}${trainingMid(m)}${recoverySection('midweek',midweekRecovery)}${coachMid(m)}<section class="revision" data-section="midweek-provenance"><strong>Current production-shaped V3 fixture</strong><p>Sep 20–22 · canonical Narrative V3 and Confidence V3 projection</p></section></div></div></article>`}
function main(){const fixtures=globalThis.__WEEKLY_FIXTURES__,m=globalThis.__MIDWEEK_FIXTURE__;if(!fixtures||!m)throw new Error('Renderer fixtures were not injected');const b=fixtures.find(x=>x.id==='weekly_briefing_2026-08-23_2026-08-29');document.getElementById('board').innerHTML=`<section class="column"><h2>Weekly · corrected dark</h2>${weeklyPhone(b,'dark')}</section><section class="column"><h2>Weekly · mineral light</h2>${weeklyPhone(b,'light')}</section><section class="column"><h2>Midweek · dark reference</h2>${midweekPhone(m,'dark')}</section><section class="column"><h2>Midweek · mineral light</h2>${midweekPhone(m,'light')}</section>`;document.documentElement.dataset.ready='true'}
main();
</script></body></html>
