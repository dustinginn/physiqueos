<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Evidence Intake + Review</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#03080d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}h1,h2,h3,p{margin:0}button,input{font:inherit}.phone{--bg:#06131e;--text:#f6f8f7;--muted:#91a4ad;--line:#203640;--surface:#0e2230;--surface2:#142c39;--deep:#091a27;--teal:#2ccdc0;--green:#53dda0;--cyan:#49c8dc;--amber:#f2bd54;--purple:#a28aff;--navy:#143e61;--red:#ed7182;width:402px;min-height:874px;color:var(--text);background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0009}.phone.light{--bg:#efeee7;--text:#0a1c2d;--muted:#62737b;--line:#cbd5d0;--surface:#fbfaf6;--surface2:#dcebe7;--deep:#e5eae4;--teal:#0c8f84;--green:#13895e;--cyan:#168b9c;--amber:#b6750a;--purple:#7255d7;--navy:#143f61;--red:#c34f64}.status{height:46px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between;font-size:13px;font-weight:850;position:relative}.island{position:absolute;top:11px;left:50%;width:118px;height:34px;border-radius:22px;background:#01050a;transform:translateX(-50%)}.nav{height:48px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:780}.nav span{min-height:44px;display:flex;align-items:center}.page{padding:17px 18px 38px}.header{margin-bottom:17px}.eyebrow{font-size:10px;line-height:1.25;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}h1{font-size:30px;line-height:1.04;letter-spacing:-.045em;margin-top:6px}h2{font-size:17px;line-height:1.18;letter-spacing:-.02em}h3{font-size:14px;line-height:1.25}.body{font-size:14px;line-height:1.45;color:var(--muted)}.small{font-size:12px;line-height:1.38;color:var(--muted)}.micro{font-size:10px;line-height:1.3;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}.surface{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px;margin-bottom:12px}.light .surface.rich{background:linear-gradient(145deg,#d7ebe7,#eef5ef)}.surface.soft{background:var(--deep)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:11px}.date-row,.field-row,.choice-row,.file-row,.metric-row{min-height:54px;display:grid;align-items:center;border-bottom:1px solid var(--line)}.date-row,.field-row{grid-template-columns:1fr auto;gap:12px}.date-row:last-child,.field-row:last-child,.choice-row:last-child,.file-row:last-child,.metric-row:last-child{border-bottom:0}.label{font-size:13px;line-height:1.28;font-weight:760}.value{font-size:13px;line-height:1.28;font-weight:850}.secondary{font-size:12px;color:var(--muted);line-height:1.35}.choice-row{grid-template-columns:1fr auto;gap:10px}.check{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--bg);background:var(--teal);font-size:13px;font-weight:900}.recommend{color:var(--purple);font-size:10px;font-weight:900;margin-left:6px}.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;border:1px solid var(--line);background:var(--deep);border-radius:13px;padding:3px;margin-bottom:12px}.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:12px;font-weight:850}.seg button.selected{background:var(--surface2);color:var(--text)}.buttons{display:flex;gap:9px;flex-wrap:wrap}.button{min-height:44px;border:1px solid var(--line);border-radius:13px;background:transparent;color:var(--text);padding:0 13px;font-size:13px;font-weight:850}.button.destructive{color:var(--red)}.primary{width:100%;min-height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,#1a9c90,#17456b);color:#fff;font-size:15px;font-weight:900;margin-top:7px}.primary.amber{background:linear-gradient(135deg,#e0a63f,#c98520);color:#071521}.primary.disabled{background:var(--surface2);color:var(--muted)}.input{width:114px;min-height:40px;border:1px solid var(--line);border-radius:11px;background:var(--deep);color:var(--text);padding:0 10px;text-align:right;font-size:14px}.file-row{grid-template-columns:42px 1fr auto;gap:10px}.file-icon{width:38px;height:38px;border-radius:11px;background:#49c8dc1a;color:var(--cyan);display:grid;place-items:center;font-weight:900}.tag{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 8px;background:#2ccdc018;color:var(--teal);font-size:10px;font-weight:900}.tag.amber{background:#f2bd5418;color:var(--amber)}.tag.green{background:#53dda018;color:var(--green)}.tag.muted{background:var(--surface2);color:var(--muted)}.note{margin:0 0 12px;padding:12px 13px;border-left:3px solid var(--cyan);border-radius:0 13px 13px 0;background:#49c8dc0c}.note.amber{border-left-color:var(--amber);background:#f2bd540c}.note.red{border-left-color:var(--red);background:#ed71820c}.photo{height:308px;border-radius:17px;overflow:hidden;background:#07111b;margin-bottom:12px}.photo img{width:100%;height:100%;object-fit:cover}.pose-grid,.condition-grid,.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.select{min-height:54px;border:1px solid var(--line);border-radius:13px;background:var(--deep);padding:9px 10px}.select .micro{margin-bottom:4px}.select .value{display:flex;justify-content:space-between;gap:8px}.confirm{width:100%;min-height:46px;border:0;border-radius:13px;background:#2ccdc022;color:var(--teal);font-weight:900;margin-top:10px}.confirm.done{background:#53dda01a;color:var(--green)}.toggle-row{min-height:52px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.toggle{width:48px;height:29px;border-radius:20px;background:var(--green);padding:3px}.toggle:after{content:"";display:block;width:23px;height:23px;border-radius:50%;background:white;margin-left:19px}.toggle.off{background:var(--line)}.toggle.off:after{margin-left:0}.progress{height:7px;border-radius:5px;background:var(--surface2);overflow:hidden;margin:7px 0 8px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));border-radius:inherit}.state{padding:13px 0;border-bottom:1px solid var(--line)}.state:last-child{border-bottom:0}.state-head{display:flex;align-items:center;gap:9px;margin-bottom:5px}.spinner{width:17px;height:17px;border:2px solid var(--line);border-top-color:var(--teal);border-radius:50%}.state-icon{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;background:#53dda018;color:var(--green);font-weight:900}.state-icon.red{background:#ed718218;color:var(--red)}.status-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.status-actions .button{min-height:44px}.review-hero{border-radius:20px;padding:17px;margin-bottom:14px;background:linear-gradient(145deg,#0b8f87,#123e62);color:#fff;position:relative;overflow:hidden}.light .review-hero{background:linear-gradient(145deg,#d3eae5,#c7dde8);color:var(--text)}.review-hero:after{content:"";position:absolute;width:140px;height:140px;border:28px solid #58dda037;border-radius:50%;right:-70px;bottom:-98px}.review-hero .eyebrow{color:#d7ceff}.light .review-hero .eyebrow{color:var(--purple)}.review-hero h1{font-size:28px;position:relative;z-index:1}.hero-meta{display:flex;gap:12px;margin-top:10px;font-size:11px;font-weight:800;color:#d6e2e4;position:relative;z-index:1}.light .hero-meta{color:var(--muted)}.evidence-item{padding:13px 0;border-bottom:1px solid var(--line)}.evidence-item:last-child{border-bottom:0}.item-head{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;margin-bottom:10px}.metric{min-height:59px;border-radius:13px;background:var(--deep);padding:9px 10px}.metric .micro{color:var(--teal);margin-bottom:5px}.metric.amber .micro{color:var(--amber)}.metric.purple .micro{color:var(--purple)}.meal{padding:10px 0;border-top:1px solid var(--line)}.photo-session{padding-top:7px}.pose-line{min-height:44px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}.pose-line:last-child{border-bottom:0}.measurement-form .field-row{grid-template-columns:1fr 112px}.form-copy{margin-bottom:8px}.bottom-space{height:12px}.sr-label{position:absolute;left:-9999px}
.input{min-height:44px}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'generic-chooser',theme=q.get('theme')||'dark';
const photoPath='../monthly-correction-dexa-photo-briefing-ui-20261004/media/founder-back-relaxed-current-detail.png';
function shell(content,title='Add Evidence'){return `<main class="phone ${theme==='light'?'light':''}" data-theme="${theme}" data-surface="${surface}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span><div class="island"></div></div><div class="nav"><span>‹ ${title}</span></div>${content}<div class="bottom-space"></div></main>`}
function head(kicker,title){return `<header class="header"><div class="eyebrow">${kicker}</div><h1>${title}</h1></header>`}
function action(text,cls=''){return `<button class="button ${cls}">${text}</button>`}
function primary(text,cls=''){return `<button class="primary ${cls}">${text}</button>`}
function typeRow(label,selected=false,recommended=false){return `<div class="choice-row" data-field="${label}"><div class="label">${label}${recommended?'<span class="recommend">Recommended</span>':''}</div>${selected?'<div class="check">✓</div>':'<div class="secondary">›</div>'}</div>`}
function dateCard(){return `<section class="surface"><div class="date-row" data-field="Date"><div class="label">Date</div><div class="value">Sep 23, 2026 ›</div></div></section>`}
function picker(label,value,cls=''){return `<div class="select ${cls}" data-field="${label}"><div class="micro">${label}</div><div class="value"><span>${value}</span><span>⌄</span></div></div>`}
function fileRow(name,detail,tag=''){return `<div class="file-row" data-field="${name}"><div class="file-icon">▧</div><div><div class="label">${name}</div><div class="secondary">${detail}</div></div>${tag?`<span class="tag">${tag}</span>`:''}</div>`}
function metric(label,value,cls=''){return `<div class="metric ${cls}" data-field="${label}"><div class="micro">${label}</div><div class="value">${value}</div></div>`}
function genericChooser(){return shell(`<div class="page">${head('ADD EVIDENCE','Add Evidence')}<section class="surface rich"><div class="section-head"><h2>What kind of evidence?</h2></div>${typeRow('Automatic',true,true)}${typeRow('Nutrition')}${typeRow('Activity')}${typeRow('DEXA')}${typeRow('Training')}${typeRow('Weight')}${typeRow('Progress Photos')}${typeRow('Other / General')}</section>${dateCard()}<section class="surface"><div class="section-head"><div><h2>Screenshots or PDF</h2><p class="small">Attach 1–4 screenshots or one PDF.</p></div></div><div class="buttons">${action('Choose Photos')}${action('Choose PDF')}</div></section>${primary('Upload','disabled')}</div>`)}
function genericAutoReview(){return shell(`<div class="page">${head('ADD EVIDENCE','Add Evidence')}<section class="note"><div class="label">Grouped: Nutrition 1 · Activity 1.</div><p class="small">Choose a type only for the attachment that could not be classified unambiguously.</p></section>${dateCard()}<section class="surface rich"><div class="section-head"><h2>Screenshots or PDF</h2><span class="tag">3 files</span></div>${fileRow('MyFitnessPal-Sep-23.PNG','Screenshot · 1.4 MB','Nutrition')}${fileRow('Fitness-Rings-Sep-23.PNG','Screenshot · 892 KB','Activity')}${fileRow('IMG_4921.PNG','Screenshot · 1.1 MB')}<div style="margin-top:10px">${picker('Choose type for IMG_4921.PNG','Choose type')}</div><div class="buttons" style="margin-top:12px">${action('Choose Photos')}${action('Choose PDF')}</div></section>${primary('Upload','disabled')}</div>`)}
function domainHandoffs(){return shell(`<div class="page">${head('ADD EVIDENCE','Type handoffs')}<section class="surface rich"><div class="state"><h2>Training has its own entry point.</h2><p class="small" style="margin-top:5px">Workout Logger owns canonical Training entry.</p><div class="status-actions">${action('Open Training')}</div></div><div class="state"><h2>Weight has its own entry point.</h2><p class="small" style="margin-top:5px">Log Weight owns canonical backdated Weight entry.</p><div class="status-actions">${action('Open Weight')}</div></div><div class="state"><h2>Other / General</h2><p class="small" style="margin-top:5px">General evidence has no canonical intake type yet — choose Nutrition, Activity, or DEXA.</p></div></section></div>`)}
function manual(kind){const nutrition=kind==='nutrition';const rows=nutrition?[['Calories','2300'],['Protein (g)','198'],['Carbs (g)','244'],['Fat (g)','73'],['Fiber (g)','31']]:[['Active calories','650'],['Total calories','2740'],['Exercise minutes','45'],['Stand hours','12'],['Move goal','650']];return shell(`<div class="page">${head('ADD EVIDENCE','Add Evidence')}<section class="surface rich"><div class="section-head"><h2>What kind of evidence?</h2><span class="tag">${nutrition?'Nutrition':'Activity'}</span></div><div class="date-row"><div class="label">Date</div><div class="value">Sep 23, 2026 ›</div></div></section><div class="seg"><button>Screenshot</button><button class="selected">Manual</button></div><section class="surface"><div class="section-head"><div><h2>${nutrition?'Daily totals':'Daily activity'}</h2><p class="small">Blank fields remain unknown. Existing web-authored days require screenshot review so the server can enforce its revision fingerprint.</p></div></div>${rows.map(([l,v])=>`<div class="field-row" data-field="${l}"><div class="label">${l}</div><input class="input" value="${v}" aria-label="${l}"></div>`).join('')}${nutrition?'':'<p class="small" style="margin-top:11px">Manual entry only. HealthKit and direct device-health sync are not enabled.</p>'}</section>${primary('Save')}</div>`)}
function transactionStates(){return shell(`<div class="page">${head('ADD EVIDENCE','Transaction states')}<section class="surface rich"><div class="state"><div class="state-head"><div class="spinner"></div><h3>Checking what kind of evidence this is…</h3></div></div><div class="state"><div class="state-head"><div class="spinner"></div><h3>Transferring… 64%</h3></div><div class="progress"><span style="width:64%"></span></div></div><div class="state"><div class="state-head"><div class="spinner"></div><h3>Reading what you uploaded…</h3></div></div><div class="state"><div class="state-head"><div class="state-icon">✓</div><h3>Evidence received</h3></div><p class="small">Your evidence is ready to review.</p><div class="status-actions">${action('Review Nutrition')}</div></div><div class="state"><div class="state-head"><div class="state-icon">✓</div><h3>Evidence saved</h3></div><div class="status-actions">${action('Return to Log')}</div></div><div class="state"><div class="state-head"><div class="state-icon red">!</div><h3>This evidence could not be uploaded.</h3></div><div class="status-actions">${action('Try Again')}</div></div></section></div>`)}
function photoCore(ready=false){return `<section class="surface rich"><div class="section-head"><div><h2>Photo set</h2><p class="small">Choose one or more original Progress Photos.</p></div><span class="tag">1 photo</span></div><div class="photo"><img src="${photoPath}" alt="Founder rear progress photo"></div><div class="section-head"><div><div class="micro">Photo 1</div><h2>${ready?'Rear Relaxed':'Pose not confirmed'}</h2></div><span class="tag ${ready?'green':'amber'}">${ready?'Confirmed':'Review'}</span></div><div class="pose-grid">${picker('Orientation','Rear')}${picker('Contraction',ready?'Relaxed':'Flexed')}</div><div style="margin-top:8px">${picker('Pose',ready?'Standard':'Double Biceps')}</div>${ready?'':'<p class="small" style="color:var(--amber);margin-top:8px">Double Biceps uses Flexed.</p>'}${ready?'<button class="confirm done">✓ Pose confirmed</button>':'<button class="confirm">Confirm pose</button>'}<div class="buttons" style="margin-top:12px">${action('Choose Photos')}</div></section>`}
function sessionCard(ready=false){return `<section class="surface"><div class="section-head"><h2>Session conditions</h2></div><div class="condition-grid">${picker('Time of day',ready?'Afternoon':'Choose')}${picker('Fasted',ready?'No':'Unknown')}${picker('Post-workout',ready?'No':'Unknown')}${picker('Pump',ready?'None':'Unknown')}</div><div class="toggle-row" data-field="These are original, unedited photos."><div class="label">These are original, unedited photos.</div><div class="toggle ${ready?'':'off'}"></div></div><p class="small">Every pose and condition is sent to the Server-owned Progress Photos review. Confirmation creates the canonical PhotoSession and starts the existing Photo Briefing lifecycle.</p></section>`}
function photosPose(ready=false){return shell(`<div class="page">${head('ADD EVIDENCE','Progress Photos')}${dateCard()}${photoCore(ready)}${sessionCard(ready)}${primary('Upload',ready?'':'disabled')}</div>`)}
function photosResume(){return shell(`<div class="page">${head('ADD EVIDENCE','Progress Photos')}<section class="surface rich"><div class="state-head"><div class="file-icon">↑</div><div><h2>Photo upload waiting</h2><p class="small">1 of 3 photos from 2026-09-23 reached PhysiqueOS. Resume to send the rest, or discard the set and choose again.</p></div></div><div class="progress"><span style="width:33%"></span></div><div class="buttons" style="margin-top:12px">${action('Resume upload')}${action('Discard','destructive')}</div></section><section class="note amber"><div class="label">Durable staged upload</div><p class="small">Resume sends only the missing originals. Discard removes the staged set from this iPhone.</p></section></div>`)}
function photoTransferStates(){return shell(`<div class="page">${head('ADD EVIDENCE','Progress Photos')}<section class="surface rich"><div class="state"><div class="state-head"><div class="spinner"></div><h3>Uploading photo 2 of 3… 47%</h3></div><div class="progress"><span style="width:47%"></span></div></div><div class="state"><div class="state-head"><div class="spinner"></div><h3>All 3 photos received. Waiting for durable acceptance…</h3></div><div class="progress"><span style="width:100%"></span></div></div><div class="state"><div class="state-head"><div class="state-icon red">!</div><h3>Photo set not accepted</h3></div><p class="small">PhysiqueOS did not accept this photo set (media_rejected). Discard it and choose the photos again.</p><div class="status-actions">${action('Discard','destructive')}</div></div></section></div>`)}
function dexa(selected=false){return shell(`<div class="page">${head('ADD EVIDENCE','DEXA Scan')}${dateCard()}<section class="surface rich"><div class="section-head"><div><h2>BodySpec PDF</h2><p class="small">${selected?'One PDF · 2.8 MB':'Attach one BodySpec PDF report.'}</p></div>${selected?'<span class="tag">Ready</span>':''}</div>${selected?fileRow('BodySpec_DXA_2026-09-23.pdf','PDF document · 2.8 MB')+'<div class="buttons" style="margin-top:12px">'+action('Remove','destructive')+action('Choose PDF')+'</div>':'<div class="buttons">'+action('Choose PDF')+'</div>'}</section>${primary('Upload',selected?'':'disabled')}</div>`)}
function dexaError(){return shell(`<div class="page">${head('ADD EVIDENCE','DEXA Scan')}<section class="note red"><h2>DEXA intake requires exactly one BodySpec PDF.</h2><p class="small" style="margin-top:6px">No evidence was saved.</p></section>${primary('Try Again')}</div>`)}
function reviewHeader(status='Pending Review',date='Sep 23, 2026',version='Version 4'){return `<section class="review-hero"><div class="eyebrow">EVIDENCE REVIEW</div><h1>${status}</h1><div class="hero-meta"><span>${date}</span><span>${version}</span></div></section>`}
function itemHeader(title,source,included=true){return `<div class="item-head"><div><h3>${title}</h3><div class="secondary">${source}</div></div><div style="text-align:right"><span class="tag ${included?'green':'muted'}">${included?'✓ Included':'− Excluded'}</span><div class="secondary" style="margin-top:5px">Sep 23, 2026</div></div></div>`}
function reviewMixed(){return shell(`<div class="page">${reviewHeader()}<section class="surface"><div class="section-head"><div><div class="micro">Captured Evidence</div><h2>1 nutrition entry and 1 activity entry</h2></div></div><article class="evidence-item">${itemHeader('Nutrition','Screenshot',true)}<div class="metric-grid">${metric('Calories','2,300 cal')}${metric('Protein','198 g','purple')}${metric('Carbs','244 g')}${metric('Fat','73 g','amber')}</div><div class="meal"><h3>Daily totals</h3><p class="small">Meal totals match the daily total.</p></div></article><article class="evidence-item">${itemHeader('Activity','Screenshot',false)}<div class="metric-grid">${metric('Active calories','650 cal')}${metric('Exercise','45 min')}</div></article><p class="small" style="margin-top:10px">1 activity entry excluded</p></section>${primary('Confirm')}<button class="button destructive" style="width:100%;margin-top:10px">Dismiss</button></div>`,'Back')}
function reviewPhoto(){return shell(`<div class="page">${reviewHeader()}<section class="surface rich"><div class="evidence-item">${itemHeader('Progress Photos','Progress photos',true)}<div class="metric-grid">${metric('Poses','1 photo · Rear Relaxed')}${metric('Time of day','Afternoon')}${metric('Goal relationship','Build Lean Mass','purple')}${metric('Source','Progress photos')}</div><div class="photo-session"><div class="micro">PHOTO SESSION</div><p class="small" style="margin:6px 0">Session photo_session_20260923</p><p class="small">Time of day: Afternoon</p><p class="small">Goal relationship: Build Lean Mass</p><div class="pose-line"><span class="file-icon" style="width:32px;height:32px">▧</span><span class="label">Rear Relaxed</span></div></div></div></section>${primary('Confirm')}<button class="button destructive" style="width:100%;margin-top:10px">Dismiss</button></div>`,'Back')}
function dexaMetrics(){return `<div class="metric-grid">${metric('Total mass','172.9 lb')}${metric('Body fat','8.1%','amber')}${metric('Fat tissue','14.0 lb')}${metric('Lean tissue','152.3 lb')}${metric('Bone mineral','6.6 lb')}${metric('RMR','1,774 kcal/day','purple')}${metric('VAT mass','0.24 lb')}${metric('VAT volume','7.1 in³')}${metric('PDF','BodySpec_DXA_2026-09-23.pdf')}</div>`}
function reviewDexa(){return shell(`<div class="page">${reviewHeader()}<section class="surface rich"><article class="evidence-item">${itemHeader('DEXA','Submitted evidence',true)}${dexaMetrics()}</article></section><div class="buttons">${action('Correct Measurements')}</div>${primary('Confirm')}<button class="button destructive" style="width:100%;margin-top:10px">Dismiss</button></div>`,'Back')}
function correction(){const rows=[['Measured date (YYYY-MM-DD)','2026-09-23'],['Total mass (lb)','172.9'],['Body fat (%)','8.1'],['Fat mass (lb)','14.0'],['Lean mass (lb)','152.3'],['Bone mineral content (lb)','6.6'],['Resting metabolic rate (kcal/day)','1774'],['Visceral fat mass (lb)','0.24'],['Visceral fat volume (in³)','7.1']];return shell(`<div class="page">${reviewHeader()}<section class="surface measurement-form"><div class="form-copy"><h2>Correct the interpreted scan</h2><p class="small" style="margin-top:6px">Every field is resent together — the server replaces the full measurement set, it does not merge.</p></div>${rows.map(([l,v])=>`<div class="field-row" data-field="${l}"><div class="label">${l}</div><input class="input" value="${v}" aria-label="${l}"></div>`).join('')}<div class="buttons" style="margin-top:12px">${action('Cancel')}${action('Save Corrections')}</div></section></div>`,'Back')}
function reviewLifecycle(){const states=[['Saving corrections…','spinner',''],['Confirming…','spinner',''],['Dismissing review…','spinner',''],['Dismissed','muted',''],['Confirmation accepted','ok','PhysiqueOS owns this confirmation. Remaining analysis and briefing updates continue in the background.'],['Confirmed','ok','PhysiqueOS owns this confirmation. Remaining analysis and briefing updates continue in the background.'],['Still confirming','wait','This is taking longer than usual. Reopen this review in a moment to check its status — confirmation continues on the server regardless of this screen.'],['Refresh required','wait','The correction may have been accepted, but its final state could not be verified. Refresh before making another change.'],['This review could not be updated.','error','']];return shell(`<div class="page">${head('EVIDENCE REVIEW','Lifecycle states')}<section class="surface rich">${states.map(([t,k,d])=>`<div class="state"><div class="state-head">${k==='spinner'?'<div class="spinner"></div>':`<div class="state-icon ${k==='error'?'red':''}">${k==='ok'?'✓':k==='error'?'!':k==='muted'?'×':'↻'}</div>`}<h3>${t}</h3></div>${d?`<p class="small">${d}</p>`:''}<div class="status-actions">${t==='Confirmation accepted'||t==='Confirmed'?action('Back to Log'):t==='Still confirming'?action('Check Now'):t==='Refresh required'?action('Refresh Review'):k==='error'?action('Try Again'):''}</div></div>`).join('')}</section></div>`,'Back')}
function reviewLoadStates(){return shell(`<div class="page">${head('EVIDENCE REVIEW','Read states')}<section class="surface rich"><div class="state"><div class="state-head"><div class="spinner"></div><h3>Loading Evidence Review</h3></div></div><div class="state"><div class="state-head"><div class="state-icon red">!</div><h3>This Evidence Review could not be loaded.</h3></div></div><div class="state"><div class="state-head"><div class="state-icon">?</div><h3>This Evidence Review could not be found.</h3></div></div></section></div>`,'Back')}
function reviewStatuses(){const statuses=[['pending','Pending Review','Confirm · Dismiss'],['commit_failed','Needs Attention','Confirm · Dismiss'],['partially_committed','Partially Confirmed','Confirm'],['committing','Confirming','Server-owned processing'],['confirmed','Confirmed','Back to Log'],['other','Review unavailable','No mutation']];return shell(`<div class="page">${head('EVIDENCE REVIEW','Server status semantics')}<section class="surface rich">${statuses.map(([wire,label,actions])=>`<div class="state"><div class="item-head" style="margin:0"><div><div class="micro">${wire}</div><h3>${label}</h3></div><span class="tag ${label==='Confirmed'?'green':label==='Needs Attention'?'amber':'muted'}">${actions}</span></div></div>`).join('')}</section><div class="buttons">${action('Confirm')}${action('Dismiss','destructive')}</div></div>`,'Back')}
let html;if(surface==='generic-chooser')html=genericChooser();else if(surface==='generic-auto-review')html=genericAutoReview();else if(surface==='generic-domain-handoffs')html=domainHandoffs();else if(surface==='generic-nutrition-manual')html=manual('nutrition');else if(surface==='generic-activity-manual')html=manual('activity');else if(surface==='generic-transaction-states')html=transactionStates();else if(surface==='photos-pose-review')html=photosPose(false);else if(surface==='photos-ready')html=photosPose(true);else if(surface==='photos-resume')html=photosResume();else if(surface==='photos-transfer-states')html=photoTransferStates();else if(surface==='dexa-empty')html=dexa(false);else if(surface==='dexa-selected')html=dexa(true);else if(surface==='dexa-validation-error')html=dexaError();else if(surface==='review-mixed')html=reviewMixed();else if(surface==='review-photo')html=reviewPhoto();else if(surface==='review-dexa')html=reviewDexa();else if(surface==='review-dexa-correction')html=correction();else if(surface==='review-lifecycle')html=reviewLifecycle();else if(surface==='review-load-states')html=reviewLoadStates();else if(surface==='review-status-semantics')html=reviewStatuses();else html=genericChooser();document.getElementById('app').innerHTML=html;
</script></body></html>
