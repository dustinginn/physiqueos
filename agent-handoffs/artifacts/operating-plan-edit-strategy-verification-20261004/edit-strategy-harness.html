<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Operating Plan editors</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#05090f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button{font:inherit}.op-edit-phone{--oe-bg:#06131e;--oe-text:#f4f7f5;--oe-muted:#92a4ad;--oe-line:#203541;--oe-surface:#102432;--oe-surface2:#153040;--oe-teal:#27c7b9;--oe-green:#51dda0;--oe-cyan:#45c6d8;--oe-amber:#f1ba4f;--oe-purple:#9d7dff;--oe-navy:#153f63;--oe-red:#ef7183;width:402px;min-height:874px;color:var(--oe-text);background:var(--oe-bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0009}.op-edit-phone.light{--oe-bg:#efeee7;--oe-text:#0b1c2d;--oe-muted:#61737a;--oe-line:#cad4cf;--oe-surface:#fbfaf6;--oe-surface2:#dcebe7;--oe-teal:#0b9185;--oe-green:#138b5f;--oe-cyan:#168b9c;--oe-amber:#b5760c;--oe-purple:#7354d9;--oe-navy:#143f61;--oe-red:#c54f65}.oe-status{height:46px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between;font-size:13px;font-weight:850;position:relative}.oe-island{position:absolute;top:11px;left:50%;width:118px;height:34px;border-radius:22px;background:#01050a;transform:translateX(-50%)}.oe-toolbar{min-height:48px;padding:0 18px;display:flex;align-items:center;border-bottom:1px solid var(--oe-line)}.oe-cancel{min-height:44px;display:flex;align-items:center;color:var(--oe-muted);font-size:14px;font-weight:800}.oe-page{padding:18px 18px 38px}.oe-header{margin-bottom:20px}.oe-eyebrow{font-size:10px;line-height:1.25;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--oe-purple)}h1,h2,h3,p{margin:0}h1{font-size:31px;line-height:1.04;letter-spacing:-.045em}.oe-body{font-size:14px;line-height:1.46;color:var(--oe-muted)}.oe-header h1{margin:7px 0 8px}.oe-section{padding:17px 0;border-top:1px solid var(--oe-line)}.oe-section:first-of-type{border-top:0;padding-top:0}.oe-section h2{font-size:16px;line-height:1.2;margin-bottom:12px}.oe-section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.oe-section-title h2{margin:0}.oe-total{font-size:11px;font-weight:850;color:var(--oe-green)}.oe-choice-row{display:flex;flex-wrap:wrap;gap:8px}.oe-choice{min-height:44px;border:1px solid var(--oe-line);border-radius:999px;background:var(--oe-surface);color:var(--oe-text);padding:0 13px;font-size:12px;font-weight:850;display:flex;align-items:center;gap:7px}.oe-choice:before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--oe-muted)}.oe-choice.selected{background:var(--oe-navy);border-color:var(--oe-navy);color:white}.oe-choice.selected:before{border-color:white;background:var(--oe-green)}.oe-stepper{min-height:64px;margin-top:10px;border-radius:16px;background:var(--oe-surface);display:grid;grid-template-columns:1fr 44px 44px;align-items:center;padding:0 8px 0 14px}.light .oe-stepper{box-shadow:0 7px 18px #143a4f0c}.oe-stepper strong{font-size:14px;line-height:1.3}.oe-step{width:40px;height:44px;border:0;background:transparent;color:var(--oe-teal);font-size:23px;font-weight:500}.oe-frequency{border-top:1px solid var(--oe-line)}.oe-frequency-row{min-height:58px;display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border-bottom:1px solid var(--oe-line)}.oe-frequency-label{font-size:14px;font-weight:820}.oe-count{display:grid;grid-template-columns:38px 58px 38px;align-items:center;background:var(--oe-surface);border-radius:13px;overflow:hidden}.oe-count button{width:38px;height:44px;border:0;background:transparent;color:var(--oe-teal);font-size:20px}.oe-count span{text-align:center;font-size:12px;font-weight:850;color:var(--oe-text)}.oe-focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.oe-focus .oe-choice{border-radius:13px;justify-content:flex-start}.oe-progress{display:grid;gap:8px}.oe-progress .oe-choice{width:100%;border-radius:13px}.oe-error{margin:3px 0 15px;padding:13px 14px;border-left:3px solid var(--oe-red);border-radius:0 13px 13px 0;background:#ef718313;color:var(--oe-red);font-size:13px;font-weight:800;line-height:1.4}.oe-save{min-height:52px;width:100%;border:0;border-radius:15px;background:linear-gradient(135deg,#168f84,#153f63);color:white;font-size:15px;font-weight:880}.oe-foot{margin-top:10px;text-align:center;font-size:11px;line-height:1.4;color:var(--oe-muted)}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'nutrition',theme=q.get('theme')||'dark';const invalid=surface==='training-error';
const frequencies=invalid?[['Arms',0],['Core',0],['Lower Body',0],['Back',0],['Chest',0],['Shoulders',0]]:[['Arms',2],['Core',2],['Lower Body',2],['Back',1],['Chest',1],['Shoulders',1]];
function chrome(content){return `<main class="op-edit-phone ${theme==='light'?'light':''}" data-theme="${theme}" data-surface="${surface}"><div class="oe-status"><span>1:05</span><span>▮▮▮⌁</span><div class="oe-island"></div></div><div class="oe-toolbar"><div class="oe-cancel" role="button">Cancel</div></div>${content}</main>`}
function choice(label,selected=false){return `<button class="oe-choice ${selected?'selected':''}" type="button" aria-pressed="${selected}">${label}</button>`}
function header(eyebrow,subtitle){return `<header class="oe-header"><div class="oe-eyebrow">${eyebrow}</div><h1>Edit Strategy</h1><p class="oe-body">${subtitle}</p></header>`}
function nutrition(){return `<div class="oe-page">${header('Nutrition','Macro targets that translate the Energy strategy into daily nutrition.')}<section class="oe-section" data-section="Protein Basis"><h2>Protein Basis</h2><div class="oe-choice-row">${choice('Per body weight',true)}${choice('Fixed grams')}</div><div class="oe-stepper" data-field="Protein ratio"><strong>1.0 g per lb bodyweight</strong><button class="oe-step" type="button" aria-label="Decrease protein ratio">−</button><button class="oe-step" type="button" aria-label="Increase protein ratio">＋</button></div></section><section class="oe-section" data-section="Carbohydrate Approach"><h2>Carbohydrate Approach</h2><div class="oe-choice-row">${choice('Performance',true)}${choice('Balanced')}${choice('Lower carbohydrate')}</div></section><section class="oe-section" data-section="Fat Approach"><h2>Fat Approach</h2><div class="oe-choice-row">${choice('Sustainable minimum',true)}${choice('Balanced')}${choice('Higher fat')}</div></section><button class="oe-save" type="button">Save Strategy</button></div>`}
function frequencyRow(row){return `<div class="oe-frequency-row" data-frequency="${row[0]}"><div class="oe-frequency-label">${row[0]}</div><div class="oe-count"><button type="button" aria-label="Decrease ${row[0]}">−</button><span>${row[1]}x / week</span><button type="button" aria-label="Increase ${row[0]}">＋</button></div></div>`}
function training(){const total=frequencies.reduce((sum,x)=>sum+x[1],0);return `<div class="oe-page">${header('Training','Weekly structure and progression intent for the current phase.')}<section class="oe-section" data-section="Weekly Frequency"><div class="oe-section-title"><h2>Weekly Frequency</h2><div class="oe-total">${total} area sessions</div></div><div class="oe-frequency">${frequencies.map(frequencyRow).join('')}</div></section><section class="oe-section" data-section="Training Focus"><h2>Training Focus</h2><div class="oe-focus">${['Arms','Core','Lower Body','Back','Chest','Shoulders'].map(x=>choice(x,!invalid&&['Chest','Back'].includes(x))).join('')}</div></section><section class="oe-section" data-section="Progression"><h2>Progression</h2><div class="oe-progress">${['Conservative','Moderate','Aggressive'].map(x=>choice(x,x==='Moderate')).join('')}</div></section>${invalid?'<div class="oe-error" role="alert">This strategy was not saved. Refresh before retrying.</div>':''}<button class="oe-save" type="button">Save Strategy</button></div>`}
document.getElementById('app').innerHTML=chrome(surface==='nutrition'?nutrition():training());
</script></body></html>
