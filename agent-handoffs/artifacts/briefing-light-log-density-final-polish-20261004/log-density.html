<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysiqueOS locked Log density validation</title>
<style>
@font-face{font-family:Jakarta;src:url("fonts/PlusJakartaSans.ttf") format("truetype");font-display:swap}
*{box-sizing:border-box}html,body{margin:0;background:#070b11;color:#f3f8fa;font-family:Jakarta,-apple-system,BlinkMacSystemFont,sans-serif}body{padding:28px}.board{display:flex;align-items:flex-start;justify-content:center;gap:36px;flex-wrap:wrap}.column{display:grid;gap:10px}.column>h2{margin:0;color:#aab7c4;font-size:13px}.phone{--bg:#e8ece5;--surface:#fbfaf4;--soft:#eef2ed;--text:#102431;--secondary:#526970;--muted:#5d7279;--rule:#1938422b;--brand:#5c3fd2;--action:#c88228;--actionInk:#fffaf1;--teal:#087e78;--green:#16875f;--amber:#925500;--cyan:#10708a;position:relative;width:402px;min-height:874px;overflow:hidden;border-radius:50px;background:var(--bg);color:var(--text);box-shadow:0 34px 80px #0006,0 0 0 1px #ffffff12;font-size:14px;line-height:1.35}.phone.dark{--bg:#061019;--surface:#0f1c2a;--soft:#122735;--text:#f3f8fa;--secondary:#c3d2d9;--muted:#92a5af;--rule:#9db3bd2f;--brand:#aa98ff;--action:#efb84f;--actionInk:#10202a;--teal:#3bd2ca;--green:#55e39a;--amber:#efb84f;--cyan:#3bc6dd;box-shadow:0 34px 80px #000a,0 0 0 1px #ffffff12}.statusbar{height:59px;display:flex;align-items:center;justify-content:space-between;padding:12px 27px 0;font-size:12px;font-weight:750;position:relative}.island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:124px;height:34px;border-radius:22px;background:#0a131d}.dark .island{background:#020408}.content{padding:8px 16px 18px}.eyebrow,.row-label,.source-label{font-size:11px;line-height:1.2;font-weight:750;letter-spacing:.09em;text-transform:uppercase}.eyebrow{color:var(--brand);margin-bottom:5px}.header{padding:2px 0 5px}.title{font-size:30px;line-height:1.04;letter-spacing:-.035em;font-weight:780}.subtitle{font-size:14px;line-height:1.4;color:var(--secondary);margin-top:6px}.training-action{margin-top:6px;min-height:96px;border-radius:16px;background:var(--action);color:var(--actionInk);padding:15px;display:grid;grid-template-columns:1fr 42px;gap:10px;align-items:center}.training-action strong{display:block;font-size:20px}.training-action p{font-size:12px;line-height:1.35;margin:5px 0 0;max-width:265px}.action-icon{width:42px;height:42px;border-radius:12px;background:#ffffff20;display:grid;place-items:center;font-size:18px}.today{padding:12px 0 2px}.row-between{display:flex;justify-content:space-between;align-items:center}.section-title{font-size:16px;font-weight:760}.date{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.tile{--tone:var(--teal);min-height:74px;border-top:2px solid var(--tone);background:color-mix(in srgb,var(--tone) 7%,var(--surface));border-radius:0 0 11px 11px;padding:9px}.tile.training,.tile.nutrition{min-height:104px}.tile.nutrition{--tone:var(--green)}.tile.activity{--tone:var(--amber)}.tile.weight{--tone:var(--cyan)}.row-label{color:var(--tone)}.summary{font-size:13px;font-weight:750;line-height:1.3;margin-top:5px}.summary-line{display:block}.context{font-size:12px;line-height:1.3;color:var(--secondary);font-weight:700;margin-top:5px}.sources{margin-top:9px;padding:10px 11px;border:1px solid color-mix(in srgb,var(--cyan) 26%,var(--rule));border-radius:12px;background:color-mix(in srgb,var(--cyan) 7%,var(--surface))}.sources-head{display:flex;align-items:center;gap:7px;color:var(--cyan);font-size:12px;font-weight:800}.source-line{display:grid;grid-template-columns:112px 1fr;gap:8px;padding-top:7px;font-size:11px;line-height:1.32}.source-line+.source-line{margin-top:5px;border-top:1px solid var(--rule)}.source-label{color:var(--text);letter-spacing:0;text-transform:none}.source-scope{color:var(--secondary)}.review{margin-top:8px;border-left:4px solid var(--amber);background:color-mix(in srgb,var(--amber) 7%,var(--surface));border-radius:0 12px 12px 0;padding:11px 12px}.review .row-label{color:var(--amber)}.review .meta{font-size:12px;color:var(--secondary);line-height:1.35}.review-title{font-size:14px;font-weight:750;margin-top:5px}.review p{font-size:12px;line-height:1.35;color:var(--secondary);margin:4px 0}.review-action{font-size:12px;color:var(--amber);font-weight:750;margin-top:6px}.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.quick-action{min-height:60px;border-radius:12px;padding:10px;background:var(--surface);border:1px solid var(--rule);display:flex;align-items:center;justify-content:space-between;color:var(--text);font-size:12px;font-weight:750}.quick-action.primary{background:color-mix(in srgb,var(--teal) 15%,var(--surface));border-color:color-mix(in srgb,var(--teal) 40%,transparent)}.details{min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--brand);font-size:13px;font-weight:750}.upload-caption{font-size:11px;color:var(--muted);text-align:center;margin-top:-4px}.tabbar{height:82px;background:color-mix(in srgb,var(--bg) 95%,transparent);border-top:1px solid var(--rule);display:grid;grid-template-columns:repeat(5,1fr);align-items:start;padding-top:10px}.tab{min-height:44px;text-align:center;color:var(--muted);font-size:10px;font-weight:650}.tab b{display:block;font-size:18px;line-height:1.35}.tab.selected{color:var(--brand)}[data-semantic][hidden]{display:none}
.sources{margin-top:7px;padding:0;border:0;border-top:1px solid var(--rule);border-radius:0;background:transparent}.sources summary{list-style:none;min-height:44px;display:flex;align-items:center;gap:7px;color:var(--cyan);font-size:12px;font-weight:800;cursor:pointer}.sources summary::-webkit-details-marker{display:none}.source-count{margin-left:auto;color:var(--muted);font-size:11px;font-weight:700}.disclosure{font-size:13px;transition:transform .15s ease}.sources[open] .disclosure{transform:rotate(180deg)}.source-content{padding:0 11px 10px;border:1px solid color-mix(in srgb,var(--cyan) 26%,var(--rule));border-radius:10px;background:color-mix(in srgb,var(--cyan) 7%,var(--surface))}.source-line{padding-top:8px}
@media(max-width:880px){body{padding:12px}.board{gap:24px}.phone{width:min(402px,100vw - 24px);border-radius:42px}}
</style>
</head>
<body><main class="board" id="board"></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sem=(key,value,html)=>`<span data-semantic="${key}" data-value="${esc(value)}">${html??esc(value)}</span>`;
const hidden=(key,value)=>`<span data-semantic="${key}" data-value="${esc(value)}" hidden></span>`;
const status=()=>`<div class="statusbar"><span>1:05</span><span class="island"></span><span>▮▮▮ ᯤ ▰</span></div>`;
function tabs(f){return `<nav class="tabbar" aria-label="Primary navigation">${f.navigation.map((n,i)=>`<div class="tab${n==='Log'?' selected':''}" data-semantic="navigation.${i}" data-value="${esc(n)}"><b>${['⌂','◎','＋','◫','●'][i]}</b>${esc(n)}</div>`).join('')}</nav>`}
function tile(row,index){const summaries=row.lines?.length?row.lines.map((line,lineIndex)=>`<span class="summary-line">${sem(`loggedToday.rows.${index}.lines.${lineIndex}.summary`,line.summary)}</span>${hidden(`loggedToday.rows.${index}.lines.${lineIndex}.kind`,line.kind)}`).join(''):sem(`loggedToday.rows.${index}.summary`,row.summary);return `<div class="tile ${row.kind}" role="button" aria-label="${esc(row.label)}, ${esc(row.summary)}"><div class="row-label">${sem(`loggedToday.rows.${index}.label`,row.label)}</div><div class="summary">${summaries}</div>${row.context?`<div class="context">${sem(`loggedToday.rows.${index}.context`,row.context)}</div>`:hidden(`loggedToday.rows.${index}.context`,null)}${hidden(`loggedToday.rows.${index}.kind`,row.kind)}${hidden(`loggedToday.rows.${index}.summary`,row.summary)}${hidden(`loggedToday.rows.${index}.destination`,row.destination)}</div>`}
function sources(f){return `<details class="sources" data-section="log-sources" aria-label="Evidence sources"><summary>⌁ ${sem('loggedToday.sources.title','Sources')}<span class="source-count">${f.loggedToday.sources.length} sources</span><b class="disclosure">⌄</b></summary><div class="source-content">${f.loggedToday.sources.map((item,i)=>`<div class="source-line"><span class="source-label">${sem(`loggedToday.sources.${i}.source`,item.source)}</span><span class="source-scope">${sem(`loggedToday.sources.${i}.scope`,item.scope.join(' · '))}</span></div>`).join('')}</div></details>`}
function review(f){const r=f.pendingEvidenceReviews.items[0];return `<section class="review" data-section="log-review"><div class="row-label">${sem('pendingEvidenceReviews.sectionTitle',f.pendingEvidenceReviews.sectionTitle)}</div><div class="meta">${sem('pendingEvidenceReviews.sectionSubtitle',f.pendingEvidenceReviews.sectionSubtitle)}</div><div class="review-title">${sem('pendingEvidenceReviews.items.0.title',r.title)}</div><p>${sem('pendingEvidenceReviews.items.0.date',r.date)} · ${sem('pendingEvidenceReviews.items.0.summary',r.summary)}</p><div class="review-action">${sem('pendingEvidenceReviews.items.0.actionLabel',r.actionLabel)} →</div>${hidden('pendingEvidenceReviews.items.0.id',r.id)}${hidden('pendingEvidenceReviews.items.0.likelyDuplicate',r.likelyDuplicate)}${hidden('pendingEvidenceReviews.items.0.destination',r.destination)}</section>`}
function phone(f,theme){return `<article class="phone ${theme}" data-variant="log-${theme}">${status()}<div class="content"><header class="header" data-section="log-header"><div class="eyebrow">${sem('header.eyebrow',f.header.eyebrow)}</div><div class="title">${sem('header.title',f.header.title)}</div><div class="subtitle">${sem('header.subtitle',f.header.subtitle)}</div></header><section class="training-action" data-section="log-training-logger" role="button"><div><strong>${sem('trainingLogger.title',f.trainingLogger.title)}</strong><p>${sem('trainingLogger.subtitle',f.trainingLogger.subtitle)}</p>${hidden('trainingLogger.destination',f.trainingLogger.destination)}</div><span class="action-icon">◆</span></section><section class="today" data-section="log-today"><div class="row-between"><div class="section-title">${sem('loggedToday.title',f.loggedToday.title)}</div><div class="date">${sem('localDate',f.localDate)}</div></div><div class="grid">${f.loggedToday.rows.map(tile).join('')}</div></section>${review(f)}<section class="quick-actions" data-section="log-quick-actions"><div class="quick-action">${sem('weightAction.label',f.weightAction.label)} <b>＋</b>${hidden('weightAction.destination',f.weightAction.destination)}</div><div class="quick-action primary">${sem('upload.primaryAction',f.upload.primaryAction)} <b>⇧</b></div></section><div class="details">${sem('upload.secondaryAction',f.upload.secondaryAction)}</div><div class="upload-caption">${sem('upload.title',f.upload.title)} · ${sem('upload.subtitle',f.upload.subtitle)}</div>${hidden('upload.destination',f.upload.destination)}${hidden('viewState',f.viewState)}${f.upload.sourceOptions.map((v,i)=>hidden(`upload.sourceOptions.${i}`,v)).join('')}${sources(f)}</div>${tabs(f)}</article>`}
function main(){const f=globalThis.__LOG_DENSE_FIXTURE__;if(!f)throw new Error('Log fixture was not injected');document.getElementById('board').innerHTML=`<section class="column"><h2>Compact Command Center · dark · realistic density</h2>${phone(f,'dark')}</section><section class="column"><h2>Compact Command Center · mineral light · realistic density</h2>${phone(f,'light')}</section>`;document.documentElement.dataset.ready='true'}
main();
</script></body></html>
