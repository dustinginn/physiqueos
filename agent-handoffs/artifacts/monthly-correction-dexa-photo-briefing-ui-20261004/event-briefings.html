<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS DEXA and Photo Briefings</title><link rel="stylesheet" href="fonts/fonts.css"><style>
*{box-sizing:border-box}html,body{margin:0;background:#050910;color:#eef4f5;font-family:Inter,system-ui,-apple-system,sans-serif}body{padding:24px}.stage{display:flex;gap:36px;align-items:flex-start;justify-content:center}.phone{width:402px;overflow:hidden;border-radius:52px;background:var(--bg);color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.42);--bg:#06131c;--surface:#0d1d29;--surface2:#112432;--text:#f2f6f6;--muted:#91a4ad;--rule:#203341;--teal:#35c8c1;--green:#4bdc95;--purple:#a68af8;--amber:#f5bd4f;--cyan:#38c4dd;--red:#f06d84;--navy:#0a2432}.phone.light{--bg:#edf0e9;--surface:#f8f8f3;--surface2:#e2ebe6;--text:#102638;--muted:#60727b;--rule:#c9d2cf;--teal:#078f88;--green:#138f63;--purple:#7356d9;--amber:#b97912;--cyan:#147f98;--red:#b7415a;--navy:#133847}.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:17px 24px 0;font-size:12px;font-weight:800}.island{width:122px;height:33px;border-radius:19px;background:#02070c}.status-icons{font-size:10px;letter-spacing:1px}.content{padding:0 15px 42px}.nav{height:51px;display:flex;align-items:center;gap:8px}.nav-chip{font-size:10px;font-weight:750;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.055)}.light .nav-chip{background:rgba(16,38,56,.06)}.hero{position:relative;margin:0 -15px;padding:28px 22px 30px;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,#0a8c80,#0b5366 58%,#172d5a);color:#f5faf9}.light .hero{background:linear-gradient(150deg,#d6eeea,#c4e1df 58%,#d7dfef);color:#102638}.hero:after{content:"";position:absolute;width:330px;height:330px;border:54px solid rgba(76,226,159,.18);border-radius:50%;right:-175px;bottom:-145px;z-index:-1}.eyebrow,.section-label,.metric-label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:850}.eyebrow{color:#d6c9ff}.light .eyebrow{color:#6c50d2}.hero-date{color:rgba(245,250,249,.68);font-size:11px}.light .hero-date{color:#526b74}.hero-top{display:flex;justify-content:space-between;gap:10px}.hero h1{font-size:31px;line-height:1.04;letter-spacing:-.03em;margin:18px 0 10px}.hero-copy{font-size:13px;line-height:1.48;color:#d5e5e4;margin:0}.light .hero-copy{color:#3f5d62}.confidence-row{display:flex;gap:18px;align-items:center;margin-top:22px}.ring{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--score)*1%),rgba(255,255,255,.17) 0);flex:0 0 auto}.ring-inner{width:94px;height:94px;border-radius:50%;background:#0b4050;display:grid;place-content:center;text-align:center}.light .ring-inner{background:#eaf2ed}.ring b{font-size:31px;line-height:1}.ring small{font-size:8px;text-transform:uppercase;color:#c7d7d9;margin-top:3px}.light .ring small{color:#5d7078}.confidence-copy strong{display:block;font-size:13px;color:var(--green);text-transform:uppercase;letter-spacing:.06em}.confidence-copy p{margin:5px 0 0;font-size:11px;line-height:1.45;color:#d6e2e3}.light .confidence-copy p{color:#3f5d62}.hero-metrics{display:grid;grid-template-columns:1fr 1fr;margin-top:22px;border-top:1px solid rgba(255,255,255,.18)}.hero-metric{padding:13px 8px 10px 0;border-bottom:1px solid rgba(255,255,255,.18)}.hero-metric:nth-child(even){padding-left:12px;border-left:1px solid rgba(255,255,255,.18)}.light .hero-metrics,.light .hero-metric,.light .hero-metric:nth-child(even){border-color:rgba(16,38,56,.14)}.hero-metric span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;opacity:.68}.hero-metric b{display:block;font-size:19px;margin-top:4px}.hero-metric small{font-size:10px;opacity:.7}.section{padding:28px 8px 5px;border-bottom:1px solid var(--rule)}.section:last-child{border:0}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.section-title{font-size:24px;line-height:1.08;letter-spacing:-.025em;margin:12px 0 8px}.body-copy{font-size:12px;line-height:1.5;color:var(--muted);margin:0 0 14px}.snapshot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);margin:16px -8px 0}.snapshot-grid>div{padding:14px;background:var(--bg)}.snapshot-grid span,.comparison-head span{font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.snapshot-grid b{display:block;font-size:17px;margin-top:5px}.change{padding:14px 0;border-top:1px solid var(--rule)}.change-top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:10px}.change-top strong{font-size:14px}.delta{font-size:13px;color:var(--green);font-weight:800}.before-after{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:9px}.rail{height:5px;background:var(--rule);margin-top:7px;position:relative}.rail i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}.rail b{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--green);right:calc(100% - var(--pct));top:-3px}.data-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:11px}.data-table th{text-align:left;text-transform:uppercase;letter-spacing:.08em;font-size:8px;color:var(--muted);font-weight:800;padding:8px 0}.data-table th:not(:first-child),.data-table td:not(:first-child){text-align:right}.data-table td{padding:10px 0;border-top:1px solid var(--rule)}.data-table td:last-child{color:var(--green);font-weight:800}.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}.data-field{background:var(--surface);padding:14px;border-radius:16px;margin-top:15px}.light .data-field.tint{background:linear-gradient(135deg,#d7eae5,#e4e0ef)}.data-field h3{font-size:14px;margin:0}.timeline{padding:18px;background:linear-gradient(135deg,rgba(53,200,193,.13),rgba(166,138,248,.12));margin:16px 0;border-left:3px solid var(--teal)}.timeline-track{display:flex;align-items:center;gap:7px;margin:13px 0}.timeline-track i{width:9px;height:9px;border-radius:50%;background:var(--green)}.timeline-track span{height:3px;flex:1;background:linear-gradient(90deg,var(--teal),var(--green))}.timeline-track b{font-size:10px}.interpretation p{padding:12px 0;margin:0;border-top:1px solid var(--rule);font-size:12px;line-height:1.5}.evidence-note{padding:14px;margin-top:14px;background:rgba(166,138,248,.1);border-left:3px solid var(--purple);font-size:11px;line-height:1.45}.coach{margin:24px -7px 0;padding:22px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,#0e3141,#1c315c);color:#f5f7f8}.light .coach{background:linear-gradient(135deg,#133c49,#2a3665)}.coach .section-label{color:#cbbcff}.coach-item{display:grid;grid-template-columns:64px 1fr;gap:9px;padding:12px 0;border-top:1px solid rgba(255,255,255,.14);font-size:11px;line-height:1.42}.coach-item:first-of-type{margin-top:10px}.coach-item span{color:#8fe5c1;text-transform:uppercase;font-size:9px;font-weight:800}.revision{margin:24px 0 0;padding:14px;border-left:2px solid var(--amber);font-size:10px;line-height:1.45;color:var(--muted);background:rgba(245,189,79,.06)}
.photo-hero{padding-bottom:0}.photo-hero h1{max-width:330px}.photo-media{position:relative;height:360px;margin:22px -22px 0;overflow:hidden;background:#11202b}.photo-media img{position:absolute;width:330px;height:575px;max-width:none;left:36px;top:0;object-fit:cover;object-position:top}.photo-media:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(4,15,22,.82))}.media-note{position:absolute;z-index:2;left:16px;bottom:14px;font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:rgba(5,15,22,.68);padding:7px 9px;border-radius:8px}.photo-facts{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:0 -8px}.photo-fact{padding:14px 8px;border-bottom:1px solid var(--rule)}.photo-fact b{display:block;font-size:12px;margin-top:4px}.pose-row{padding:13px 0;border-top:1px solid var(--rule)}.pose-row strong{font-size:13px}.pose-row p{margin:4px 0 0;color:var(--muted);font-size:11px;line-height:1.42}.pose-row small{display:block;color:var(--teal);margin-top:6px;font-size:9px;text-transform:uppercase;letter-spacing:.06em}.photo-pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.photo-well{height:250px;position:relative;overflow:hidden;background:#132330}.photo-well img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}.photo-label{position:absolute;z-index:2;left:8px;bottom:8px;background:rgba(4,13,19,.75);color:#fff;padding:6px 8px;border-radius:7px;font-size:9px}.comparison-card{padding:17px 0;border-top:1px solid var(--rule)}.comparison-card:first-child{border-top:0}.comparison-card h3{font-size:15px;margin:0}.comparison-card p{font-size:11px;line-height:1.45;color:var(--muted);margin:8px 0 0}.image-unavailable{height:170px;display:grid;place-content:center;text-align:center;background:var(--surface);color:var(--muted);font-size:11px;line-height:1.5;border-radius:16px;margin-top:12px}.image-unavailable b{color:var(--text);font-size:13px}.photo-insight{padding:18px;background:linear-gradient(135deg,rgba(53,200,193,.12),rgba(166,138,248,.11));border-left:3px solid var(--teal);font-size:13px;line-height:1.52}.milestone{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10px}.milestone b{font-size:12px}.bottom-safe{height:22px}.family-label{position:sticky;top:0;z-index:10;padding:8px 10px;background:#070b11;color:#dce4e6;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.light .family-label{background:#e5e9e3;color:#193244}.media-unavailable-state{height:100%;display:grid;place-content:center;text-align:center;padding:24px;color:var(--muted);background:var(--surface);font-size:11px;line-height:1.5}.media-unavailable-state b{color:var(--text);font-size:14px}.media-unavailable-state button{margin:14px auto 0;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--teal);color:#06131c;font:inherit;font-weight:800}@media(max-width:900px){body{padding:10px}.stage{flex-direction:column;align-items:center}.phone{width:min(402px,100%)}}
</style></head><body><div class="stage" id="stage"></div><script src="source/event-fixtures.js"></script><script>
const f=window.EVENT_BRIEFING_FIXTURES;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shell(theme,type,body){return `<article class="phone ${theme}" data-briefing="${type}" data-theme="${theme}"><div class="family-label">${type} Briefing · ${theme==='light'?'Mineral Light':'Dark'}</div><div class="status"><span>1:05</span><span class="island"></span><span class="status-icons">▮▮▮⌁</span></div><main class="content"><nav class="nav"><span class="nav-chip">‹ Home</span><span class="nav-chip">▦ Briefing History</span></nav>${body}<div class="bottom-safe"></div></main></article>`}
function ring(c){return `<div class="confidence-row"><div class="ring" style="--score:${c.score}" role="img" aria-label="Confidence ${c.score} percent, ${esc(c.band)}, ${esc(c.movement)}"><div class="ring-inner"><b>${c.score}%</b><small>Confidence</small></div></div><div class="confidence-copy"><strong>${esc(c.band)} · ${esc(c.movement)} ${c.delta}</strong><p>${esc(c.primaryReason)}</p></div></div>`}
function table(rows,title){return `<div class="data-field tint"><h3>${esc(title)}</h3><table class="data-table"><thead><tr><th>Region</th><th>Aug 16</th><th>Aug 30</th><th>Change</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${esc(x.before)}</td><td>${esc(x.after)}</td><td>${esc(x.delta)}</td></tr>`).join('')}</tbody></table></div>`}
function dexa(theme){const d=f.dexa;return shell(theme,'DEXA',`<section class="hero" data-section="dexa-hero"><div class="hero-top"><span class="eyebrow">DEXA Briefing</span><span class="hero-date">Scan · ${d.eventDate}</span></div><h1>${esc(d.hero.title)}</h1><p class="hero-copy">${esc(d.hero.body)}</p>${ring(d.confidence)}<div class="hero-metrics">${d.hero.results.map(x=>`<div class="hero-metric"><span>${esc(x.label)}</span><b>${esc(x.value)}</b><small>${esc(x.detail)}</small></div>`).join('')}</div></section><section class="section" data-section="dexa-snapshot"><div class="section-head"><span class="section-label">Snapshot</span><span class="metric-label">Measured event</span></div><div class="snapshot-grid"><div><span>Date</span><b>${d.snapshot.date}</b></div><div><span>Window</span><b>${d.snapshot.window}</b></div><div><span>Scans</span><b>${d.snapshot.scans}</b></div><div><span>RMR</span><b>${d.snapshot.rmr}</b></div></div></section><section class="section" data-section="dexa-progress"><div class="section-head"><span class="section-label">What Measurably Changed</span><span class="metric-label">Since Last Scan</span></div><h2 class="section-title">The gain was mostly lean tissue.</h2>${d.headlineChanges.map(x=>`<div class="change"><div class="change-top"><strong>${esc(x.label)}</strong><span class="delta">${esc(x.delta)}</span></div><div class="before-after"><span>${esc(x.before)}</span><span>${esc(x.after)}</span></div><div class="rail" style="--pct:${x.percent}%"><i style="width:${x.percent}%"></i><b></b></div></div>`).join('')}${table(d.regionalFat,'Regional Fat Change')}${table(d.regionalLean,'Measured Lean Tissue Change')}${table(d.supplemental,'Other Notable Changes')}<div class="timeline"><span class="section-label">${esc(d.timeline.label)}</span><div class="timeline-track"><b>${d.timeline.start}</b><i></i><span></span><i></i><b>${d.timeline.end}</b></div><p class="body-copy">${esc(d.timeline.days)} · ${esc(d.timeline.scans)}</p><p class="body-copy">${esc(d.timeline.summary)}</p></div></section><section class="section interpretation" data-section="dexa-meaning"><span class="section-label">What This Scan Means</span><h2 class="section-title">Controlled gain, with one rate to watch.</h2>${Object.values(d.interpretation).slice(0,5).map(x=>`<p>${esc(x)}</p>`).join('')}<div class="evidence-note"><strong>Supporting evidence</strong><br>${esc(d.interpretation.supporting)}<br><br><strong>Still unresolved</strong><br>${esc(d.interpretation.uncertainty)}</div></section><section class="section coach" data-section="dexa-coach"><span class="section-label">Coach's Insight</span>${[['Biggest win',d.coach.win],['Protect',d.coach.protect],['Watch',d.coach.watch],['Next',d.coach.next]].map(x=>`<div class="coach-item"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}</section><aside class="revision" data-section="dexa-revision"><strong>Updated publication</strong><br>${esc(d.revision.reason)}<br><br>Replaced: “${esc(d.revision.replacedHeadline)}”<br>${esc(d.revision.priorVersion)} → ${esc(d.revision.replacement)}</aside>`)}
function sourceImage(cls,label){const file=cls==='prior'?'founder-back-relaxed-prior-detail.png':'founder-back-relaxed-current-detail.png';return `<div class="photo-well ${cls}" data-prototype-only="safe-founder-media-reference"><img src="media/${file}" alt="Founder Back Relaxed progress photo, app-rendered safe reference"><span class="photo-label">${label}</span></div>`}
function photo(theme){const p=f.photo;const comparisons=p.progress.comparisons;return shell(theme,'Photo',`<section class="hero photo-hero" data-section="photo-hero"><div class="hero-top"><span class="eyebrow">Photo Briefing</span><span class="hero-date">${p.eventDate}</span></div><h1>${esc(p.hero.title)}</h1><p class="hero-copy">${esc(p.hero.body)}</p><div class="photo-media" data-prototype-only="safe-founder-media-reference"><img src="media/founder-back-relaxed-current.png" alt="Founder Back Relaxed progress photo from authenticated app render"><span class="media-note">App-rendered Founder media · safe visual reference</span></div></section><section class="section" data-section="photo-snapshot"><div class="section-head"><span class="section-label">This Session</span><span class="metric-label">${esc(p.completion)}</span></div><div class="photo-facts"><div class="photo-fact"><span class="metric-label">Date</span><b>${esc(p.eventDate)}</b></div><div class="photo-fact"><span class="metric-label">Weight</span><b>${esc(p.weight)}</b></div><div class="photo-fact" style="grid-column:1/-1"><span class="metric-label">Conditions</span><b>${esc(p.conditions)}</b></div></div>${p.activeViews.map(x=>`<div class="pose-row"><strong>${esc(x.pose)}</strong><p>${esc(x.headline)}</p>${x.observation?`<p>${esc(x.observation)}</p>`:''}<small>${esc(x.comparability)}</small></div>`).join('')}</section><section class="section" data-section="photo-progress"><span class="section-label">${esc(p.progress.title)}</span><h2 class="section-title">${esc(p.progress.body)}</h2><div class="comparison-card" data-prototype-only="safe-founder-media-reference"><h3>Back Relaxed · safe media reference</h3><p>The available app render is shown with its truthful Jun 20 → Jun 27 mapping. It is a visual treatment reference only, not asserted as the canonical Aug 16 → Aug 30 fixture media.</p><div class="photo-pair">${sourceImage('prior','Jun 20')}${sourceImage('current','Jun 27')}</div></div>${comparisons.map((x,i)=>`<div class="comparison-card"><div class="comparison-head"><span>${esc(x.prior)}</span><span> → </span><span>${esc(x.current)}</span></div><h3>${esc(x.pose)}</h3><p>${esc(x.narrative)}</p></div>`).join('')}</section><section class="section" data-section="photo-meaning"><span class="section-label">${esc(p.interpretation.title)}</span>${p.interpretation.paragraphs.map(x=>`<p class="body-copy" style="margin-top:12px">${esc(x)}</p>`).join('')}</section><section class="section coach" data-section="photo-coach"><span class="section-label">Coach's Insight</span><p style="font-size:15px;line-height:1.5;margin:13px 0 0">${esc(p.coach.insight)}</p><div class="milestone"><span>Next milestone</span><b>${esc(p.coach.nextMilestone)}</b></div></section>`)}
const q=new URLSearchParams(location.search);const type=q.get('type')||'dexa';const theme=q.get('theme')||'dark';const compare=q.get('compare')==='1';const unavailable=q.get('state')==='unavailable';document.getElementById('stage').innerHTML=compare?(dexa('dark')+dexa('light')+photo('dark')+photo('light')):(type==='photo'?photo(theme):dexa(theme));if(unavailable&&type==='photo'){document.querySelectorAll('.photo-media,.photo-well').forEach(node=>node.innerHTML='<div class="media-unavailable-state" data-state="image-unavailable"><b>Photo unavailable</b><span>This image could not be loaded.</span><button type="button">Try Again</button></div>')}
</script></body></html>
