<style>
/* ---------- Accepted PhysiqueOS redesign tokens (ios/PhysiqueOS/SharedUI/PhysiqueOSTheme.swift @ 9d0a2069) ---------- */

/* ---------- New Operating Plan customization components (design proposal) ---------- */
.phone { min-height: 874px; }
.content { padding-bottom: 110px; }
.phone .sec-label { font-size: .6875em; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
.phone .lead { font-size: .9375em; line-height: 1.45; color: var(--ink2); }
/* sticky change tray (Approach A) */
.tray { position: absolute; left: 12px; right: 12px; bottom: 26px; z-index: 4; background: var(--paper); border: 1px solid var(--hairline); border-radius: 22px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.32); }

.tray .count { width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: var(--onTeal); display: grid; place-items: center; font-weight: 800; font-size: .875em; flex: none; }

/* strategy rows */
.srow { display: flex; gap: 12px; align-items: center; padding: 12px 0; min-height: 60px; }

.chg { border-left: 3px solid var(--amber); padding-left: 12px; margin-left: -1px; }
.was { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.now { font-weight: 800; color: var(--ink); }
/* range slider */
.rng { position: relative; height: 44px; display: flex; align-items: center; }
.rng input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; background: transparent; margin: 0; position: relative; z-index: 2; cursor: pointer; }
.rng input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 99px; background: transparent; }
.rng input[type=range]::-moz-range-track { height: 8px; border-radius: 99px; background: transparent; }
.rng input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; border-radius: 50%; background: #fff; border: 3px solid var(--teal); margin-top: -11px; box-shadow: 0 3px 10px rgba(0,0,0,.35); }
.rng input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--teal); box-shadow: 0 3px 10px rgba(0,0,0,.35); }
.rng input[type=range]:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; border-radius: 12px; }
.rng .track { position: absolute; left: 0; right: 0; height: 8px; border-radius: 99px; background: var(--soft); border: 1px solid var(--hairline); z-index: 1; overflow: hidden; }
.rng .track .z { position: absolute; top: 0; bottom: 0; }

.rng.amber input[type=range]::-webkit-slider-thumb { border-color: var(--amber); }
.rng.purple input[type=range]::-webkit-slider-thumb { border-color: var(--purple); }
.ticks { display: flex; justify-content: space-between; font-size: .6875em; color: var(--muted); margin-top: -2px; }
.bigval { font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 2em; letter-spacing: -.03em; line-height: 1; }
.bigval small { font-size: .45em; letter-spacing: 0; color: var(--ink2); font-weight: 700; margin-left: 4px; }
.band { display: flex; gap: 8px; flex-wrap: wrap; }
.band > div { flex: 1; min-width: 130px; background: var(--soft); border: 1px solid var(--hairline); border-radius: 14px; padding: 10px 12px; }
.band b { display: block; font-size: 1em; margin-top: 3px; }
.band span { font-size: .6875em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--hairline); border-radius: 999px; padding: 0 14px; min-height: 40px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .8125em; color: var(--ink2); background: var(--paper); cursor: pointer; user-select: none; }
.chip.on { border-color: var(--teal); color: var(--teal); background: var(--tealWash); }
.chip.dis { opacity: .45; border-style: dashed; cursor: default; }
.alloc { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.numbox { border: 1.5px solid var(--teal); border-radius: 12px; padding: 7px 10px; font-weight: 800; font-size: .9375em; background: var(--paper); min-width: 104px; text-align: right; display: inline-flex; justify-content: space-between; gap: 8px; }
.numbox.err { border-color: var(--red); color: var(--red); }
.numbox.ro { border-style: dashed; border-color: var(--hairline); color: var(--ink2); }
.mini-step { display: inline-flex; border: 1px solid var(--hairline); border-radius: 10px; overflow: hidden; }
.mini-step span { width: 40px; height: 40px; display: grid; place-items: center; color: var(--teal); font-weight: 700; cursor: pointer; user-select: none; }
.ewarn { display: flex; gap: 8px; align-items: flex-start; border-radius: 12px; padding: 9px 11px; font-size: .78em; line-height: 1.4; margin-top: 8px; }

.ewarn.amber { background: var(--amberWash); color: var(--ink); border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent); }

.ewarn.red { background: var(--redWash); color: var(--ink); border: 1px solid color-mix(in srgb, var(--red) 55%, transparent); }
.ewarn.red svg { color: var(--red); }

.ewarn.info svg { color: var(--teal); }

.ewarn.ok svg { color: var(--green); }

.ebar { display: flex; height: 34px; border-radius: 10px; overflow: hidden; border: 1px solid var(--hairline); font-size: .6875em; font-weight: 800; }
.ebar > div { display: grid; place-items: center; color: var(--onTeal); white-space: nowrap; overflow: hidden; }

.ebar .gap { background: repeating-linear-gradient(135deg, var(--amberWash) 0 6px, transparent 6px 12px); color: var(--amberInk); border-left: 1.5px dashed var(--amber); }

.sw.on { background: var(--green); border-color: var(--green); }

/* list rows */

.lrow .l { font-size: .9375em; }
.lrow .l small { display: block; color: var(--ink2); font-size: .8125em; margin-top: 2px; line-height: 1.35; }

.alert .ab { padding: 20px 18px 16px; }
.alert .ab .t { font-weight: 800; font-size: 1.0625em; }
.alert .ab p { font-size: .8125em; color: var(--ink2); margin-top: 6px; line-height: 1.4; }
.alert .act { border-top: 1px solid var(--rule); min-height: 46px; display: grid; place-items: center; color: var(--teal); font-weight: 600; font-size: 1em; }
.alert .act.red { color: var(--red); }
.alert .act.b { font-weight: 800; }
/* steps header (Approach B) */
.steps { display: flex; gap: 4px; margin: 2px 0 10px; }
.steps i { flex: 1; height: 5px; border-radius: 9px; background: var(--soft); border: 1px solid var(--hairline); }
.steps i.done { background: var(--teal); border-color: var(--teal); }
.steps i.cur { background: color-mix(in srgb, var(--teal) 45%, var(--soft)); border-color: var(--teal); }
/* week grid */

// ---------------------------------------------------------------------------
// Energy balance model used by the interactive prototype screens.
// 1:1 ACCOUNTING (Founder correction 2026-10-10): every added activity kcal
// counts in full. There is no discount factor anywhere.
//   intake target   = estimated maintenance + selected balance + added activity
//   Watch goal      = usual active energy + added activity
// Usual activity is already inside calibrated maintenance and is never added
// again. Measurement error is handled by calibration ranges and outcome-based
// recalibration (Quick Calibration), not by discounting activity.
// Founder Oct 9 numbers come from the Phase B dormant candidate (99f11ae6):
// maintenance ≈ 2,117 logged kcal/day (1,977–2,258) at ~800 kcal usual activity.
// Floor, added-activity cap and presets are PROVISIONAL design proposals.
// ---------------------------------------------------------------------------
const EM = {
  maintenance: 2117, low: 1977, high: 2258,      // logged kcal/day, usual activity included
  usual: 800,                                     // usual Apple Watch active energy (already inside maintenance)
  densityLoss: 3300, densityGain: 2500,           // kcal per lb of mixed weight change (provisional policy)
  fatToLose: 2.6, fatShare: [0.8, 0.95],          // Phase B lean-out projection
  floorBelow: 0.25, floorRound: 25,               // provisional: intake floor 25% below maintenance, rounded up
  maxAdded: 500,                                  // provisional cap on added activity per day
  plan: { intake: 2500, activity: 800 },
};
const fmt = (v) => Math.round(v).toLocaleString('en-US');
const sgn = (v) => (v > 0 ? '+' : v < 0 ? '−' : '') + fmt(Math.abs(v));
const floorFor = (m) => Math.ceil((m * (1 - EM.floorBelow)) / EM.floorRound) * EM.floorRound;

function energyCalc(net, added, m = EM.maintenance) {
  const floor = floorFor(m);
  let intake = Math.round(m + net + added);
  const warnings = [];
  let clamped = false;
  if (intake < floor) { intake = floor; clamped = true; warnings.push(['red', `Eating can’t go below ${fmt(floor)} kcal (provisional floor, 25% under your maintenance). Add activity or choose a smaller deficit.`]); }
  const effNet = intake - m - added;
  // uncertainty comes from the calibrated maintenance range only
  const netLo = intake - EM.high - added;
  const netHi = intake - EM.low - added;
  const density = effNet < 0 ? EM.densityLoss : EM.densityGain;
  const rate = (n) => (n * 7) / density;
  const rLo = rate(netLo), rHi = rate(netHi);
  let weeks = null;
  if (effNet < -60) {
    const lossLo = EM.fatToLose / EM.fatShare[1], lossHi = EM.fatToLose / EM.fatShare[0];
    const fast = Math.abs(Math.min(rLo, rHi)), slow = Math.max(0.15, Math.abs(Math.max(rLo, rHi)));
    weeks = [Math.max(1, Math.round(lossLo / fast)), Math.max(2, Math.round(lossHi / slow))];
    const pct = (Math.abs(effNet) * 7 / EM.densityLoss) / 179 * 100;
    if (pct > 0.85) warnings.push(['amber', `About ${pct.toFixed(1)}% of body weight a week is faster than the 0.4–0.7% that best protects lean mass.`]);
  }
  if (intake > m && added > 0) warnings.push(['amber', `You’d eat above your maintenance and rely on +${fmt(added)} kcal of extra activity every day for the whole deficit. If activity falls short, so does the deficit.`]);
  else if (added > 300) warnings.push(['amber', `+${fmt(added)} kcal a day is a big jump from your usual ${fmt(EM.usual)}. Make sure it’s sustainable.`]);
  if (added > 0 && added <= 300 && !clamped) warnings.push(['info', `Added activity counts 1:1. If your Watch reads high or low, your weigh-in trend shows it and we recalibrate.`]);
  return { intake, added, net: Math.round(effNet), netLo: Math.round(netLo), netHi: Math.round(netHi), rLo, rHi, weeks, warnings, clamped, floor, activityGoal: EM.usual + added };
}

const PRESETS = {
  suggested: { label: 'Suggested', net: -450, added: 100 },
  balanced: { label: 'Balanced', net: -450, added: 225 },
  intake: { label: 'Intake-focused', net: -450, added: 0 },
  activity: { label: 'Activity-focused', net: -450, added: 350 },
};

function rateText(c) {
  const a = Math.abs(c.rLo), b = Math.abs(c.rHi);
  const lo = Math.min(a, b), hi = Math.max(a, b);
  if (c.net > -60 && c.net < 60) return 'About steady weight';
  if (c.net > 0) return `≈ ${(lo * 4.33).toFixed(1)}–${(hi * 4.33).toFixed(1)} lb/month gain`;
  return `≈ ${lo.toFixed(1)}–${hi.toFixed(1)} lb/week loss`;
}

const presetOf = (root, key) => (key === 'suggested' ? { net: Number(root.dataset.sugNet ?? -450), added: Number(root.dataset.sugAdded ?? 100) } : PRESETS[key]);

function energyRefresh(root) {
  const net = Number(root.querySelector('[data-in="net"]')?.value ?? root.dataset.net ?? -450);
  const added = Number(root.querySelector('[data-in="added"]')?.value ?? root.dataset.added ?? 100);
  const c = energyCalc(net, added);
  const set = (k, v) => root.querySelectorAll(`[data-e="${k}"]`).forEach((el) => { el.innerHTML = v; });
  set('net', c.clamped ? `${sgn(c.net)} kcal/day <span style="font-size:.6em;color:var(--red)">limited</span>` : `${sgn(net)} kcal/day`);
  set('netShort', sgn(c.clamped ? c.net : net));
  set('netrange', `${sgn(c.netLo)} to ${sgn(c.netHi)}`);
  set('rate', rateText({ ...c, net }));
  set('weeks', c.weeks ? `${c.weeks[0]}–${c.weeks[1]} weeks` : net > 60 ? 'Building continues' : 'No fixed length');
  set('intake', fmt(c.intake));
  set('intakeDelta', `${sgn(c.intake - EM.plan.intake)} vs today’s plan`);
  set('added', `+${fmt(added)}`);
  set('activityGoal', fmt(c.activityGoal));
  set('weekIntake', fmt(c.intake * 7));
  set('weekAdded', fmt(added * 7));
  set('weekNet', sgn((c.clamped ? c.net : net) * 7));
  set('formula', `${fmt(EM.maintenance)} ${net < 0 ? '−' : '+'} ${fmt(Math.abs(c.clamped ? c.net : net))} + ${fmt(added)} = <b>${fmt(c.intake)}</b>`);
  set('steps', added ? `≈ ${fmt(Math.round(added * 22 / 100) * 100)} extra steps a day, or ${Math.max(1, Math.round(added * 7 / 233))} brisk 45-min walks a week` : 'No added activity');
  const zone = net < -650 ? 'Aggressive' : net < -250 ? 'Moderate deficit' : net < -60 ? 'Gentle deficit' : net <= 60 ? 'Maintenance' : net <= 250 ? 'Lean surplus' : 'Surplus';
  set('zone', zone);
  root.querySelectorAll('[data-e="zone"]').forEach((el) => { el.className = `pill ${net < -650 ? 'red' : net < -60 ? 'amber' : net <= 60 ? 'line' : 'teal'}`; });
  const sync = (sel, v) => { const el = root.querySelector(sel); if (el && document.activeElement !== el) el.value = v; };
  sync('[data-in="intake"]', c.intake);
  sync('[data-in="intakeNum"]', c.intake);
  sync('[data-in="addedNum"]', added);
  const w = root.querySelector('[data-e="warnings"]');
  if (w) w.innerHTML = c.warnings.map(([tone, t]) => `<div class="ewarn ${tone}">${tone === 'info' ? I.info : I.warn}<span>${t}</span></div>`).join('');
  root.querySelectorAll('[data-preset]').forEach((b) => { const p = presetOf(root, b.dataset.preset); b.classList.toggle('on', p.net === net && p.added === added); b.setAttribute('aria-checked', String(p.net === net && p.added === added)); });
  const fill = root.querySelector('[data-e="netfill"]');
  if (fill) { const pct = ((net + 750) / 1250) * 100; fill.style.left = `${Math.min(pct, 60)}%`; fill.style.width = `${Math.abs(pct - 60)}%`; }
}
// dragging or typing intake keeps the selected balance: added activity moves 1:1
function setIntake(root, wantIntake) {
  const net = Number(root.querySelector('[data-in="net"]')?.value ?? root.dataset.net);
  const added = Math.max(0, Math.min(EM.maxAdded, Math.round(wantIntake - EM.maintenance - net)));
  const a = root.querySelector('[data-in="added"]'); if (a) a.value = added;
}
document.addEventListener('input', (ev) => {
  const root = ev.target.closest('[data-energy]');
  if (!root) return;
  const k = ev.target.dataset.in;
  if (k === 'intake') setIntake(root, Number(ev.target.value));
  if (k === 'intakeNum' && ev.target.value !== '') setIntake(root, Number(ev.target.value));
  if (k === 'addedNum' && ev.target.value !== '') { const a = root.querySelector('[data-in="added"]'); if (a) a.value = Math.max(0, Math.min(EM.maxAdded, Math.round(Number(ev.target.value)))); }
  energyRefresh(root);
});
document.addEventListener('change', (ev) => {
  const root = ev.target.closest('[data-energy]');
  if (root && /Num$/.test(ev.target.dataset.in || '')) { ev.target.blur?.(); energyRefresh(root); }
});
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-preset],[data-step]');
  if (!b) return;
  const root = b.closest('[data-energy]');
  if (!root) return;
  const netEl = root.querySelector('[data-in="net"]'), addEl = root.querySelector('[data-in="added"]');
  if (b.dataset.preset) { const p = presetOf(root, b.dataset.preset); if (netEl) netEl.value = p.net; if (addEl) addEl.value = p.added; }
  if (b.dataset.step) {
    const [k, d] = b.dataset.step.split(':');
    const el = root.querySelector(`[data-in="${k}"]`);
    if (el) el.value = Math.max(Number(el.min || -Infinity), Math.min(Number(el.max || Infinity), Number(el.value) + Number(d)));
  }
  energyRefresh(root);
});

// Quick Calibration model (interactive "Choose another amount" sheet).
// Primary Founder scenario (illustrative): leaning phase since Oct 9 at
// 1,767 kcal eaten + 100 added activity (Watch goal 900), target −450/day.
// After 4 weeks with logging and activity on plan, weight trend ≈ −0.2 lb/week
// instead of the expected 0.7–1.3. Outcome-based recalibration moves estimated
// maintenance 2,117 → ≈ 1,967 (1,860–2,060), so −150 restores −450/day.
// Step bounds (±300) and the floor are PROVISIONAL design proposals.
// ---------------------------------------------------------------------------
const QC = {
  current: 1767, added: 100, usual: 800, recommended: -150,
  maintenance: 1967, targetNet: -450, maxStep: 300, observeWeeks: 3,
};
const qcFloor = () => Math.ceil((QC.maintenance * (1 - 0.25)) / 25) * 25; // 25% below recalibrated maintenance, rounded up

function qcRefresh(root) {
  const input = root.querySelector('[data-q="delta"]');
  const num = root.querySelector('[data-q="deltaNum"]');
  let delta = Number(input?.value ?? QC.recommended);
  const intake = QC.current + delta;
  const net = intake - QC.maintenance - QC.added;
  const set = (k, v) => root.querySelectorAll(`[data-qe="${k}"]`).forEach((el) => { el.innerHTML = v; });
  set('delta', delta === 0 ? 'No change' : `${sgn(delta)} kcal/day`);
  set('intake', fmt(intake));
  set('week', fmt(intake * 7));
  set('weekDelta', sgn(delta * 7));
  set('net', sgn(net));
  if (num && document.activeElement !== num) num.value = intake;
  const msgs = [];
  let ok = true, label = `Apply ${fmt(intake)} kcal`;
  if (delta === 0) { label = 'Keep current plan'; msgs.push(['info', 'No change. Your plan stays at 1,767 and we keep observing.']); }
  if (Math.abs(delta) > QC.maxStep) { ok = false; label = 'Open full plan review'; msgs.push(['amber', `Changes over ${QC.maxStep} kcal at once need a full plan review, so the rest of your plan can be checked too.`]); }
  if (intake < qcFloor()) { ok = false; label = 'Below the floor'; msgs.push(['red', `Eating can’t go below ${fmt(qcFloor())} kcal (provisional floor, 25% under your updated maintenance).`]); }
  if (delta > 0) msgs.push(['amber', 'This moves you away from your −450 target. You can still choose it.']);
  if (delta === QC.recommended) msgs.unshift(['ok', 'Recommended amount. Restores your −450 target with the updated maintenance estimate.']);
  const w = root.querySelector('[data-qe="msgs"]');
  if (w) w.innerHTML = msgs.map(([t, m]) => `<div class="ewarn ${t}">${t === 'ok' ? I.check : t === 'info' ? I.info : I.warn}<span>${m}</span></div>`).join('');
  const btn = root.querySelector('[data-qe="apply"]');
  if (btn) { btn.textContent = label; btn.className = `btn ${ok ? 'primary' : Math.abs(delta) > QC.maxStep && intake >= qcFloor() ? 'secondary' : 'disabled'}`; btn.setAttribute('aria-disabled', String(!ok && !(Math.abs(delta) > QC.maxStep && intake >= qcFloor()))); }
}
document.addEventListener('input', (ev) => {
  const root = ev.target.closest('[data-qc]');
  if (!root) return;
  if (ev.target.dataset.q === 'deltaNum' && ev.target.value !== '') { const d = root.querySelector('[data-q="delta"]'); if (d) d.value = Math.round(Number(ev.target.value)) - QC.current; }
  qcRefresh(root);
});
document.addEventListener('change', (ev) => { const root = ev.target.closest('[data-qc]'); if (root) { ev.target.blur?.(); qcRefresh(root); } });
document.addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-qstep],[data-qset]');

  if (b.dataset.qset) d.value = Number(b.dataset.qset);
  qcRefresh(root);
});

  ];
  const carried = [
    ['food', '', 'Nutrition', 'Protein 1.0 g/lb · balanced carbs and fat' + IL, opts.conflict ? 'amber' : ''],
    ...(opts.more ? [] : [['walk', '', 'Activity', 'Usual ≈ 800 kcal/day from Apple Watch']]),
    ...(opts.more ? [] : [['lift', '', 'Training', '9 sessions/week · Chest, Back · Moderate']]),
    ['moon', '', 'Recovery', 'Foam Rolling · daily 7:15 PM'],
    ['drop', '', 'Peptides', '2 protocols · unchanged'],

    ['cam', '', 'Coaching updates', 'Weekly Sun · Photos every 2 weeks'],
    ['scale', '', 'Tracking & reminders', 'Morning weigh-in · 4 reminders'],
  ];
  return { changing, carried };
};

};

  'QC3-choose-amount': { short: 'Choose amount', title: 'Choose another amount (interactive)', desc: 'Compact slider, ±25 steps, quick chips and an editable intake field. Shows weekly intake, expected balance against the updated maintenance, and what stays unchanged. Recommended amount restores −450.', tags: ['NEW', 'Interactive', 'Editable numbers'] },
  'QC4-choose-invalid': { short: 'Out of bounds', title: 'Choose amount: floor and step limit (interactive)', desc: 'Starts at −350: below the provisional floor (1,500 for updated maintenance) and over the ±300 quick-step limit, so Apply is replaced; larger changes route to the full plan review.', tags: ['NEW', 'Validation', 'Interactive'] },

  'QC8-escalate': { short: 'Escalate', title: 'Escalation to the full plan review', desc: 'When the phase limit, goal date or guardrail is affected, or more than one material component must change, Quick Calibration hands off to Your Plan (hub) with the changes pre-filled.', tags: ['NEW', 'Escalation'] },

    <div class="pair">
      <div class="shot phone-dark-wrap" tabindex="0" role="button" aria-label="Enlarge ${id} in Dark" data-open="${id}" data-theme="dark"><p class="cap">Dark</p><div class="frame">${phoneHtml(id, 'dark')}</div></div>
      <div class="shot phone-light-wrap" tabindex="0" role="button" aria-label="Enlarge ${id} in Mineral Light" data-open="${id}" data-theme="light"><p class="cap">Mineral Light</p><div class="frame">${phoneHtml(id, 'light')}</div></div>
    </div></div>`;
}
function flowHtml(flow) {
  if (!flow) return '';
  return `<div class="flowline">${flow.map((step, i) => (step === '→' || step === '·' ? `<span class="a">${step === '·' ? '|' : '→'}</span>` : step.startsWith('#') ? `<a class="n" href="#p-${step.slice(1)}"><b>${step.slice(1).split('-')[0]}</b>${SCREENS[step.slice(1)]?.short ?? ''}</a>` : `<span class="n">${step}</span>`)).join('')}</div>`;
}
function render() {
  const nav = [];
  const body = [];
  body.push(boardIntro());
  for (const group of SECTIONS) {
    nav.push(`<h4>${group.group}</h4>`);
    for (const sec of group.items) {
      const count = sec.screens ? sec.screens.length : '';
      const badge = sec.badge ? ` <span class="tag ${sec.badge === 'NEW' ? 'newb' : 'upd'}">${sec.badge}</span>` : '';
      nav.push(`<a class="navlink" href="#${sec.key}" data-nav="${sec.key}"><span>${sec.title}${badge}</span><small>${count}</small></a>`);
      const inner = sec.render ? sec.render() : `${flowHtml(sec.flow)}<div class="grid">${sec.screens.map((id) => shotHtml(id)).join('')}</div>`;
      body.push(`<section class="sec" id="${sec.key}" data-sec><h2>${sec.title}${badge}</h2>${sec.note ? `<p class="note">${sec.note}</p>` : ''}${inner}</section>`);
    }
  }
  document.getElementById('side').innerHTML = nav.join('');
  document.getElementById('main').innerHTML = body.join('');
  document.querySelectorAll('[data-energy]').forEach(energyRefresh);
  document.querySelectorAll('[data-qc]').forEach(qcRefresh);
}

// theme filter
function setShow(mode) {
  document.body.dataset.show = mode;
  document.querySelectorAll('[data-show-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.showBtn === mode)));
  try { localStorage.setItem('opd-show', mode); } catch (e) { /* storage unavailable */ }
}
function setBoardTheme(mode) {
  if (mode === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = mode;
  document.querySelectorAll('[data-board-btn]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.boardBtn === mode)));
}
// search
function applySearch(q) {
  q = q.trim().toLowerCase();
  document.querySelectorAll('.item[data-search]').forEach((el) => el.classList.toggle('hide', !!q && !el.dataset.search.includes(q)));
  document.querySelectorAll('[data-sec]').forEach((sec) => {
    const items = sec.querySelectorAll('.item[data-search]');
    if (!items.length) { sec.classList.toggle('hide', !!q); return; }
    sec.classList.toggle('hide', !!q && [...items].every((p) => p.classList.contains('hide')));
  });
}
// lightbox
let lbList = [], lbPos = 0, lbTheme = 'dark';
function openLb(id, theme) {
  lbList = [...document.querySelectorAll('.item[data-id]')].filter((p) => !p.classList.contains('hide')).map((p) => p.dataset.id);
  lbPos = Math.max(0, lbList.indexOf(id));
  lbTheme = theme;
  drawLb();
  document.getElementById('lb').classList.add('open');
  document.getElementById('lb-close').focus();
}
function drawLb() {
  const id = lbList[lbPos];
  const sc = SCREENS[id];
  document.getElementById('lb-stage').innerHTML = phoneHtml(id, lbTheme);
  document.getElementById('lb-info').innerHTML = `<div class="kick">${id} · ${lbTheme === 'light' ? 'Mineral Light' : 'Dark'} · ${lbPos + 1} / ${lbList.length}</div><h3>${sc.title}</h3><p>${sc.desc}</p><div class="tags">${(sc.tags || []).map(tagHtml).join('')}</div>${sc.notes ? `<p style="margin-top:12px">${sc.notes}</p>` : ''}`;
  const st = document.getElementById('lb-stage').querySelector('[data-energy]');
  if (st) energyRefresh(st);
  const qs = document.getElementById('lb-stage').querySelector('[data-qc]');
  if (qs) qcRefresh(qs);
}
function closeLb() { document.getElementById('lb').classList.remove('open'); }
document.addEventListener('click', (ev) => {
  if (ev.target.closest('input, label, button, [data-preset], [data-step], [data-qstep], [data-qset]')) return;
  const open = ev.target.closest('[data-open]');
  if (open) { openLb(open.dataset.open, open.dataset.theme); return; }
  if (ev.target.id === 'lb') closeLb();
});
document.addEventListener('keydown', (ev) => {
  const lb = document.getElementById('lb');
  if (lb.classList.contains('open')) {
    if (ev.key === 'Escape') closeLb();
    if (ev.key === 'ArrowRight') { lbPos = (lbPos + 1) % lbList.length; drawLb(); }
    if (ev.key === 'ArrowLeft') { lbPos = (lbPos - 1 + lbList.length) % lbList.length; drawLb(); }
    if (ev.key.toLowerCase() === 't') { lbTheme = lbTheme === 'dark' ? 'light' : 'dark'; drawLb(); }
    return;
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.closest?.('[data-open]')) { ev.preventDefault(); const o = ev.target.closest('[data-open]'); openLb(o.dataset.open, o.dataset.theme); }
});
// active section highlight
const io = new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) document.querySelectorAll('.navlink').forEach((a) => a.classList.toggle('on', a.dataset.nav === e.target.id)); });
}, { rootMargin: '-30% 0px -60% 0px' });

document.addEventListener('DOMContentLoaded', () => {
  render();
  document.querySelectorAll('[data-sec]').forEach((s) => io.observe(s));
  let saved = 'both';
  try { saved = localStorage.getItem('opd-show') || 'both'; } catch (e) { /* storage unavailable */ }
  setShow(saved);
  document.querySelectorAll('[data-show-btn]').forEach((b) => b.addEventListener('click', () => setShow(b.dataset.showBtn)));
  document.querySelectorAll('[data-board-btn]').forEach((b) => b.addEventListener('click', () => setBoardTheme(b.dataset.boardBtn)));
  document.getElementById('q').addEventListener('input', (e) => applySearch(e.target.value));
  document.getElementById('lb-close').addEventListener('click', closeLb);
  document.getElementById('lb-prev').addEventListener('click', () => { lbPos = (lbPos - 1 + lbList.length) % lbList.length; drawLb(); });
  document.getElementById('lb-next').addEventListener('click', () => { lbPos = (lbPos + 1) % lbList.length; drawLb(); });
  document.getElementById('lb-theme').addEventListener('click', () => { lbTheme = lbTheme === 'dark' ? 'light' : 'dark'; drawLb(); });
});

</script>
