<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS DEXA + Photo confirmation</title><style>
@font-face{font-family:Physique;src:url('fonts/PlusJakartaSans.ttf')}*{box-sizing:border-box}html,body{margin:0;background:#050910;color:#eef4f5;font-family:Physique,system-ui,sans-serif}body{padding:24px}.stage{display:flex;justify-content:center;align-items:flex-start;gap:28px}.phone{width:402px;overflow:hidden;border-radius:52px;background:var(--bg);color:var(--text);box-shadow:0 28px 80px rgba(0,0,0,.42);--bg:#06131c;--surface:#0d1d29;--surface2:#112432;--text:#f2f6f6;--muted:#91a4ad;--rule:#203341;--teal:#35c8c1;--green:#4bdc95;--purple:#a68af8;--amber:#f5bd4f;--cyan:#38c4dd;--viewer:#02070c}.phone.light{--bg:#edf0e9;--surface:#f8f8f3;--surface2:#dce9e5;--text:#102638;--muted:#60727b;--rule:#c9d2cf;--teal:#078f88;--green:#138f63;--purple:#7356d9;--amber:#a86c0a;--cyan:#147f98;--viewer:#e3e9e5}.status{height:54px;display:flex;align-items:center;justify-content:space-between;padding:17px 24px 0;font-size:12px;font-weight:800}.island{width:122px;height:33px;border-radius:19px;background:#02070c}.status-icons{font-size:10px;letter-spacing:1px}.content{padding:0 15px 42px}.nav{height:51px;display:flex;align-items:center;gap:8px}.nav-chip{font-size:10px;font-weight:750;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.055)}.light .nav-chip{background:rgba(16,38,56,.06)}.eyebrow,.section-label,.metric-label{font-size:10px;letter-spacing:.11em;text-transform:uppercase;font-weight:850}.eyebrow{color:#d6c9ff}.light .eyebrow{color:#6b4fd0}.hero{position:relative;margin:0 -15px;padding:28px 22px 30px;overflow:hidden;isolation:isolate;background:linear-gradient(150deg,#0a8c80,#0b5366 58%,#172d5a);color:#f5faf9}.light .hero{background:linear-gradient(150deg,#d6eeea,#c4e1df 58%,#d7dfef);color:#102638}.hero:after{content:"";position:absolute;width:330px;height:330px;border:54px solid rgba(76,226,159,.18);border-radius:50%;right:-175px;bottom:-145px;z-index:-1}.hero-top,.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hero-date{font-size:11px;color:rgba(245,250,249,.7)}.light .hero-date{color:#4f6670}.hero h1{font-size:31px;line-height:1.05;letter-spacing:-.03em;margin:18px 0 10px}.hero p{font-size:13px;line-height:1.5;color:#d8e6e6;margin:0}.light .hero p{color:#3f5c63}.section{padding:28px 8px 8px;border-bottom:1px solid var(--rule)}.section:last-child{border:0}.section-title{font-size:24px;line-height:1.08;letter-spacing:-.025em;margin:12px 0 8px}.body-copy{font-size:12px;line-height:1.52;color:var(--muted);margin:0}.fact-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);margin:17px -8px 0}.fact{padding:13px 7px;background:var(--bg);text-align:center}.fact span{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.fact b{display:block;font-size:11px;margin-top:5px}.conditions{font-size:11px;line-height:1.45;color:var(--muted);padding:13px 0;border-bottom:1px solid var(--rule)}
.pose-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.pose-card{min-width:0}.pose-card .filler{aspect-ratio:3/4}.pose-name{font-size:9px;line-height:1.3;margin-top:5px;font-weight:800}.pose-date{font-size:8px;color:var(--muted);margin-top:2px}.filler{position:relative;overflow:hidden;background:linear-gradient(145deg,#203b49,#54707a 58%,#9d9a86);border-radius:12px;isolation:isolate}.filler.previous{background:linear-gradient(145deg,#26333c,#5b686e 58%,#918b78)}.light .filler{background:linear-gradient(145deg,#b7cbc7,#8ba9aa 58%,#d3c8ae)}.filler:before{content:"PROTOTYPE FILLER";position:absolute;left:5px;bottom:5px;z-index:5;font-size:6px;letter-spacing:.06em;color:#fff;background:rgba(3,11,16,.55);padding:3px 4px;border-radius:4px}.expand{position:absolute;right:6px;top:6px;z-index:5;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:rgba(3,11,16,.58);color:#fff;font-size:11px}.person{position:absolute;inset:10% 13% 3%;transform-origin:center}.head{position:absolute;width:28%;aspect-ratio:1;border-radius:50%;left:36%;top:0;background:#c6b4a1}.torso{position:absolute;width:48%;height:53%;left:26%;top:20%;background:#bba792;border-radius:38% 38% 25% 25%;clip-path:polygon(15% 0,85% 0,100% 70%,73% 100%,27% 100%,0 70%)}.arm{position:absolute;width:13%;height:52%;top:23%;background:#bba792;border-radius:999px;transform-origin:50% 10%}.arm.left{left:15%;transform:rotate(7deg)}.arm.right{right:15%;transform:rotate(-7deg)}.legs{position:absolute;width:42%;height:30%;left:29%;bottom:0;background:linear-gradient(90deg,#758598 0 47%,transparent 47% 53%,#758598 53%);clip-path:polygon(0 0,100% 0,88% 100%,58% 100%,50% 25%,42% 100%,12% 100%)}.pose-back .torso{background:#ad9987}.pose-back .head{background:#8f7967}.pose-flex .arm.left{left:6%;top:14%;transform:rotate(-48deg)}.pose-flex .arm.right{right:6%;top:14%;transform:rotate(48deg)}.pose-flex .torso{width:56%;left:22%}.pose-side{transform:scaleX(.72)}.pose-side .arm.left{left:25%}.pose-side .arm.right{right:25%}.pose-front-flex .arm.left{left:7%;top:16%;transform:rotate(-38deg)}.pose-front-flex .arm.right{right:7%;top:16%;transform:rotate(38deg)}
.comparison{padding:20px 0;border-top:1px solid var(--rule)}.comparison:first-of-type{border-top:0}.comparison-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-end}.comparison h3{font-size:16px;margin:0}.comparison-range{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.photo-frame .filler{aspect-ratio:3/4;border-radius:14px}.photo-caption{display:flex;justify-content:space-between;margin-top:6px;font-size:9px}.photo-caption b{text-transform:uppercase;letter-spacing:.06em}.photo-caption span{color:var(--muted)}.comparison p{font-size:11px;line-height:1.48;color:var(--muted);margin:10px 0 0}.interpretation p{font-size:12px;line-height:1.52;color:var(--muted);padding:12px 0;margin:0;border-top:1px solid var(--rule)}.coach{margin:24px -7px 0;padding:22px 18px;border:0;border-radius:18px;background:linear-gradient(135deg,#0e3141,#1c315c);color:#f5f7f8}.light .coach{background:linear-gradient(135deg,#133c49,#2a3665)}.coach .section-label{color:#cbbcff}.coach p{font-size:14px;line-height:1.55;margin:12px 0 0}.milestone{display:flex;justify-content:space-between;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:10px}.milestone b{font-size:11px;text-align:right}
.dexa-focus{padding-bottom:24px}.dexa-head{padding:22px 8px 14px}.dexa-head h1{font-size:26px;line-height:1.08;margin:10px 0 0}.table-field{padding:16px;background:var(--surface);border-radius:18px;margin-top:14px}.light .table-field{background:linear-gradient(135deg,#d9e9e5,#e3e0ed)}.table-field h2{font-size:16px;margin:0}.unit-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:10px}.unit-table th{text-align:left;padding:7px 0;color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.07em}.unit-table th:not(:first-child),.unit-table td:not(:first-child){text-align:right}.unit-table td{padding:10px 0;border-top:1px solid var(--rule)}.unit-table td:last-child{color:var(--green);font-weight:800}.phase-panel{margin-top:18px;padding:18px;background:linear-gradient(135deg,rgba(53,200,193,.13),rgba(166,138,248,.12));border-left:3px solid var(--teal)}.phase-context{display:flex;justify-content:space-between;gap:8px;margin:10px 0 15px}.phase-context b{display:block;font-size:12px}.phase-context span{font-size:9px;color:var(--muted)}.phase-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);margin:0 0 10px}.phase-meta>div{padding:10px;background:var(--bg)}.phase-meta span{font-size:8px;text-transform:uppercase;color:var(--muted)}.phase-meta b{display:block;font-size:12px;margin-top:4px}.phase-metric{padding:13px 0;border-top:1px solid var(--rule)}.phase-metric-top{display:flex;justify-content:space-between;gap:8px}.phase-metric strong{font-size:12px}.phase-metric em{font-style:normal;color:var(--green);font-size:11px;font-weight:800}.phase-values{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}.phase-values div{padding:10px;background:var(--surface);border-radius:10px}.light .phase-values div{background:rgba(255,255,255,.5)}.phase-values span{display:block;font-size:8px;text-transform:uppercase;color:var(--muted)}.phase-values b{display:block;font-size:17px;margin-top:4px}.phase-values i{font-style:normal;color:var(--muted)}.phase-summary{font-size:11px;line-height:1.48;color:var(--muted);margin:14px 0 0}
.viewer{min-height:844px;background:var(--viewer);position:relative;color:#fff;padding:0 14px 20px}.light.viewer{color:#102638}.viewer .status{padding-left:10px;padding-right:10px}.viewer-top{display:grid;grid-template-columns:44px 1fr 44px;align-items:start;gap:8px;padding:10px 0}.close{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:inherit;font-size:17px}.light .close{background:rgba(16,38,56,.1)}.viewer-title{text-align:center}.viewer-title strong{display:block;font-size:14px}.viewer-title span{font-size:10px;color:#99a8ae}.viewer-image{height:650px;overflow:hidden;display:grid;place-items:center}.viewer-image .filler{width:100%;height:100%;border-radius:0}.viewer-image .person{inset:4% 9% 1%}.viewer-footer{display:flex;justify-content:space-between;align-items:center;font-size:10px;color:#9aa9b0;padding-top:12px}.viewer-footer b{color:var(--teal)}.pair-viewer{min-height:844px;background:var(--viewer);position:relative;color:#fff;padding:0 10px 18px}.light.pair-viewer{color:#102638}.pair-viewer .status{padding-left:14px;padding-right:14px}.pair-viewer .viewer-top{padding:8px 4px}.large-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;height:660px;overflow:hidden;transform-origin:center}.large-pair.zoomed{transform:scale(1.72) translate(-3%,7%)}.large-pane{min-width:0;overflow:hidden;background:#0a141b;position:relative}.light .large-pane{background:#d2ddd8}.large-pane .filler{height:100%;border-radius:0}.large-pane .person{inset:5% 5% 0}.pane-label{position:absolute;left:8px;top:8px;z-index:8;background:rgba(3,11,16,.7);color:#fff;padding:7px 8px;border-radius:8px;font-size:9px}.pair-footer{display:flex;justify-content:space-between;align-items:center;padding:11px 4px 0;color:#9aa9b0;font-size:10px}.pair-footer b{color:var(--teal)}
.before-after{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;padding:18px;background:#070b11;color:#eef4f5;max-width:900px}.before-after h2{font-size:16px;margin:0 0 10px}.old-timeline,.restored{padding:16px;background:#101923}.old-line{display:flex;align-items:center;gap:7px;margin:20px 0}.old-line i{width:8px;height:8px;border-radius:50%;background:#43d9a0}.old-line span{height:3px;flex:1;background:#27424b}.old-timeline p,.restored p{font-size:11px;line-height:1.45;color:#9aabb2}.restored .phase-metric{font-size:10px}@media(max-width:900px){body{padding:10px}.stage{flex-direction:column;align-items:center}.phone{width:min(402px,100%)}.before-after{grid-template-columns:1fr}}
</style></head><body><div class="stage" id="stage"></div><script src="source/authority.js"></script><script>
const A=window.CONFIRMATION_AUTHORITY;const d=A.dexa.dexa;const p=A.photo;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const short=v=>{const [y,m,day]=String(v).slice(0,10).split('-').map(Number);return new Date(y,m-1,day).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
function chrome(theme,body,extra=''){return `<article class="phone ${theme} ${extra}"><div class="status"><span>1:05</span><span class="island"></span><span class="status-icons">▮▮▮⌁</span></div>${extra?'':`<main class="content"><nav class="nav"><span class="nav-chip">‹ Home</span><span class="nav-chip">▦ Briefing History</span></nav>${body}</main>`}${extra?body:''}</article>`}
function poseClass(id){if(id==='back-relaxed')return'pose-back';if(id==='back-flexed')return'pose-back pose-flex';if(id.includes('side'))return'pose-side';if(id==='front-flexed')return'pose-front-flex';return'pose-front'}
function filler(view,variant='current',large=false){const id=view.poseId||view;return `<div class="filler ${variant} ${large?'large':''}" role="img" aria-label="Prototype filler image for ${esc(view.label||id)}"><span class="expand">↗</span><div class="person ${poseClass(id)}"><i class="head"></i><i class="torso"></i><i class="arm left"></i><i class="arm right"></i><i class="legs"></i></div></div>`}
function photo(theme){const views=p.activeViews;const comps=p.cardContent.progress.comparisons;return chrome(theme,`<section class="hero" data-section="photo-hero"><div class="hero-top"><span class="eyebrow">Photo Event</span><span class="hero-date">${short(p.eventDate)}</span></div><h1>${esc(p.cardContent.hero.title)}</h1><p>${esc(p.cardContent.hero.body)}</p></section><section class="section" data-section="photo-session"><div class="section-head"><span class="section-label">${esc(p.cardContent.snapshot.title)}</span><span class="metric-label">${esc(p.completion)}</span></div><div class="fact-grid"><div class="fact"><span>Date</span><b>${short(p.eventDate)}</b></div><div class="fact"><span>Set</span><b>${esc(p.completion)}</b></div><div class="fact"><span>Weight</span><b>${esc(p.supportingEvidence.weight)}</b></div></div><p class="conditions">${esc(p.cardContent.snapshot.poses.join(' · '))}<br>${esc(p.cardContent.snapshot.conditions)}</p><div class="pose-grid">${views.map(v=>`<div class="pose-card">${filler(v)}<div class="pose-name">${esc(v.label)}</div><div class="pose-date">${short(p.eventDate)}</div></div>`).join('')}</div></section><section class="section" data-section="photo-visible-change"><span class="section-label">${esc(p.cardContent.progress.title)}</span><h2 class="section-title">${esc(p.cardContent.progress.body)}</h2>${comps.map((c,i)=>`<article class="comparison" data-comparison-index="${i}" data-pose="${esc(c.poseId)}"><div class="comparison-top"><h3>${esc(c.label)}</h3><span class="comparison-range">${short(c.previousDate)} → ${short(p.eventDate)}</span></div><div class="pair"><div class="photo-frame">${filler(c,'previous')}<div class="photo-caption"><b>Previous</b><span>${short(c.previousDate)}</span></div></div><div class="photo-frame">${filler(c,'current')}<div class="photo-caption"><b>Current</b><span>${short(p.eventDate)}</span></div></div></div><p>${esc(c.headline)}</p></article>`).join('')}</section><section class="section interpretation" data-section="photo-meaning"><span class="section-label">${esc(p.cardContent.interpretation.title)}</span>${p.cardContent.interpretation.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('')}</section><section class="section coach" data-section="photo-coach"><span class="section-label">${esc(p.cardContent.coachInsight.title)}</span><p>${esc(p.cardContent.coachInsight.body)}</p><div class="milestone"><span>Next milestone</span><b>${esc(p.nextMilestone.label)}</b></div></section>`)}
function unitTable(title,rows){return `<div class="table-field"><h2>${esc(title)}</h2><table class="unit-table"><thead><tr><th>Metric</th><th>Previous</th><th>Current</th><th>Delta</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.region||r.label)}</td><td>${esc(r.previous)}</td><td>${esc(r.current)}</td><td>${esc(r.delta)}</td></tr>`).join('')}</tbody></table></div>`}
function phasePanel(){const t=d.progress.timeline;return `<section class="phase-panel" data-section="dexa-phase-breakdown"><span class="section-label">${esc(t.timelineLabel)}</span><div class="phase-context"><div><span>Goal</span><b>${esc(A.dexa.attribution.goalTitle)}</b></div><div><span>Active phase</span><b>${esc(A.dexa.attribution.phaseName)}</b></div></div><div class="phase-meta"><div><span>Start</span><b>${short(t.baselineDate)}</b></div><div><span>Current scan</span><b>${short(t.currentDate)}</b></div><div><span>Elapsed</span><b>${t.elapsedDays} days</b></div><div><span>Body-composition scans</span><b>${t.scans.length}</b></div></div>${t.metrics.map(m=>`<div class="phase-metric"><div class="phase-metric-top"><strong>${esc(m.label)}</strong><em>${esc(m.delta)}</em></div><div class="phase-values"><div><span>Start</span><b>${esc(m.points[0].value)}${m.unit==='%'?'%':m.unit?` ${esc(m.unit)}`:''}</b></div><i>→</i><div><span>Current</span><b>${esc(m.points.at(-1).value)}${m.unit==='%'?'%':m.unit?` ${esc(m.unit)}`:''}</b></div></div></div>`).join('')}<p class="phase-summary">${esc(t.summary)}</p></section>`}
function dexa(theme,mode='all'){const tables=`${unitTable('Since Last Scan',d.progress.headline)}${unitTable('Regional Fat Change',d.progress.regionalFat)}${unitTable('Measured Lean Tissue Change',d.progress.regionalLean)}${unitTable('Other Notable Changes',d.progress.supplemental)}`;const body=`<div class="dexa-focus"><div class="dexa-head"><span class="eyebrow">DEXA correction confirmation</span><h1>${mode==='phase'?'Since starting Lean Mass Build':'Field-specific units restored'}</h1></div>${mode==='units'?tables:mode==='phase'?phasePanel():tables+phasePanel()}</div>`;return chrome(theme,body)}
function singleViewer(theme){const v=p.activeViews[0];return chrome(theme,`<div class="viewer-top"><button class="close" aria-label="Close photo">×</button><div class="viewer-title"><strong>${esc(v.label)}</strong><span>${short(p.eventDate)} · 1 of ${p.activeViews.length}</span></div><span></span></div><div class="viewer-image">${filler(v,'current',true)}</div><div class="viewer-footer"><span>Pinch to zoom · Pan when zoomed</span><b>1×</b></div>`,'viewer')}
function pairViewer(theme,zoomed=false){const c=p.cardContent.progress.comparisons[0];return chrome(theme,`<div class="viewer-top"><button class="close" aria-label="Close comparison">×</button><div class="viewer-title"><strong>${esc(c.label)}</strong><span>${short(c.previousDate)} → ${short(p.eventDate)}</span></div><span></span></div><div class="large-pair ${zoomed?'zoomed':''}"><div class="large-pane">${filler(c,'previous',true)}<span class="pane-label">Previous · ${short(c.previousDate)}</span></div><div class="large-pane">${filler(c,'current',true)}<span class="pane-label">Current · ${short(p.eventDate)}</span></div></div><div class="pair-footer"><span>${zoomed?'Pan both images together':'Pinch to zoom · synchronized pan'}</span><b>${zoomed?'2.4× · Reset':'1×'}</b></div>`,'pair-viewer')}
function beforeAfter(){const t=d.progress.timeline;return `<div class="before-after"><section class="old-timeline"><h2>Rejected reduction</h2><span class="metric-label">${esc(t.timelineLabel)}</span><div class="old-line"><b>${short(t.baselineDate)}</b><i></i><span></span><i></i><b>${short(t.currentDate)}</b></div><p>${t.elapsedDays} days · ${t.scans.length} scans</p><p>${esc(t.summary)}</p></section><section class="restored"><h2>Restored production breakdown</h2>${phasePanel()}</section></div>`}
const q=new URLSearchParams(location.search),surface=q.get('surface')||'photo',theme=q.get('theme')||'dark';const out=surface==='photo'?photo(theme):surface==='dexa-units'?dexa(theme,'units'):surface==='dexa-phase'?dexa(theme,'phase'):surface==='single-viewer'?singleViewer(theme):surface==='pair-viewer'?pairViewer(theme,false):surface==='pair-zoom'?pairViewer(theme,true):surface==='before-after'?beforeAfter():photo(theme);document.getElementById('stage').innerHTML=out;
</script></body></html>
