tail":"up from 12 reps · September 10","width":83},{"name":"Hyperextension Machine","value":"95 lb","detail":"up from 80 lb · September 17","width":100}],"insight":"Between checks, performance is the clearest read on training: it shows the work moving forward, while lean mass itself is only measured by the DEXA."},"energy":{"headline":"Intake ran above the plan's target on the readable days.","phase":"Lean Mass Build · Sep 1–Sep 26","narrative":"Food was logged on all 26 days through September 26, and 21 were complete enough to read. On those days intake averaged about 2,800 calories against a 2,500 target, and protein held around 186 g, in line with your usual. September 6, September 22, and September 24 through 26 were too patchy to read and are left out of that average.","insight":"Expenditure is a wearable estimate, so read the weekly balance as directional; the scale's trend is the steadier read of where intake sits against the work.","weeks":[{"label":"Sep 1–7","intake":3157,"out":2562,"days":6},{"label":"Sep 8–14","intake":2640,"out":2732,"days":7},{"label":"Sep 15–21","intake":2659,"out":2728,"days":7},{"label":"Sep 22–26","intake":null,"out":null,"days":1}]},"recovery":{"status":"Yellow","title":"Sleep softened across the second half","summary":"6 hr 25 min average · 27 of 30 nights","values":[411,402,390,372,348],"labels":["W1","W2","W3","W4","W5"],"baseline":404,"average":385,"commentaryTitle":"A multi-week shift","commentary":"Two completed weeks were meaningfully below your prior 28-night baseline. No downstream training constraint was established.","foam":"18 of 22 completed","foamDetail":"3 excused · 1 missed","caveat":"Sleep uses the prior 28 reliable nights and excludes this period. Foam rolling cannot set the Recovery status. Associations do not imply causation."},"body":{"headline":"The September 12 DEXA is the new reference point.","date":"September 12, 2026","metrics":[{"label":"Body fat","value":"8.1%"},{"label":"Lean mass","value":"153.3 lb"},{"label":"Fat mass","value":"14.2 lb"}],"narrative":"It measured lean mass up 5 lb since August 15, and body fat stayed inside its limit. On the scale, the weekly average went from about 170 lb in the first week to about 174 lb in the latest, roughly 1.7 lb a week on the recent trend. The scale can't tell lean mass apart from other weight, so it adds pace, not a verdict.","callout":"The next DEXA will be compared with this one."},"changes":{"title":"September changed how progress should be judged.","items":[{"label":"Early-month stretch · September 3 through 7","copy":"Calories ran above usual September 3 through 5, the wearable showed less activity September 4 through 7, and training stopped September 5 through 7."},{"label":"Late-month stretch · September 24 through 26","copy":"The wearable showed less activity September 24 through 26, and training and weigh-ins stopped September 25 and 26. It runs up to the latest complete day, so whether it has passed isn't known yet."},{"label":"Pattern · Two short stretches, not a pattern.","copy":"Together they cover eight days; outside them the routine held, and wearable activity stayed at its usual level."}]},"ahead":{"title":"Turn September's signals into repeatable evidence.","intro":"October's job is to keep the progress going on a steadier rhythm.","items":[{"label":"Priority","title":"Get the usual training rhythm back","copy":"Protecting the usual training days matters more than any single big week."},{"label":"Training","title":"Keep the progression going","copy":"Build on the lifts that moved; repeating a best matters as much as beating it."},{"label":"Intake","title":"Bring intake back down to the target","copy":"Hitting the target on most days across the month counts for more than any single day."},{"label":"Logging","title":"Log complete days","copy":"A full day's log, every day, makes intake the easiest part of October to read."},{"label":"Watch","title":"The weekly weight average","copy":"It shows the pace between scans; a single weigh-in never does."},{"label":"Next evidence","title":"The next DEXA","copy":"It is the check that settles what the scale can't."}]}}

const m=JSON.parse(document.getElementById('monthly-data').textContent);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const sem=(key,value,html)=>`<span data-semantic="monthly.${key}" data-value="${esc(value)}">${html??esc(value)}</span>`;
function sleepGraph(theme){const v=m.recovery.values,b=m.recovery.baseline,W=330,H=155,p=14,min=Math.min(...v,b)-20,max=Math.max(...v,b)+20,x=i=>p+i*(W-2*p)/(v.length-1),y=n=>p+(max-n)*(H-2*p)/(max-min),pts=v.map((n,i)=>`${x(i)},${y(n)}`).join(' '),area=`${x(0)},${H-p} ${pts} ${x(v.length-1)},${H-p}`;return `<div class="sleep-chart" data-chart="monthly-recovery" data-point-count="5"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly Sleep weekly averages: W1 411, W2 402, W3 390, W4 372, W5 348 minutes. Personal baseline 404 minutes. Status Yellow."><defs><linearGradient id="sleep-${theme}-area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b79cff" stop-opacity=".3"/><stop offset="1" stop-color="#b79cff" stop-opacity="0"/></linearGradient></defs><path class="sleep-grid" d="M14 ${H*.32}H316 M14 ${H*.67}H316"/><line class="sleep-baseline" x1="14" y1="${y(b)}" x2="316" y2="${y(b)}"/><polygon class="sleep-area" style="fill:url(#sleep-${theme}-area)" points="${area}"/><polyline class="sleep-line" points="${pts}"/>${v.map((n,i)=>`<circle class="sleep-point" cx="${x(i)}" cy="${y(n)}" r="4" data-value="${n}" data-source-key="recovery.weeklyAverageMinutes.${i}"/>`).join('')}</svg><div class="sleep-axis">${m.recovery.labels.map(x=>`<span>${x}</span>`).join('')}</div></div>`}
function render(theme){const max=3157;return `<article class="phone ${theme}" data-variant="monthly-${theme}"><div class="status"><span>1:05</span><span class="island"></span><span class="status-icons">▮▮▮⌁</span></div><div class="content"><nav class="nav" data-section="monthly-navigation"><span class="nav-chip">‹ Home</span><span class="nav-chip">▦ Briefing History</span></nav><section class="hero" data-section="monthly-hero"><div class="topline"><span class="eyebrow">${sem('hero.eyebrow',m.hero.eyebrow)}</span><span class="range">${sem('hero.range',m.hero.range)}<br>${sem('hero.period',m.hero.period)}</span></div><div class="confidence"><div class="ring" style="--score:${m.hero.confidence.score}" role="img" aria-label="Confidence ${m.hero.confidence.score} percent"><div class="ring-inner"><div class="ring-score">${sem('hero.confidence.score',m.hero.confidence.score,m.hero.confidence.score+'%')}</div><div class="ring-caption">Confidence</div></div></div><div class="confidence-copy"><span class="band">${sem('hero.confidence.band',m.hero.confidence.band)}</span><strong>${sem('hero.confidence.movement',m.hero.confidence.movement)}</strong><p>${sem('hero.confidence.explanation',m.hero.confidence.explanation)}</p></div></div><hr class="hero-rule"><h1>${sem('hero.headline',m.hero.headline)}</h1><p class="meaning">${sem('hero.narrative',m.hero.narrative)}</p><div class="hero-highlights">${m.hero.highlights.map((h,i)=>`<div class="hero-highlight"><span class="label">${sem(`hero.highlights.${i}.label`,h.label)}</span><strong>${sem(`hero.highlights.${i}.value`,h.value)}</strong><small>${sem(`hero.highlights.${i}.detail`,h.detail)}</small></div>`).join('')}</div><div class="hero-footer"><div><span class="label">Goal</span><strong>${sem('goal.goal',m.goal.goal)}</strong></div><div><span class="label">Phase</span><strong>${sem('goal.phase',m.goal.phase)}</strong></div></div></section><section class="section coach" data-section="monthly-strategy"><span class="eyebrow">${sem('strategy.label',m.strategy.label)}</span><p>${sem('strategy.copy',m.strategy.copy)}</p><span class="recommendation">Current strategy · ${sem('strategy.recommendation',m.strategy.recommendation)}</span></section><section class="section training" data-section="monthly-training"><div class="section-head"><span class="icon">↗</span><span class="section-label">Training Progress</span><span class="coverage">12 lifts · 21 days</span></div><h2 class="section-title">${sem('training.headline',m.training.headline)}</h2><p class="body-copy">${sem('training.narrative',m.training.narrative)}</p><div class="training-summary"><strong>3 of 4 weeks</strong><span>new bests landed<br>across the month</span></div>${m.training.records.map((r,i)=>`<div class="record-row"><div class="record-top"><strong>${sem(`training.records.${i}.name`,r.name)}</strong><span class="record-value">${sem(`training.records.${i}.value`,r.value)}</span></div><small>${sem(`training.records.${i}.detail`,r.detail)}</small><div class="record-rail"><i style="width:${r.width}%"></i></div></div>`).join('')}<div class="insight"><strong>Why it matters</strong><p>${sem('training.insight',m.training.insight)}</p></div></section><section class="section energy" data-section="monthly-energy"><div class="section-head"><span class="icon">ϟ</span><span class="section-label">Energy Evolution</span><span class="coverage">${sem('energy.phase',m.energy.phase)}</span></div><h2 class="section-title">${sem('energy.headline',m.energy.headline)}</h2><p class="body-copy">${sem('energy.narrative',m.energy.narrative)}</p><div class="energy-field"><div class="energy-kpis"><div class="energy-kpi"><span class="metric-label">Readable</span><strong>21 / 26</strong></div><div class="energy-kpi"><span class="metric-label">Avg intake</span><strong>≈2,800</strong></div><div class="energy-kpi"><span class="metric-label">Target</span><strong>2,500</strong></div></div><div class="energy-chart" data-chart="monthly-energy" data-point-count="4" role="img" aria-label="Weekly intake and estimated expenditure. Sep 1 to 7: 3157 in, 2562 out. Sep 8 to 14: 2640 in, 2732 out. Sep 15 to 21: 2659 in, 2728 out. Sep 22 to 26 not shown because only one readable day.">${m.energy.weeks.map((w,i)=>w.intake===null?`<div class="week-group unshown" data-source-key="energy.weeks.${i}" data-shown="false"><span class="week-label">${esc(w.label)}<br>not shown</span></div>`:`<div class="week-group" data-source-key="energy.weeks.${i}" data-shown="true"><i class="intake" style="height:${w.intake/max*100}%" data-series="Intake" data-value="${w.intake}"></i><i class="out" style="height:${w.out/max*100}%" data-series="Estimated expenditure" data-value="${w.out}"></i><span class="week-label">${esc(w.label)}<br>${w.days} days</span></div>`).join('')}</div><div class="legend"><span><i class="swatch" style="background:var(--amber)"></i>Intake</span><span><i class="swatch" style="background:var(--blue)"></i>Estimated expenditure</span></div></div><p class="energy-note">${sem('energy.insight',m.energy.insight)}</p></section><section class="section recovery" data-section="monthly-recovery" data-fixture-only="true" data-confidence-coupling="none"><div class="section-head"><span class="icon">◒</span><span class="section-label">Recovery</span><span class="fixture-flag">FUTURE CONTRACT · FIXTURE ONLY</span></div><div class="recovery-lead"><div><h2>${sem('recovery.title',m.recovery.title)}</h2><div class="recovery-summary">${sem('recovery.summary',m.recovery.summary)}</div></div><span class="status-pill"><i></i>${sem('recovery.status',m.recovery.status)}</span></div><div class="recovery-kpis"><div class="period-average"><strong>${sem('recovery.average',m.recovery.average,'6h 25m')}</strong><span>Month average</span></div><div class="baseline-copy">28-night baseline · 6h 44m<span>${sem('recovery.baseline',m.recovery.baseline,'Personal baseline')}</span></div></div>${sleepGraph(theme)}<div class="recovery-comment"><strong>${sem('recovery.commentaryTitle',m.recovery.commentaryTitle)}</strong><p>${sem('recovery.commentary',m.recovery.commentary)}</p></div><div class="recovery-meta"><div class="foam"><strong>Foam rolling</strong><span>${sem('recovery.foamDetail',m.recovery.foamDetail)}</span></div><div class="foam-value">${sem('recovery.foam',m.recovery.foam)}</div></div><p class="recovery-foot">${sem('recovery.caveat',m.recovery.caveat)} Confidence coupling: none.</p></section><section class="section baseline" data-section="monthly-body-composition"><div class="section-head"><span class="icon">◇</span><span class="section-label">New Baseline</span><span class="baseline-date">${sem('body.date',m.body.date)}</span></div><h2 class="section-title">${sem('body.headline',m.body.headline)}</h2><div class="body-metrics">${m.body.metrics.map((x,i)=>`<div class="body-metric"><span class="metric-label">${sem(`body.metrics.${i}.label`,x.label)}</span><strong>${sem(`body.metrics.${i}.value`,x.value)}</strong></div>`).join('')}</div><p class="body-copy">${sem('body.narrative',m.body.narrative)}</p><div class="weight-evolution" role="img" aria-label="Scale weekly average moved from about 170 pounds in the first week to about 174 pounds in the latest week"><strong>≈170 lb</strong><div class="weight-track"><i></i></div><strong>≈174 lb</strong></div><div class="callout"><strong>Baseline Read</strong><p>${sem('body.callout',m.body.callout)}</p></div></section><section class="section changes" data-section="monthly-changes"><div class="section-head"><span class="icon">◎</span><span class="section-label">What Changed</span></div><h2 class="section-title">${sem('changes.title',m.changes.title)}</h2>${m.changes.items.map((x,i)=>`<div class="change-item"><span class="change-num">${i+1}</span><div><strong>${sem(`changes.items.${i}.label`,x.label)}</strong><p>${sem(`changes.items.${i}.copy`,x.copy)}</p></div></div>`).join('')}</section><section class="section ahead" data-section="monthly-month-ahead"><span class="section-label">Month Ahead</span><h2 class="section-title">${sem('ahead.title',m.ahead.title)}</h2><p class="body-copy">${sem('ahead.intro',m.ahead.intro)}</p><div class="actions">${m.ahead.items.map((x,i)=>`<div class="action"><span class="num">${i+1}</span><div><span class="action-label">${sem(`ahead.items.${i}.label`,x.label)}</span><strong>${sem(`ahead.items.${i}.title`,x.title)}</strong><p>${sem(`ahead.items.${i}.copy`,x.copy)}</p></div></div>`).join('')}</div></section><footer class="provenance-anchor" data-section="monthly-provenance" data-condition="absent-no-revision-provenance"></footer></div></article>`}
document.getElementById('board').innerHTML=`<div class="column"><h2>Monthly · dark</h2>${render('dark')}</div><div class="column"><h2>Monthly · mineral light</h2>${render('light')}</div>`;document.documentElement.dataset.ready='true';
</script>
