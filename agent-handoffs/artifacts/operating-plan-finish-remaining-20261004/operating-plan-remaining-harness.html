<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Operating Plan · Tracking + Coaching Updates</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#04080d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{cursor:default}h1,h2,h3,p{margin:0}
.phone{--bg:#06131e;--text:#f5f7f5;--muted:#92a5ae;--line:#203541;--surface:#0e2230;--surface2:#142c39;--deep:#091a27;--teal:#27c8ba;--green:#54dfa0;--cyan:#47c8da;--amber:#f1bd54;--purple:#9e80ff;--navy:#123e62;--red:#ed7081;width:402px;min-height:874px;color:var(--text);background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0009}
.phone.light{--bg:#efeee7;--text:#0b1c2d;--muted:#61737b;--line:#cbd5d0;--surface:#fbfaf6;--surface2:#dcebe7;--deep:#e5eae4;--teal:#0b9185;--green:#138a5e;--cyan:#168a9b;--amber:#b5740a;--purple:#7354da;--navy:#143f61;--red:#c24f63}
.status{height:46px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between;font-size:13px;font-weight:850;position:relative}.island{position:absolute;top:11px;left:50%;width:118px;height:34px;border-radius:22px;background:#01050a;transform:translateX(-50%)}
.nav{min-height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:760}.nav span{min-height:44px;display:flex;align-items:center}.nav .right{color:var(--teal);font-weight:850}.page{padding:18px 18px 38px}.eyebrow{font-size:10px;line-height:1.25;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}h1{font-size:31px;line-height:1.04;letter-spacing:-.045em}h2{font-size:18px;line-height:1.18;letter-spacing:-.02em}h3{font-size:15px;line-height:1.2}.body{font-size:14px;line-height:1.46;color:var(--muted)}.small{font-size:12px;line-height:1.4;color:var(--muted)}.header{margin-bottom:19px}.header h1{margin:7px 0 8px}.header .body{max-width:350px}
.hero{border-radius:22px;padding:18px;margin:0 0 16px;background:linear-gradient(145deg,#118e86,#123f63);color:#fff;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:185px;height:185px;border:34px solid #50dda03d;border-radius:50%;right:-93px;bottom:-125px}.light .hero{background:linear-gradient(145deg,#d3ebe6,#c8dee9);color:var(--text)}.hero .eyebrow{color:#d5c9ff}.light .hero .eyebrow{color:var(--purple)}.hero h1{font-size:28px;max-width:310px;margin:7px 0 8px;position:relative;z-index:1}.hero p{color:#d5e2e5;max-width:318px;position:relative;z-index:1}.light .hero p{color:var(--muted)}
.root-continuity{margin-bottom:14px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}.root-continuity .small{margin-top:4px}.root-row{min-height:78px;display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.root-row:last-child{border-bottom:0}.icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#47c8da1d;color:var(--cyan);font-size:17px;font-weight:900}.root-row.coaching .icon{background:#9e80ff1b;color:var(--purple)}.root-row h2{font-size:16px;margin-bottom:4px}.chev{color:var(--muted);font-size:19px}.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;background:#54dfa017;color:var(--green);font-size:10px;font-weight:850}.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.section{padding:16px 2px 0}.section-title{display:flex;align-items:center;gap:9px;margin-bottom:11px}.section-title span{width:28px;height:28px;border-radius:9px;background:#47c8da1c;color:var(--cyan);display:grid;place-items:center;font-size:13px;font-weight:900}.section-title h2{font-size:16px}.routine{border:1px solid var(--line);border-radius:19px;background:var(--surface);padding:15px}.routine-head{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:start}.routine h2{font-size:17px;margin:2px 0 4px}.fields{border-top:1px solid var(--line);margin-top:13px}.field{display:grid;grid-template-columns:116px 1fr;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:start}.field .label{margin:2px 0 0}.field .value{font-size:14px;line-height:1.36;font-weight:820}.field.block{grid-template-columns:1fr}.field.block .label{margin-bottom:5px}.label{font-size:9px;line-height:1.2;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.value{font-size:13px;line-height:1.3;font-weight:820}
.action{min-height:52px;margin-top:18px;border:0;border-radius:15px;background:linear-gradient(135deg,#168c79,#153d63);color:#fff;display:grid;place-items:center;width:100%;font-size:15px;font-weight:860}.action.navy{background:var(--navy)}.note{margin-top:14px;padding:13px 14px;border-left:3px solid var(--cyan);background:#47c8da0d;border-radius:0 13px 13px 0}.note b{display:block;font-size:13px;margin-bottom:4px}.warning{border-left-color:var(--amber);background:#f1bd540d}
.form-section{margin-top:18px}.form-section h2{font-size:15px;margin-bottom:10px}.choice-row{display:flex;gap:7px;flex-wrap:wrap}.choice{min-height:44px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:0 12px;font-size:12px;font-weight:780}.choice.selected{color:var(--text);border-color:#27c8ba70;background:#27c8ba18}.choice.week{width:40px;padding:0}.text-field{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--deep);color:var(--text);font-size:14px}.text-area{min-height:82px;padding:12px;line-height:1.4}.split{display:grid;grid-template-columns:1fr 1fr;gap:9px}.input-label{font-size:12px;font-weight:800;margin-bottom:7px}.schedule-preview{margin-top:11px;padding:13px 14px;border-radius:14px;background:var(--surface2)}.schedule-preview .value{margin-top:4px}
.strategy-meta{display:grid;grid-template-columns:1fr 1fr 90px;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}.meta{background:var(--surface);padding:12px 11px;min-height:71px}.meta .value{font-size:12px}.strategy-field{padding:13px 2px;border-bottom:1px solid var(--line)}.strategy-field .value{font-size:14px;margin-top:5px}.strategy-field.highlight{margin:0 -12px;padding:13px 12px;background:#27c8ba0c;border-left:3px solid var(--teal)}
.editor-section{margin-top:18px}.editor-section>h2{font-size:16px;margin-bottom:10px}.editor-card{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}.editor-row{min-height:61px;padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.editor-row:last-child{border-bottom:0}.editor-row .value{text-align:right}.toggle{width:47px;height:28px;border-radius:999px;background:var(--green);padding:3px;margin-left:auto}.toggle:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;margin-left:19px}.toggle.off{background:var(--line)}.toggle.off:after{margin-left:0}.seg{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:12px;font-weight:820}.seg button.selected{background:var(--surface2);color:var(--text)}.stepper{display:flex;align-items:center;gap:10px}.stepper button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--deep);color:var(--text);font-weight:900}.photo-field{display:grid;grid-template-columns:104px 1fr;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.photo-field:last-child{border-bottom:0}.photo-field .value{text-align:right}.copy{padding:14px 14px 2px}.tint-teal{background:linear-gradient(145deg,#0e2932,#0d242d)}.light .tint-teal{background:linear-gradient(145deg,#d8ebe6,#edf5f0)}.tint-purple{background:linear-gradient(145deg,#15233a,#171d34)}.light .tint-purple{background:linear-gradient(145deg,#e9e4f6,#f8f5fb)}.tint-amber{background:linear-gradient(145deg,#29251c,#1b2227)}.light .tint-amber{background:linear-gradient(145deg,#f3e5cc,#fbf8f0)}
.unavailable{min-height:670px;display:flex;align-items:center;justify-content:center;padding:24px}.unavailable-card{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:22px;padding:22px}.unavailable-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:#47c8da18;color:var(--cyan);font-size:21px;margin-bottom:18px}.unavailable-card h1{font-size:26px;margin-bottom:10px}.unavailable-card .action{margin-top:22px;background:transparent;color:var(--teal);border:1px solid var(--line)}
.bottom{height:18px}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'tracking-root',theme=q.get('theme')||'dark';
function chrome(content,back='Operating Plan',right=''){return `<main class="phone ${theme==='light'?'light':''}" data-theme="${theme}" data-surface="${surface}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span><div class="island"></div></div><div class="nav"><span>‹ ${back}</span><span class="right">${right}</span></div>${content}<div class="bottom"></div></main>`}
function field(label,value,cls=''){return `<div class="field ${cls}" data-field="${label}"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function toggle(label,on=true){return `<div class="editor-row" data-field="${label}"><div class="value" style="text-align:left">${label}</div><div class="toggle ${on?'':'off'}"></div></div>`}
function rootRemainder(){return chrome(`<div class="page"><header class="header"><div class="eyebrow">LOCKED ROOT CONTINUITY</div><h1>After Supplements</h1><p class="body">The accepted root stays unchanged. These are the final two Server-ordered rows.</p></header><section class="root-continuity"><div class="root-row"><div class="icon">◇</div><div><h2>Tracking</h2><p class="small">Every morning</p></div><div><span class="chip">Active</span><span class="chev">›</span></div></div><div class="root-row coaching"><div class="icon">✦</div><div><h2>Coaching Updates</h2><p class="small">Midweek calibration and weekly synthesis</p></div><div><span class="chip">Active</span><span class="chev">›</span></div></div></section><div class="note"><b>Source order preserved</b><p class="small">Tracking is seventh. Coaching Updates is eighth and conditional on an active Coaching protocol.</p></div></div>`)}
function trackingRoot(){return chrome(`<div class="page"><section class="hero"><div class="eyebrow">TRACKING</div><h1>Tracking</h1><p class="body">Define the recurring measurements PhysiqueOS uses to understand how your plan is working.</p></section><section class="section"><div class="section-title"><span>◇</span><h2>Current Tracking Routines</h2></div><article class="routine"><div class="routine-head"><div class="icon">◇</div><div><h2>Morning Weigh-In</h2><p class="small">Create a consistent daily weight signal for the Energy Strategy.</p></div></div><div class="fields">${field('Current Support','Every morning')}${field('Next due','Tomorrow · Morning')}${field('Completion','Weight evidence completes it automatically.')}</div><button class="action">Edit Support</button></article></section></div>`)}
function trackingEdit(){return chrome(`<div class="page"><header class="header"><div class="eyebrow">MORNING WEIGH-IN</div><h1>Edit Support</h1><p class="body">Set when this measurement is expected and whether Home should remind you. Weight evidence completes it automatically.</p></header><div class="form-section"><h2>Frequency</h2><div class="choice-row">${['Daily','Weekly','Specific days','Every X days'].map(x=>`<button class="choice ${x==='Daily'?'selected':''}">${x}</button>`).join('')}</div></div><div class="form-section"><h2>Timing</h2><div class="choice-row">${['Morning','Afternoon','Evening','Specific time'].map(x=>`<button class="choice ${x==='Morning'?'selected':''}">${x}</button>`).join('')}</div></div><div class="form-section"><h2>Schedule window</h2><div class="split"><div><div class="input-label">Starts</div><div class="text-field" style="display:flex;align-items:center">Jul 19, 2026</div></div><div><div class="input-label">Ends</div><div class="text-field" style="display:flex;align-items:center">Until changed</div></div></div><div class="schedule-preview"><div class="label">Schedule Preview</div><div class="value">Every morning · starting Jul 19</div></div></div><div class="form-section"><h2>Reminder</h2><div class="choice-row"><button class="choice selected">Remind me</button><button class="choice">No reminder</button></div></div><div class="form-section"><h2>Execution Notes</h2><div class="text-field text-area">Usually immediately after waking and before food or water.</div></div><button class="action">Save Support</button></div>`,'Cancel')}
function coachingDetail(){return chrome(`<div class="page"><section class="hero"><div class="eyebrow">COACHING UPDATES</div><h1>Wednesday and Sunday Coaching</h1><p class="body">Turn current evidence into timely coaching without returning to routine daily briefings.</p></section><section class="strategy-meta"><div class="meta" data-field="Goal"><div class="label">Goal</div><div class="value">Your Build Lean Mass goal</div></div><div class="meta" data-field="Started"><div class="label">Started</div><div class="value">July 19, 2026</div></div><div class="meta" data-field="Status"><div class="label">Status</div><div class="chip">Active</div></div></section><section class="section"><div class="section-title"><span>✦</span><h2>Strategy Detail</h2></div><div class="strategy-field highlight" data-field="Midweek Calibration"><div class="label">Midweek Calibration</div><div class="value">Wednesday · 6:00 PM</div></div><div class="strategy-field" data-field="Weekly Synthesis"><div class="label">Weekly Synthesis</div><div class="value">Sunday · 9:00 AM</div></div><div class="strategy-field" data-field="Routine Daily Briefings"><div class="label">Routine Daily Briefings</div><div class="value">Off</div></div><div class="strategy-field" data-field="Notifications"><div class="label">Notifications</div><div class="value">Notify when ready</div></div><div class="strategy-field" data-field="Event Briefings"><div class="label">Event Briefings</div><div class="value">Photo and DEXA remain active when eligible</div></div></section><button class="action navy">Edit Coaching Updates</button></div>`)}
function cadenceSection(title,day,time){return `<section class="editor-section"><h2>${title}</h2><div class="editor-card tint-teal">${toggle('Enabled')}<div class="editor-row"><div><div class="label">Day of week</div><div class="value">${day}</div></div><div class="chev">⌄</div></div><div class="editor-row"><div><div class="label">Preferred delivery time</div><div class="value">${time}</div></div><div class="chev">›</div></div></div></section>`}
function coachingEdit(monthlyState=false){const progress=monthlyState?`<section class="editor-section"><h2>Progress Photos</h2><div class="editor-card tint-purple"><div class="copy"><p class="body">Choose when you plan to take progress photos, whether Home should remind you, and whether completed photo sessions should generate a Photo Event review.</p></div><div class="photo-field"><div class="label">Cadence</div><div class="stepper"><button>−</button><div class="value">Every 2 Months</div><button>＋</button></div></div><div class="seg"><button>Weeks</button><button class="selected">Months</button></div><div class="photo-field" data-field="First"><div class="label">On the</div><div class="value">First Saturday ⌄</div></div><div class="photo-field" data-field="Specific"><div class="label">Preferred time</div><div class="value">Specific ⌄</div></div><div class="photo-field" data-field="8:30 AM"><div class="label">Specific time</div><div class="value">8:30 AM ›</div></div><div class="copy" data-field="Starts"><div class="value">Every 2 months on the first Saturday</div><p class="small">Starts December 5</p></div>${toggle('Remind me about Progress Photos')}${toggle('Enable Photo Event briefing')}</div></section>`:`<section class="editor-section"><h2>Progress Photos</h2><div class="editor-card tint-purple"><div class="copy"><p class="body">Choose when you plan to take progress photos, whether Home should remind you, and whether completed photo sessions should generate a Photo Event review.</p></div><div class="photo-field"><div class="label">Cadence</div><div class="stepper"><button>−</button><div class="value">Every 2 Weeks</div><button>＋</button></div></div><div class="seg"><button class="selected">Weeks</button><button>Months</button></div><div class="photo-field"><div class="label">On</div><div class="value">Saturday ⌄</div></div><div class="photo-field"><div class="label">Preferred time</div><div class="value">Specific ⌄</div></div><div class="photo-field"><div class="label">Specific time</div><div class="value">10:00 AM ›</div></div><div class="copy" data-field="Every 2 weeks on Saturday"><div class="value">Every 2 weeks on Saturday</div><p class="small">Next: October 17</p></div>${toggle('Remind me about Progress Photos')}${toggle('Enable Photo Event briefing')}</div></section>`;
if(monthlyState)return chrome(`<div class="page"><header class="header"><div class="eyebrow">COACHING UPDATES</div><h1>Progress Photos · monthly cadence state</h1><p class="body">The same editor exposes its current month-specific weekday anchor and exact-time controls.</p></header>${progress}<button class="action">Save Coaching Updates</button></div>`,'Cancel');
return chrome(`<div class="page"><header class="header"><div class="eyebrow">COACHING UPDATES</div><h1>Edit Coaching Updates</h1><p class="body">How and when PhysiqueOS synthesizes progress into a readable update.</p></header>${cadenceSection('Midweek Calibration','Wednesday','6:00 PM')}${cadenceSection('Weekly Synthesis','Sunday','9:00 AM')}<section class="editor-section"><h2>Monthly Review</h2><div class="editor-card tint-teal">${toggle('Enabled')}<div class="editor-row" data-field="Day 1 of each month"><div><div class="label">Monthly Delivery Rule</div><div class="value">Day 1 of each month</div></div></div><div class="editor-row"><div><div class="label">Preferred delivery time</div><div class="value">9:00 AM</div></div><div class="chev">›</div></div></div></section>${progress}<section class="editor-section"><h2>DEXA</h2><div class="editor-card tint-amber"><div class="copy"><p class="body">Schedule your next scan and choose the in-app reminders that support it.</p></div><div class="photo-field" data-field="Oct 9, 2026"><div class="label">Next scan date</div><div class="value">Oct 9, 2026 ›</div></div><div class="photo-field"><div class="label">Time</div><div class="value">9:00 AM ›</div></div><div class="copy"><div class="label">Preparation note (optional)</div><p class="body">Use consistent morning preparation conditions.</p></div>${toggle('Remind me 1 week before')}${toggle('Remind me 1 day before')}${toggle('Remind me the morning of')}${toggle('Remind me to upload results after the appointment')}${toggle('Enable DEXA Event briefing')}</div></section><section class="editor-section"><h2>Notifications</h2><div class="note" data-field="Enabled briefings notify you when the canonical update is published"><p class="body">Enabled briefings notify you when the canonical update is published. iOS notification permission controls delivery.</p></div></section><button class="action">Save Coaching Updates</button></div>`,'Cancel')}
function dexaUnavailable(){return chrome(`<section class="unavailable"><article class="unavailable-card"><div class="unavailable-icon">◇</div><div class="eyebrow">DEXA EXECUTION</div><h1>Next DEXA Scan</h1><p class="body" data-field="Manage your production DEXA schedule in Coaching Updates, where Progress Photos and DEXA are saved together.">Manage your production DEXA schedule in Coaching Updates, where Progress Photos and DEXA are saved together.</p></article></section>`)}
let html;if(surface==='root-remainder')html=rootRemainder();else if(surface==='tracking-root')html=trackingRoot();else if(surface==='tracking-edit')html=trackingEdit();else if(surface==='coaching-detail')html=coachingDetail();else if(surface==='coaching-edit')html=coachingEdit();else if(surface==='coaching-photos-monthly')html=coachingEdit(true);else if(surface==='dexa-production-unavailable')html=dexaUnavailable();else html=trackingRoot();document.getElementById('app').innerHTML=html;
</script></body></html>
