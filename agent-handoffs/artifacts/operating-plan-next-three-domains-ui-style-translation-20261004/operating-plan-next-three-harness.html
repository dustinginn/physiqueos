<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PhysiqueOS Operating Plan · Recovery, Peptides, Supplements</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#04080d;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input{font:inherit}button{cursor:default}
.phone{--bg:#06131e;--text:#f5f7f5;--muted:#92a5ae;--line:#203541;--surface:#0e2230;--surface2:#142c39;--deep:#0a1c29;--teal:#27c8ba;--green:#54dfa0;--cyan:#47c8da;--amber:#f1bd54;--purple:#9e80ff;--navy:#123e62;--red:#ed7081;width:402px;min-height:874px;color:var(--text);background:var(--bg);border-radius:48px;overflow:hidden;position:relative;box-shadow:0 24px 70px #0009}
.phone.light{--bg:#efeee7;--text:#0b1c2d;--muted:#61737b;--line:#cbd5d0;--surface:#fbfaf6;--surface2:#dcebe7;--deep:#143f61;--teal:#0b9185;--green:#138a5e;--cyan:#168a9b;--amber:#b5740a;--purple:#7354da;--navy:#143f61;--red:#c24f63}
.status{height:46px;padding:0 26px 9px;display:flex;align-items:end;justify-content:space-between;font-size:13px;font-weight:850;position:relative}.island{position:absolute;top:11px;left:50%;width:118px;height:34px;border-radius:22px;background:#01050a;transform:translateX(-50%)}
.nav{min-height:48px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:760}.nav span{min-height:44px;display:flex;align-items:center}.nav .save{color:var(--teal);font-weight:850}.page{padding:18px 18px 34px}.eyebrow{font-size:10px;line-height:1.25;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}h1,h2,h3,p{margin:0}h1{font-size:31px;line-height:1.04;letter-spacing:-.045em}h2{font-size:18px;line-height:1.18;letter-spacing:-.02em}h3{font-size:15px;line-height:1.2}.body{font-size:14px;line-height:1.46;color:var(--muted)}.small{font-size:12px;line-height:1.4;color:var(--muted)}.header{margin-bottom:19px}.header h1{margin:7px 0 8px}.header .body{max-width:348px}.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.domain-hero{border-radius:22px;padding:18px;margin:0 0 14px;background:linear-gradient(145deg,#118e86,#123f63);color:#fff;position:relative;overflow:hidden}.domain-hero:after{content:"";position:absolute;width:190px;height:190px;border:34px solid #50dda040;border-radius:50%;right:-94px;bottom:-126px}.light .domain-hero{background:linear-gradient(145deg,#d3ebe6,#c8dee9);color:var(--text)}.domain-hero .eyebrow{color:#d5c9ff}.light .domain-hero .eyebrow{color:var(--purple)}.domain-hero h1{font-size:28px;max-width:300px;margin:7px 0 8px;position:relative;z-index:1}.domain-hero p{color:#d5e2e5;max-width:318px;position:relative;z-index:1}.light .domain-hero p{color:var(--muted)}
.method-list{display:grid;gap:11px}.method{border:1px solid var(--line);border-radius:18px;background:var(--surface);padding:14px}.light .method{box-shadow:0 8px 22px #173b5010}.method-head{display:grid;grid-template-columns:42px 1fr auto;gap:11px;align-items:start}.method-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#27c8ba20;color:var(--teal);font-size:17px;font-weight:900}.method.peptide .method-icon{background:#9e80ff1c;color:var(--purple)}.method.supplement .method-icon{background:#54dfa01d;color:var(--green)}.method h2{font-size:17px;margin:2px 0 4px}.chip{display:inline-flex;gap:6px;align-items:center;padding:6px 8px;border-radius:999px;background:#54dfa017;color:var(--green);font-size:10px;font-weight:850}.chip:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.chip.paused{color:var(--muted);background:#92a5ae18}.method-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.label{font-size:9px;line-height:1.2;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.value{font-size:13px;line-height:1.3;font-weight:820}.method-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.mini-action{min-height:44px;padding:0 13px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--text);font-size:12px;font-weight:820}.mini-action.primary{background:#27c8ba16;border-color:#27c8ba50;color:var(--teal)}.mini-action.destructive{color:var(--red)}.mini-action.restore{color:var(--green)}
.section{padding:16px 2px 0}.section-title{display:flex;align-items:center;gap:9px;margin-bottom:11px}.section-title span{width:28px;height:28px;border-radius:9px;background:#27c8ba1c;color:var(--teal);display:grid;place-items:center;font-size:13px;font-weight:900}.section-title h2{font-size:16px}.fields{border-top:1px solid var(--line)}.field{display:grid;grid-template-columns:118px 1fr;gap:11px;padding:13px 2px;border-bottom:1px solid var(--line);align-items:start}.field .label{margin:2px 0 0}.field .value{font-size:14px;line-height:1.36}.field.block{grid-template-columns:1fr}.field.block .label{margin-bottom:5px}.field.actionable:after{content:"›";color:var(--muted);font-size:18px;align-self:center}.field.actionable{grid-template-columns:118px 1fr auto}.toggle{width:47px;height:28px;border-radius:999px;background:var(--green);padding:3px;margin-left:auto}.toggle:after{content:"";display:block;width:22px;height:22px;border-radius:50%;background:#fff;margin-left:19px}.toggle.off{background:var(--line)}.toggle.off:after{margin-left:0}.action{min-height:52px;margin-top:18px;border:0;border-radius:15px;background:var(--navy);color:#fff;display:grid;place-items:center;width:100%;font-size:15px;font-weight:860}.action.teal{background:linear-gradient(135deg,#168c79,#153d63)}.action.red{background:transparent;color:var(--red);border:1px solid #ed70815c}.action.ghost{background:transparent;color:var(--teal);border:1px solid var(--line)}.note{margin-top:14px;padding:13px 14px;border-left:3px solid var(--cyan);background:#47c8da0d;border-radius:0 13px 13px 0}.note b{display:block;font-size:13px;margin-bottom:4px}.warning{border-left-color:var(--amber);background:#f1bd540d}.paused-note{border-left-color:var(--purple);background:#9e80ff0d}
.editor-card{border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}.editor-row{min-height:61px;padding:12px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:116px 1fr auto;gap:10px;align-items:center}.editor-row:last-child{border-bottom:0}.editor-row .value{text-align:right}.editor-row input,.text-field{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--deep);color:var(--text);font-size:14px}.light .editor-row input,.light .text-field{background:var(--surface)}.choice-row{display:flex;gap:7px;flex-wrap:wrap}.choice{min-height:44px;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:0 12px;font-size:12px;font-weight:780}.choice.selected{color:var(--text);border-color:#27c8ba70;background:#27c8ba18}.choice.week{width:40px;padding:0}.schedule-preview{margin-top:12px;padding:13px 14px;border-radius:14px;background:var(--surface2)}.schedule-preview .value{margin-top:4px}.form-section{margin-top:18px}.form-section h2{font-size:15px;margin-bottom:10px}.input-stack{display:grid;gap:9px}.input-label{font-size:12px;font-weight:800}.text-area{min-height:82px;padding:12px;align-items:start}.split-input{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.plan-summary{margin-top:13px;padding:14px;border-radius:16px;background:linear-gradient(145deg,#123c55,#102735)}.light .plan-summary{background:linear-gradient(145deg,#163f61,#176d73);color:white}.plan-summary .label{color:#c0d0d4}.plan-summary strong{font-size:18px;display:block;margin:5px 0}.timeline{margin:12px 0 0 7px;padding-left:18px;border-left:2px solid var(--line)}.timeline-row{position:relative;padding:0 0 16px 3px}.timeline-row:before{content:"";position:absolute;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--teal);left:-25px;top:2px}.timeline-row.done:before{border-color:var(--amber)}.timeline-row .small{margin-top:3px}.disclosure{min-height:52px;padding:0 2px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:820}.history-list{padding-top:7px}.history-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.history-row span:last-child{font-weight:800;color:var(--muted)}
.sheet-wrap{padding-top:54px}.sheet{min-height:740px;background:var(--surface);border-radius:28px 28px 0 0;padding:11px 18px 28px;box-shadow:0 -18px 50px #0006}.light .sheet{box-shadow:0 -18px 50px #173b5022}.grabber{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 18px}.sheet-head{display:flex;justify-content:space-between;align-items:center;min-height:44px;margin-bottom:12px}.sheet-head h1{font-size:21px}.sheet-head button{border:0;background:transparent;color:var(--teal);font-weight:850}.wheel{margin:22px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);height:168px;display:grid;place-items:center;position:relative;overflow:hidden}.wheel:before,.wheel:after{content:"9:30 PM";position:absolute;left:0;right:0;text-align:center;color:var(--muted);font-size:18px}.wheel:before{top:25px}.wheel:after{bottom:25px;content:"10:00 PM"}.wheel strong{font-size:28px}.confirm{margin-top:124px;border-radius:21px;background:var(--surface);border:1px solid var(--line);padding:19px}.confirm h1{font-size:23px;margin:7px 0 10px}.confirm-actions{display:grid;gap:9px;margin-top:18px}.confirm-actions button{min-height:48px;border-radius:13px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:850}.confirm-actions .danger{background:var(--red);color:white;border-color:transparent}
.helper{margin-top:9px;font-size:11px;line-height:1.4;color:var(--muted)}.spacer{height:12px}.bottom{height:22px}
.sheet-head button{min-height:44px}
</style></head><body><div id="app"></div>
<script>
const q=new URLSearchParams(location.search),surface=q.get('surface')||'recovery-domain',theme=q.get('theme')||'dark';
const label={recovery:'Recovery',peptide:'Peptides',supplement:'Supplements'};
function chrome(content,back='Operating Plan',right=''){return `<main class="phone ${theme==='light'?'light':''}" data-theme="${theme}" data-surface="${surface}"><div class="status"><span>1:05</span><span>▮▮▮⌁</span><div class="island"></div></div><div class="nav"><span>‹ ${back}</span>${right?`<span class="save">${right}</span>`:'<span></span>'}</div>${content}<div class="bottom"></div></main>`}
function hero(eyebrow,title,purpose){return `<section class="domain-hero"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="body">${purpose}</p></section>`}
function method({kind='recovery',icon='◉',name,purpose,status='Active',summary,dose,schedule,actions=[]}){return `<section class="method ${kind}" data-method="${name}"><div class="method-head"><div class="method-icon">${icon}</div><div><h2>${name}</h2><p class="small">${purpose}</p></div><div class="chip ${status==='Paused'?'paused':''}">${status}</div></div>${(summary||dose||schedule)?`<div class="method-grid">${summary?`<div><div class="label">Support</div><div class="value">${summary}</div></div>`:''}${dose?`<div><div class="label">Current dose</div><div class="value">${dose}</div></div>`:''}${schedule?`<div><div class="label">Schedule</div><div class="value">${schedule}</div></div>`:''}</div>`:''}<div class="method-actions">${actions.map((a,i)=>`<button class="mini-action ${i===0?'primary':''} ${a==='Pause'?'destructive':''} ${a==='Restore'?'restore':''}">${a}</button>`).join('')}</div></section>`}
function domainPage(kind){const data={recovery:{title:'Recovery Strategy',purpose:'Support methods that protect training performance and recovery between sessions.',methods:[{name:'Foam Rolling',purpose:'Support movement quality and readiness so training stays consistent with your Build Lean Mass goal.',summary:'Daily · 7:15 PM',actions:['Edit Support']}]},peptide:{title:'Peptide Strategy',purpose:'Active dosing strategies supporting body composition and recovery.',methods:[{kind:'peptide',icon:'✦',name:'Retatrutide',purpose:'Support nutrition consistency and body-composition direction as you work toward your Build Lean Mass goal.',status:'Paused',dose:'1.5 mg',schedule:'Thursday · 9:45 PM',actions:['Manage','Resume']},{kind:'peptide',icon:'✦',name:'Tesamorelin',purpose:'Support recovery and training consistency as you work toward your Build Lean Mass goal.',dose:'0.5 mg',schedule:'Sun–Thu · 10:29 PM',actions:['Manage']}]},supplement:{title:'Supplement Strategy',purpose:'Daily support supplements alongside the current training block.',methods:[{kind:'supplement',icon:'＋',name:'Electrolytes',purpose:'Support hydration and electrolyte consistency across the training and recovery demands of your Build Lean Mass goal.',summary:'Daily · Morning',actions:['Edit Support','Edit Strategy','Pause']},{kind:'supplement',icon:'＋',name:'Fadogia Agrestis',purpose:'Support consistency in the supplement plan accompanying your Build Lean Mass goal.',summary:'Every other day',actions:['Edit Support','Edit Strategy','Pause']},{kind:'supplement',icon:'＋',name:'Multivitamin',purpose:'Provide foundational micronutrient coverage while you work toward your Build Lean Mass goal.',status:'Paused',summary:'Daily',actions:['Restore']},{kind:'supplement',icon:'＋',name:'Tongkat Ali',purpose:'Support consistency in the supplement plan accompanying your Build Lean Mass goal.',summary:'Daily · Morning',actions:['Edit Support','Edit Strategy','Pause']}]}}[kind];return chrome(`<div class="page">${hero(kind.toUpperCase(),data.title,data.purpose)}${kind==='supplement'?'<button class="action teal" style="margin:0 0 14px">Add Supplement</button>':''}<div class="method-list">${data.methods.map(method).join('')}</div></div>`)}
function field(label,value,cls=''){return `<div class="field ${cls}" data-field="${label}"><div class="label">${label}</div><div class="value">${value}</div></div>`}
function recoveryDetail(edit=false){if(edit)return recoveryEdit();return chrome(`<div class="page"><header class="header"><div class="eyebrow">RECOVERY</div><h1>Foam Rolling</h1><p class="body">Support movement quality and readiness so training stays consistent with your Build Lean Mass goal.</p></header><section class="section"><div class="section-title"><span>◉</span><h2>Current Support</h2></div><div class="fields">${field('Summary','Daily · 7:15 PM')}${field('Schedule','Daily · 7:15 PM')}${field('Starts','Jul 19, 2026')}${field('Ends','Until changed')}${field('Reminder','On')}${field('Next due','Today · 7:15 PM')}${field('Execution Notes','Focus on lower body after leg sessions.','block')}</div></section><button class="action teal">Edit Support</button></div>`,'Recovery')}
function frequencyEditor(){return `<div class="form-section"><h2>Frequency</h2><div class="choice-row">${['Daily','Weekly','Specific days','Every X days'].map(x=>`<button class="choice ${x==='Daily'?'selected':''}">${x}</button>`).join('')}</div></div><div class="form-section"><h2>Timing</h2><div class="choice-row">${['Morning','Afternoon','Evening','Specific time'].map(x=>`<button class="choice ${x==='Specific time'?'selected':''}">${x}</button>`).join('')}</div><div class="spacer"></div><input class="text-field" value="7:15 PM" readonly></div><div class="form-section"><h2>Schedule window</h2><div class="split-input"><div><div class="input-label">Starts</div><input class="text-field" value="Jul 19, 2026" readonly></div><div><div class="input-label">Ends</div><input class="text-field" value="Until changed" readonly></div></div><div class="schedule-preview"><div class="label">Schedule Preview</div><div class="value">Daily at 7:15 PM · starting Jul 19</div></div></div>`}
function recoveryEdit(){return chrome(`<div class="page"><header class="header"><div class="eyebrow">RECOVERY</div><h1>Edit Foam Rolling Support</h1><p class="body">Schedule and reminders update the canonical recurring Support execution.</p></header>${frequencyEditor()}<div class="form-section"><h2>Reminder</h2><div class="choice-row"><button class="choice selected">On</button><button class="choice">Off</button></div></div><div class="form-section"><h2>Execution Notes</h2><div class="text-field text-area">Focus on lower body after leg sessions.</div></div><button class="action teal">Save Support</button></div>`,'Cancel')}
function peptideCard(name,{paused=false,tesa=false}={}){const dose=tesa?'0.5 mg':'1.5 mg',days=tesa?'Sun–Thu':'Thursday',time=tesa?'10:29 PM':'9:45 PM';return `<header class="header"><div class="row-between"><div><div class="eyebrow">PEPTIDE</div><h1 style="margin-top:7px">${name}</h1></div><div class="chip ${paused?'paused':''}">${paused?'Paused':'Active'}</div></div><p class="body" style="margin-top:8px">${tesa?'Support recovery and training consistency as you work toward your Build Lean Mass goal.':'Support nutrition consistency and body-composition direction as you work toward your Build Lean Mass goal.'}</p></header><div class="editor-card">${field('Dose',dose,'actionable')}${field('Days',days,'actionable')}${field('Time',time,'actionable')}${field(paused?'Paused since':'Next dose',paused?'Sep 12':'Thu, Oct 8 · '+time)}${!tesa?field('Planned change','2.5 mg · Oct 8'):''}<div class="editor-row"><div class="label">Reminder</div><div class="value">${paused?'Off while paused':'On'}</div><div class="toggle ${paused?'off':''}"></div></div>${field('Notes',tesa?'Taken five times per week, Sunday through Thursday, at night, fasted before bed.':'Fasted before bed.','actionable')}</div>${paused?'<div class="note paused-note"><b>Paused since Sep 12</b><p class="small">Upcoming doses and reminders are stopped. Dose history is preserved.</p></div>':''}`}
function peptidePage(kind){const tesa=kind==='tesa',paused=kind==='paused',name=tesa?'Tesamorelin':'Retatrutide';return chrome(`<div class="page">${peptideCard(name,{paused,tesa})}<button class="action ${paused?'teal':'red'}">${paused?'Resume':'Pause'} ${name}</button><div class="section"><div class="disclosure"><span>Advanced · dose plan</span><span>⌄</span></div><div class="plan-summary"><div class="label">Current plan</div><strong>${tesa?'Keep this dose since May 24':'Increase, hold, then decrease · finished Aug 6'}</strong><p class="small" style="color:inherit">${tesa?'0.5 mg until changed':'Historical titration remains intact; future changes start from their effective date.'}</p></div>${!tesa?`<div class="timeline"><div class="timeline-row done"><b>0.5 mg</b><p class="small">May 21 – May 27</p></div><div class="timeline-row done"><b>1.0 mg</b><p class="small">May 28 – Jun 3</p></div><div class="timeline-row"><b>1.5 mg</b><p class="small">Aug 6 – Until changed</p></div></div><div class="disclosure"><span>Dose history · 7 entries</span><span>Show all</span></div>`:''}</div></div>`,'Peptides')}
function sheetShell(title,body){return chrome(`<div class="sheet-wrap"><section class="sheet"><div class="grabber"></div><div class="sheet-head"><button>Cancel</button><h1>${title}</h1><button>Save</button></div>${body}</section></div>`,'Peptides')}
function doseSheet(){return sheetShell('Change dose',`<div class="form-section"><div class="input-label">Amount and unit</div><div class="split-input"><input class="text-field" value="1.5" readonly><input class="text-field" value="mg" readonly></div></div><div class="form-section"><h2>Starts</h2><div class="choice-row"><button class="choice selected">Today</button><button class="choice">Next dose</button><button class="choice">Pick date</button></div></div><div class="form-section"><h2>Apply change</h2><div class="choice-row"><button class="choice selected">From this date on</button><button class="choice">Only next dose</button></div><p class="helper">Changing from this date removes later planned dose changes. “Only next dose” continues in Priority Detail.</p></div>`)}
function daysSheet(){return sheetShell('Change days',`<div class="form-section"><div class="choice-row"><button class="choice selected">Specific days</button><button class="choice">Every X days</button></div></div><div class="form-section"><h2>Days</h2><div class="choice-row">${['S','M','T','W','T','F','S'].map((x,i)=>`<button class="choice week ${i===4?'selected':''}">${x}</button>`).join('')}</div></div><div class="schedule-preview"><div class="label">Schedule Preview</div><div class="value">Every Thursday</div></div>`)}
function timeSheet(){return sheetShell('Change time',`<div class="wheel"><strong>9:45 PM</strong></div><p class="helper">Currently set to Night. Saving an exact local time updates reminders and next-dose presentation.</p>`)}
function notesSheet(){return sheetShell('Edit notes',`<div class="form-section"><div class="input-label">Execution Notes</div><div class="text-field text-area">Fasted before bed.</div><p class="helper">Notes stay with this Execution Support record.</p></div>`)}
function pauseConfirm(){return chrome(`<div class="page"><div class="confirm"><div class="eyebrow">PEPTIDE LIFECYCLE</div><h1>Pause Retatrutide?</h1><p class="body">Upcoming doses and reminders stop until you resume. Your dose history is kept.</p><div class="form-section"><h2>Effective</h2><div class="choice-row"><button class="choice selected">Starting Today</button><button class="choice">Starting Tomorrow</button></div></div><div class="confirm-actions"><button class="danger">Pause</button><button>Cancel</button></div></div></div>`,'Retatrutide')}
function supplementSupport(edit=false){if(edit)return supplementSupportEdit();return chrome(`<div class="page"><header class="header"><div class="eyebrow">SUPPLEMENT SUPPORT</div><h1>Fadogia Agrestis</h1><p class="body">Every other day</p></header><section class="section"><div class="section-title"><span>＋</span><h2>Current Support</h2></div><div class="fields">${field('Dose / Quantity','Not specified')}${field('Schedule','Every other day')}${field('Reminder','Off')}${field('Execution Notes','Every-other-day supplement. Available for reminders if desired, but not currently surfaced by default.','block')}</div></section><button class="action teal">Edit Support</button></div>`,'Supplements')}
function supplementSupportEdit(){return chrome(`<div class="page"><header class="header"><div class="eyebrow">SUPPLEMENT SUPPORT</div><h1>Edit Fadogia Agrestis Support</h1><p class="body">Dose, schedule and reminders remain Execution-owned.</p></header><div class="form-section"><h2>Dose / Quantity</h2><div class="split-input"><input class="text-field" placeholder="Amount"><input class="text-field" placeholder="Unit"></div></div><div class="form-section"><h2>Frequency</h2><div class="choice-row"><button class="choice">Daily</button><button class="choice">Weekly</button><button class="choice">Specific days</button><button class="choice selected">Every X days</button></div><div class="spacer"></div><input class="text-field" value="2 days" readonly></div><div class="form-section"><h2>Timing</h2><div class="choice-row"><button class="choice selected">Morning</button><button class="choice">Afternoon</button><button class="choice">Evening</button><button class="choice">Specific time</button></div></div><div class="form-section"><h2>Schedule window</h2><div class="split-input"><input class="text-field" value="Jul 19, 2026" readonly><input class="text-field" value="Until changed" readonly></div></div><div class="form-section"><h2>Reminder</h2><div class="choice-row"><button class="choice">On</button><button class="choice selected">Off</button></div></div><div class="form-section"><h2>Execution Notes</h2><div class="text-field text-area">Every-other-day supplement. Available for reminders if desired, but not currently surfaced by default.</div></div><button class="action teal">Save Support</button></div>`,'Cancel')}
