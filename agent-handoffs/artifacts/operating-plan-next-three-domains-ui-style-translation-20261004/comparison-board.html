<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operating Plan · next three domains</title><style>*{box-sizing:border-box}body{margin:0;background:#05090f;color:#f4f7f5;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 18px;position:sticky;top:0;background:#05090fee;backdrop-filter:blur(16px);z-index:2;border-bottom:1px solid #203441}h1,h2,p{margin:0}header p{color:#95a6ae;margin-top:6px}.jump{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.jump a{color:#68ddd0;text-decoration:none;padding:8px 10px;border:1px solid #29414d;border-radius:999px}.group{padding:18px;border-bottom:1px solid #203441}.group h2{font-size:19px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}.card{background:#0b1722;border:1px solid #203441;border-radius:20px;padding:13px}.card h3{font-size:14px;margin:0 0 10px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair img{width:100%;display:block;border-radius:22px}.pair span{display:block;color:#95a6ae;font-size:10px;margin-bottom:5px}.note{padding:18px;color:#95a6ae}@media(max-width:640px){.group{padding:14px}.grid{grid-template-columns:1fr}.card{padding:10px}.pair{gap:6px}header{padding:17px 14px}}</style></head><body><header><h1>Operating Plan · next three domains</h1><p>Recovery, Peptides and Supplements — full current surface coverage in dark and mineral light.</p><nav class="jump"><a href="#recovery">Recovery</a><a href="#peptides">Peptides</a><a href="#peptide-actions">Peptide actions</a><a href="#supplements">Supplements</a></nav></header><main id="app"></main><p class="note">Design-only review artifact. Native shipping behavior and Server contracts are unchanged.</p><script>const groups=[['recovery','Recovery',[['Domain','recovery-domain'],['Support detail','recovery-detail'],['Edit Support','recovery-edit']]],['peptides','Peptides',[['Domain','peptide-domain'],['Retatrutide Manage','peptide-reta'],['Tesamorelin Manage','peptide-tesa'],['Paused / Resume','peptide-paused']]],['peptide-actions','Peptide focused changes',[['Change dose','peptide-dose'],['Change days','peptide-days'],['Change time','peptide-time'],['Edit notes','peptide-notes'],['Pause confirmation','peptide-pause']]],['supplements','Supplements',[['Domain + lifecycle','supplement-domain'],['Support detail','supplement-support'],['Edit Support','supplement-support-edit'],['Edit Strategy','supplement-strategy'],['Add Supplement','supplement-add']]];document.getElementById('app').innerHTML=groups.map(([id,title,items])=>`<section class="group" id="${id}"><h2>${title}</h2><div class="grid">${items.map(([label,s])=>`<article class="card"><h3>${label}</h3><div class="pair"><div><span>Dark</span><img src="screens/${s}-dark.png" alt="${label} dark"></div><div><span>Mineral light</span><img src="screens/${s}-light.png" alt="${label} mineral light"></div></div></article>`).join('')}</div></section>`).join('')</script></body></html>
