<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhysiqueOS — Goal Adaptation design mockups</title>
<style>
@font-face {
  font-family: Jakarta;
  src: url('../../home-design-exploration-20261003/fonts/PlusJakartaSans.ttf') format('truetype');
  font-weight: 200 800;
  font-display: block;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: #050c14;
  color: #f3f8fa;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- Accepted PhysiqueOS redesign tokens (ios/PhysiqueOS/SharedUI/PhysiqueOSTheme.swift @ 9d0a2069) ---------- */
.phone {
  --canvas: #061019; --paper: #0F1C2A; --soft: #132334;
  --ink: #F3F8FA; --ink2: #C3D2D9; --muted: #92A5AF;
  --teal: #3BD2CA; --green: #55E39A; --amber: #F4BC48; --amberInk: #EFB84F;
  --purple: #AA98FF; --cyan: #3BC6DD; --red: #FF697A; --orangeInk: #FB923C;
  --hairline: rgba(157,179,189,.184); --rule: rgba(167,188,197,.18);
  --fieldStart: #087B70; --fieldEnd: #132751; --coach: #122A55;
  --onAmber: #10202A; --onTeal: #03191E; --scrim: rgba(2,8,14,.62);
  --tealWash: rgba(59,210,202,.10); --amberWash: rgba(244,188,72,.12); --redWash: rgba(255,105,122,.12);
  --shadow: 0 30px 64px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.07);
}
.phone.light {
  --canvas: #E8ECE5; --paper: #FBFAF4; --soft: #EEF2ED;
  --ink: #102431; --ink2: #526970; --muted: #5D7279;
  --teal: #087E78; --green: #16875F; --amber: #C98220; --amberInk: #925500;
  --purple: #5C3FD2; --cyan: #107F99; --red: #B83D4B; --orangeInk: #9A4C10;
  --hairline: rgba(25,56,66,.169); --rule: rgba(110,129,127,.22);
  --fieldStart: #CBE6E2; --fieldEnd: #B9D5DD; --coach: #DDE8F1;
  --onAmber: #102431; --onTeal: #FFFFFF; --scrim: rgba(16,36,49,.38);
  --tealWash: rgba(8,126,120,.08); --amberWash: rgba(201,130,32,.10); --redWash: rgba(184,61,75,.08);
  --shadow: 0 30px 64px rgba(16,36,49,.28), 0 0 0 1px rgba(16,36,49,.08);
}

.phone {
  position: relative; width: 402px; min-height: 874px;
  background: var(--canvas); color: var(--ink);
  border-radius: 48px; overflow: hidden; box-shadow: var(--shadow);
  font-size: 16px; padding-bottom: 40px; isolation: isolate;
}
.phone.xl { font-size: 21.6px; } /* 135% Dynamic Type stress */
.t-xs { font-size: .75em; line-height: 1.3; }
.t-sm { font-size: .8125em; line-height: 1.38; }
.t-body { font-size: .9375em; line-height: 1.42; }
.t-lg { font-size: 1.0625em; line-height: 1.35; }
.display { font-family: Jakarta, -apple-system, sans-serif; font-weight: 800; letter-spacing: -.02em; }
.h1 { font-size: 1.75em; line-height: 1.12; }
.h2 { font-size: 1.3125em; line-height: 1.2; }
.h3 { font-size: 1.0625em; line-height: 1.25; }
.eyebrow { font-size: .75em; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--teal); }
.eyebrow.purple { color: var(--purple); }
.eyebrow.amber { color: var(--amberInk); }
.muted { color: var(--muted); }
.ink2 { color: var(--ink2); }
.strong { font-weight: 700; }
.semi { font-weight: 600; }
p { margin: 0; }

/* chrome */
.sb { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 6px 34px 0 42px; font-weight: 700; font-size: 17px; position: relative; z-index: 3; }
.sb .icons { display: flex; gap: 7px; align-items: center; }
.sb svg { display: block; }
.nav { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: relative; z-index: 3; }
.nav .back { display: flex; align-items: center; gap: 2px; color: var(--teal); font-size: 17px; }
.nav .title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 17px; pointer-events: none; }
.nav .action { color: var(--teal); font-size: 17px; }
.content { padding: 4px 18px 0; }
.stack > * + * { margin-top: 14px; }
.stack-sm > * + * { margin-top: 8px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

/* surfaces */
.card { background: var(--paper); border: 1px solid var(--hairline); border-radius: 18px; padding: 16px; position: relative; }
.card.soft { background: var(--soft); }
.card.rail { padding-left: 20px; overflow: hidden; }
.card.rail::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal); }
.card.rail.amber::before { background: var(--amber); }
.card.rail.purple::before { background: var(--purple); }
.card.selected { border: 2px solid var(--teal); padding: 15px; box-shadow: 0 0 0 4px var(--tealWash); }
.card.selected.rail { padding-left: 19px; }
.coach { background: linear-gradient(160deg, var(--coach), var(--soft)); border-radius: 22px; padding: 18px; border: 1px solid var(--hairline); }
.rule { height: 1px; background: var(--rule); margin: 12px 0; }
.divider-list > * + * { border-top: 1px solid var(--rule); }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 16px; font-weight: 700; font-size: 1.0625em; padding: 0 18px; text-align: center; }
.btn.primary { background: var(--teal); color: var(--onTeal); }
.btn.secondary { border: 1.5px solid var(--hairline); color: var(--ink); background: var(--paper); }
.btn.ghost { color: var(--teal); min-height: 44px; }
.btn.disabled { background: var(--soft); color: var(--muted); border: 1px dashed var(--hairline); }
.btn.small { min-height: 44px; font-size: .9375em; border-radius: 14px; }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 4px 10px; font-size: .75em; font-weight: 700; white-space: nowrap; }
.pill.teal { background: var(--tealWash); color: var(--teal); }
.pill.amber { background: var(--amberWash); color: var(--amberInk); }
.pill.red { background: var(--redWash); color: var(--red); }
.pill.line { border: 1px solid var(--hairline); color: var(--ink2); }

/* controls */
.radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.radio.on { border-color: var(--teal); }
.radio.on::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--teal); }
.seg { display: flex; background: var(--soft); border-radius: 12px; padding: 3px; gap: 3px; border: 1px solid var(--hairline); }
.seg > div { flex: 1; text-align: center; padding: 9px 4px; border-radius: 9px; font-size: .8125em; font-weight: 600; color: var(--ink2); min-height: 44px; display: grid; place-items: center; }
.seg > .on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.18); border: 1px solid var(--hairline); }
.choice { display: flex; gap: 12px; align-items: flex-start; padding: 13px 0; min-height: 48px; }
.choice .radio { margin-top: 1px; }
.stepper { display: flex; align-items: center; border: 1px solid var(--hairline); border-radius: 12px; overflow: hidden; }
.stepper span { display: grid; place-items: center; width: 44px; height: 44px; color: var(--teal); font-size: 20px; font-weight: 600; }
.stepper b { padding: 0 12px; font-size: .9375em; min-width: 78px; text-align: center; }
.chev { color: var(--muted); flex: none; }
.check { color: var(--green); flex: none; }

/* data */
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { background: var(--paper); border: 1px solid var(--hairline); border-radius: 16px; padding: 13px 14px; }
.metric .v { font-family: Jakarta, sans-serif; font-weight: 800; font-size: 1.375em; letter-spacing: -.02em; margin-top: 4px; }
.metric .c { font-size: .75em; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.bar { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--hairline); }
.bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; align-items: baseline; }
.kv .k { color: var(--ink2); font-size: .875em; }
.kv .v { font-weight: 700; text-align: right; font-size: .9375em; }
.delta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.delta s { color: var(--muted); text-decoration-thickness: 1.5px; font-weight: 500; }

/* illustrative stamp */
.illus { border: 1.5px dashed var(--amber); border-radius: 16px; padding: 14px; position: relative; background: repeating-linear-gradient(135deg, transparent 0 10px, var(--amberWash) 10px 11px); }
.illus-tag { display: inline-flex; align-items: center; gap: 6px; font-size: .6875em; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--amberInk); background: var(--paper); border: 1px solid var(--amber); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.pending { display: inline-flex; align-items: center; gap: 6px; border: 1.5px dashed var(--teal); color: var(--teal); border-radius: 10px; padding: 3px 9px; font-weight: 700; font-size: .875em; white-space: nowrap; }

/* home */
.hero { background: linear-gradient(165deg, var(--fieldStart) 0%, var(--fieldEnd) 92%); padding-bottom: 22px; position: relative; overflow: hidden; margin-top: -54px; padding-top: 54px; }
.hero::after { content: ""; position: absolute; width: 520px; height: 520px; border-radius: 50%; right: -330px; top: 40px; border: 70px solid rgba(255,255,255,.05); }
.phone.light .hero::after { border-color: rgba(255,255,255,.28); }
.timeline-dot { width: 22px; height: 22px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 8px rgba(85,227,154,.22); flex: none; }
.tabbar { margin: 18px 16px 0; height: 76px; border-radius: 38px; background: var(--paper); border: 1px solid var(--hairline); display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; padding: 0 6px; }
.tab { display: grid; justify-items: center; gap: 3px; font-size: 12px; color: var(--ink); }
.tab.on { color: var(--purple); background: var(--soft); border-radius: 30px; padding: 8px 0; }
.tile-amber { background: var(--amber); color: var(--onAmber); border-radius: 22px; padding: 16px; min-height: 104px; display: flex; align-items: flex-end; justify-content: space-between; }
.prio { border: 1.5px solid var(--hairline); border-radius: 16px; padding: 13px 14px; background: var(--soft); }

/* sheet / notification */
.scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--paper); border-radius: 30px 30px 0 0; z-index: 6; padding: 10px 20px 40px; border-top: 1px solid var(--hairline); }
.grabber { width: 40px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 0 auto 16px; }
.notif { border-radius: 22px; padding: 13px 14px; background: color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter: blur(20px); border: 1px solid var(--hairline); box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.appicon { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(150deg, #0E8F86, #13305E); display: grid; place-items: center; flex: none; }
.lock { background: linear-gradient(170deg, var(--fieldStart), var(--fieldEnd)); }

/* phase strip */
.phases { display: flex; flex-direction: column; gap: 0; }
.ph { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.ph .dot { width: 14px; height: 14px; border-radius: 50%; margin: 4px auto 0; border: 2px solid var(--muted); background: var(--canvas); position: relative; z-index: 1; }
.ph .dot.done { background: var(--amber); border-color: var(--amber); }
.ph .dot.now { background: var(--green); border-color: var(--green); box-shadow: 0 0 0 6px rgba(85,227,154,.2); }
.ph .dot.paused { background: var(--soft); border-color: var(--teal); }
.ph .line { width: 2px; background: var(--rule); margin: 0 auto; flex: 1; min-height: 14px; }
.ph .col { display: flex; flex-direction: column; align-items: center; }
.ph .txt { padding-bottom: 14px; }

/* compare table (option B) */
.cmp { display: grid; grid-template-columns: 92px repeat(3, 1fr); border: 1px solid var(--hairline); border-radius: 18px; overflow: hidden; background: var(--paper); }
.cmp > div { padding: 10px 8px; border-top: 1px solid var(--rule); font-size: .75em; line-height: 1.3; }
.cmp > .hd { border-top: 0; font-weight: 800; font-size: .75em; padding-top: 12px; }
.cmp > .lbl { color: var(--muted); font-weight: 700; }
.cmp > .sel { background: var(--tealWash); }
.cmp > .sel.hd { box-shadow: inset 0 3px 0 var(--teal); }

/* board */
.board { max-width: 1900px; margin: 0 auto; padding: 48px 40px 80px; }
.board h1 { font-family: Jakarta, sans-serif; font-size: 44px; letter-spacing: -.035em; margin: 8px 0 6px; line-height: 1.05; }
.board .lead { color: #aebfc8; font-size: 16px; line-height: 1.55; max-width: 1100px; }
.board .kick { color: #3bd2ca; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.section { border-top: 1px solid #9db3bd2f; padding: 34px 0 44px; }
.section h2 { font-family: Jakarta, sans-serif; font-size: 28px; letter-spacing: -.02em; margin: 0 0 6px; }
.section .note { color: #b6c6ce; font-size: 14px; line-height: 1.55; max-width: 1180px; margin: 0 0 22px; }
.pairs { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
.cap { margin: 0 0 9px; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #a9bbc4; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.facts table { width: 100%; border-collapse: collapse; font-size: 13.5px; line-height: 1.45; }
.facts td, .facts th { border-top: 1px solid #9db3bd2f; padding: 8px 10px 8px 0; vertical-align: top; text-align: left; color: #dce7ec; }
.facts th { color: #92a5af; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.facts td.tag-exact { color: #55e39a; font-weight: 700; }
[data-board] { padding: 24px 36px 12px; background: #050c14; }
.facts td.tag-ill { color: #f4bc48; font-weight: 700; }
.flow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 13.5px; }
.flow .n { background: #0f1c2a; border: 1px solid #9db3bd2f; border-radius: 12px; padding: 10px 12px; color: #e7eff3; }
.flow .n b { color: #3bd2ca; margin-right: 6px; }
.flow .a { color: #5d7279; }
.callouts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.callout { background: #0f1c2a; border: 1px solid #9db3bd2f; border-radius: 16px; padding: 16px 18px; color: #c3d2d9; font-size: 13.5px; line-height: 1.55; }
.callout h3 { margin: 0 0 6px; color: #f3f8fa; font-size: 15px; }
</style>
</head>

<div class="board" id="board"></div>

<script>
// ---------------------------------------------------------------------------
// Icons
// ---------------------------------------------------------------------------
const I = {
  back: '<svg width="13" height="21" viewBox="0 0 13 21"><path d="M11 2 2.5 10.5 11 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',

  bolt: '<svg width="16" height="16" viewBox="0 0 16 16"><path d="M9 1 3 9h4l-1 6 6-8H8l1-6Z" fill="currentColor"/></svg>',
};
const statusBar = () => `<div class="sb"><span>9:41</span><span class="icons">

  <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.2c2.6 0 4.9 1 6.6 2.7l1.4-1.4A11.3 11.3 0 0 0 .5 3.5l1.4 1.4A9.3 9.3 0 0 1 8.5 2.2Zm0 4c1.5 0 2.8.6 3.8 1.5l1.4-1.4a7.3 7.3 0 0 0-10.4 0l1.4 1.4c1-.9 2.3-1.5 3.8-1.5Zm0 4 1.9-1.9a2.7 2.7 0 0 0-3.8 0l1.9 1.9Z" fill="currentColor"/></svg>
  <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".7" y=".7" width="22.6" height="11.6" rx="3.6" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.2"/><rect x="2.5" y="2.5" width="19" height="8" rx="2.2" fill="currentColor"/><rect x="24.6" y="4.3" width="1.8" height="4.4" rx=".9" fill="currentColor" fill-opacity=".5"/></svg>
</span></div>`;
const nav = (back, title, action = '') => `<div class="nav"><span class="back">${I.back}<span>${back}</span></span><span class="title">${title}</span><span class="action">${action}</span></div>`;
const tabbar = (active = 'home') => `<div class="tabbar">${[

  <div class="section"><h2>Journey</h2>${flow}</div></div>`;
