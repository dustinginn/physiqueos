name: physiqueos-foundation-staging
region: ${DIGITALOCEAN_REGION}
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    dockerfile_path: Dockerfile.product
    git:
      repo_clone_url: ${GIT_REPOSITORY_URL}
      branch: ${GIT_BRANCH}
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    http_port: 8080
    health_check:
      http_path: /api/v1/health/live
    alerts:
      - { rule: CPU_UTILIZATION, operator: GREATER_THAN, value: 70, window: TEN_MINUTES }
      - { rule: MEM_UTILIZATION, operator: GREATER_THAN, value: 70, window: TEN_MINUTES }
      - { rule: RESTART_COUNT, operator: GREATER_THAN, value: 0.5, window: FIVE_MINUTES }
    envs:
      - { key: PHYSIQUEOS_PROVIDER_FULL_RUNTIME, scope: RUN_AND_BUILD_TIME, value: "1" }
      - { key: PHYSIQUEOS_PROVIDER_COMPATIBILITY_MODE, scope: RUN_TIME, value: ${PROVIDER_COMPATIBILITY_MODE} }
      - { key: PHYSIQUEOS_COMPATIBILITY_DATABASE_NAME, scope: RUN_TIME, value: ${COMPATIBILITY_DATABASE_NAME} }
      - { key: PHYSIQUEOS_RUNTIME_AUTHORITY_ENVIRONMENT, scope: RUN_TIME, value: ${RUNTIME_AUTHORITY_ENVIRONMENT} }
      - { key: PHYSIQUEOS_MIGRATION_OPERATION_ID, scope: RUN_TIME, value: ${MIGRATION_OPERATION_ID} }
      - { key: PHYSIQUEOS_CANONICAL_OWNER_USER_ID, scope: RUN_TIME, value: ${CANONICAL_OWNER_USER_ID} }
      - { key: PHYSIQUEOS_DATABASE_ENABLED, scope: RUN_TIME, value: "1" }
      - { key: PHYSIQUEOS_DATABASE_URL, scope: RUN_TIME, type: SECRET, value: ${PROVIDER_DATABASE_URL} }
      - { key: PHYSIQUEOS_DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: ${DATABASE_CA_CERT} }
      - { key: PHYSIQUEOS_OBJECT_STORAGE_ENABLED, scope: RUN_TIME, value: "1" }
      - { key: PHYSIQUEOS_SPACES_REGION, scope: RUN_TIME, value: ${SPACES_REGION} }
      - { key: PHYSIQUEOS_SPACES_ENDPOINT, scope: RUN_TIME, value: ${SPACES_ENDPOINT} }
      - { key: PHYSIQUEOS_SPACES_BUCKET, scope: RUN_TIME, value: ${SPACES_BUCKET} }
      - { key: PHYSIQUEOS_SPACES_ACCESS_KEY_ID, scope: RUN_TIME, type: SECRET, value: ${SPACES_ACCESS_KEY_ID} }
      - { key: PHYSIQUEOS_SPACES_SECRET_ACCESS_KEY, scope: RUN_TIME, type: SECRET, value: ${SPACES_SECRET_ACCESS_KEY} }
      - { key: PHYSIQUEOS_CREDENTIAL_PEPPER, scope: RUN_TIME, type: SECRET, value: ${CREDENTIAL_PEPPER} }
      - { key: PHYSIQUEOS_OPERATIONS_TOKEN, scope: RUN_TIME, type: SECRET, value: ${OPERATIONS_TOKEN} }
      - { key: PHYSIQUEOS_ACCESS_GATE_SECRET, scope: RUN_TIME, type: SECRET, value: ${ACCESS_GATE_SECRET} }
      - { key: PHYSIQUEOS_PUBLIC_APP_ORIGIN, scope: RUN_TIME, value: ${PUBLIC_APP_ORIGIN} }
      - { key: PHYSIQUEOS_PROVIDER_MIGRATION_DRY_RUN_ENABLED, scope: RUN_TIME, value: ${PROVIDER_MIGRATION_DRY_RUN_ENABLED} }
      - { key: PHYSIQUEOS_SIMPLIFIED_MIGRATION_ENABLED, scope: RUN_TIME, value: ${SIMPLIFIED_MIGRATION_ENABLED} }
      - { key: PHYSIQUEOS_PROVIDER_EXECUTION_BOUNDARY, scope: RUN_TIME, value: digitalocean-app-platform }
      - { key: PHYSIQUEOS_MIGRATION_OPERATOR_ID, scope: RUN_TIME, value: ${MIGRATION_OPERATOR_ID} }
      - { key: PHYSIQUEOS_EXPECTED_PRODUCTION_SOURCE_COMMIT, scope: RUN_TIME, value: ${EXPECTED_PRODUCTION_SOURCE_COMMIT} }
      - { key: PHYSIQUEOS_EXPECTED_PRODUCTION_BUILD_ID, scope: RUN_TIME, value: ${EXPECTED_PRODUCTION_BUILD_ID} }
      - { key: PHYSIQUEOS_EXPECTED_FOUNDER_REVISION, scope: RUN_TIME, value: ${EXPECTED_FOUNDER_REVISION} }
      - { key: PHYSIQUEOS_EXPECTED_FOUNDER_SHA256, scope: RUN_TIME, value: ${EXPECTED_FOUNDER_SHA256} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_COUNT, scope: RUN_TIME, value: ${EXPECTED_MEDIA_COUNT} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_BYTES, scope: RUN_TIME, value: ${EXPECTED_MEDIA_BYTES} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_INVENTORY_SHA256, scope: RUN_TIME, value: ${EXPECTED_MEDIA_INVENTORY_SHA256} }
      - { key: PHYSIQUEOS_EXPECTED_ROLLBACK_SOURCE_COMMIT, scope: RUN_TIME, value: ${EXPECTED_ROLLBACK_SOURCE_COMMIT} }
      - { key: PHYSIQUEOS_EXPECTED_ROLLBACK_BUILD_ID, scope: RUN_TIME, value: ${EXPECTED_ROLLBACK_BUILD_ID} }
      - { key: PHYSIQUEOS_EXPECTED_FINAL_BACKUP_SHA256SUMS_SHA256, scope: RUN_TIME, value: ${EXPECTED_FINAL_BACKUP_SHA256SUMS_SHA256} }
      - { key: PHYSIQUEOS_BUILD_ID, scope: RUN_AND_BUILD_TIME, value: ${BUILD_ID} }
      - { key: PHYSIQUEOS_GIT_SHA, scope: RUN_AND_BUILD_TIME, value: ${GIT_SHA} }
      - { key: PHYSIQUEOS_PROVIDER_DEPLOYMENT_ID, scope: RUN_TIME, value: ${PROVIDER_DEPLOYMENT_ID} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_TRANSFER_ENABLED, scope: RUN_TIME, value: ${COMBINED_CUTOVER_TRANSFER_ENABLED} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_TRANSFER_OPERATION_ID, scope: RUN_TIME, value: ${COMBINED_CUTOVER_TRANSFER_OPERATION_ID} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_TRANSFER_CREDENTIAL_HASH, scope: RUN_TIME, type: SECRET, value: ${COMBINED_CUTOVER_TRANSFER_CREDENTIAL_HASH} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_TRANSFER_CREDENTIAL_EXPIRES_AT, scope: RUN_TIME, value: ${COMBINED_CUTOVER_TRANSFER_CREDENTIAL_EXPIRES_AT} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_PREPARE_ENABLED, scope: RUN_TIME, value: ${COMBINED_CUTOVER_PREPARE_ENABLED} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_PREPARE_OPERATION_ID, scope: RUN_TIME, value: ${COMBINED_CUTOVER_PREPARE_OPERATION_ID} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_PREPARE_CREDENTIAL_HASH, scope: RUN_TIME, type: SECRET, value: ${COMBINED_CUTOVER_PREPARE_CREDENTIAL_HASH} }
      - { key: PHYSIQUEOS_COMBINED_CUTOVER_PREPARE_CREDENTIAL_EXPIRES_AT, scope: RUN_TIME, value: ${COMBINED_CUTOVER_PREPARE_CREDENTIAL_EXPIRES_AT} }
      # Authority/routing handoff (Phase 5) is deliberately NOT wired here: its own composition
      # (combinedCutoverHandoffComposition.js) already refuses to activate whenever this deployment's
      # own compatibility-mode flag above is set to "1" - leaving
      # PHYSIQUEOS_COMBINED_CUTOVER_HANDOFF_ENABLED unset is the narrower, equally-safe choice.
workers:
  - name: worker
    dockerfile_path: Dockerfile.provider-worker
    git:
      repo_clone_url: ${GIT_REPOSITORY_URL}
      branch: ${GIT_BRANCH}
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    alerts:
      - { rule: CPU_UTILIZATION, operator: GREATER_THAN, value: 70, window: TEN_MINUTES }
      - { rule: MEM_UTILIZATION, operator: GREATER_THAN, value: 70, window: TEN_MINUTES }
      - { rule: RESTART_COUNT, operator: GREATER_THAN, value: 0.5, window: FIVE_MINUTES }
    envs:
      - { key: PHYSIQUEOS_PROVIDER_FULL_RUNTIME, scope: RUN_TIME, value: "1" }
      - { key: PHYSIQUEOS_PROVIDER_COMPATIBILITY_MODE, scope: RUN_TIME, value: ${PROVIDER_COMPATIBILITY_MODE} }
      - { key: PHYSIQUEOS_COMPATIBILITY_DATABASE_NAME, scope: RUN_TIME, value: ${COMPATIBILITY_DATABASE_NAME} }
      - { key: PHYSIQUEOS_RUNTIME_AUTHORITY_ENVIRONMENT, scope: RUN_TIME, value: ${RUNTIME_AUTHORITY_ENVIRONMENT} }
      - { key: PHYSIQUEOS_CANONICAL_OWNER_USER_ID, scope: RUN_TIME, value: ${CANONICAL_OWNER_USER_ID} }
      - { key: PHYSIQUEOS_DATABASE_ENABLED, scope: RUN_TIME, value: "1" }
      - { key: PHYSIQUEOS_DATABASE_URL, scope: RUN_TIME, type: SECRET, value: ${PROVIDER_DATABASE_URL} }
      - { key: PHYSIQUEOS_DATABASE_CA_CERT, scope: RUN_TIME, type: SECRET, value: ${DATABASE_CA_CERT} }
      - { key: PHYSIQUEOS_OBJECT_STORAGE_ENABLED, scope: RUN_TIME, value: "1" }
      - { key: PHYSIQUEOS_SPACES_REGION, scope: RUN_TIME, value: ${SPACES_REGION} }
      - { key: PHYSIQUEOS_SPACES_ENDPOINT, scope: RUN_TIME, value: ${SPACES_ENDPOINT} }
      - { key: PHYSIQUEOS_SPACES_BUCKET, scope: RUN_TIME, value: ${SPACES_BUCKET} }
      - { key: PHYSIQUEOS_SPACES_ACCESS_KEY_ID, scope: RUN_TIME, type: SECRET, value: ${SPACES_ACCESS_KEY_ID} }
      - { key: PHYSIQUEOS_SPACES_SECRET_ACCESS_KEY, scope: RUN_TIME, type: SECRET, value: ${SPACES_SECRET_ACCESS_KEY} }
      - { key: PHYSIQUEOS_CREDENTIAL_PEPPER, scope: RUN_TIME, type: SECRET, value: ${CREDENTIAL_PEPPER} }
      - { key: PHYSIQUEOS_PROVIDER_MIGRATION_DRY_RUN_ENABLED, scope: RUN_TIME, value: ${PROVIDER_MIGRATION_DRY_RUN_ENABLED} }
      - { key: PHYSIQUEOS_SIMPLIFIED_MIGRATION_ENABLED, scope: RUN_TIME, value: ${SIMPLIFIED_MIGRATION_ENABLED} }
      - { key: PHYSIQUEOS_PROVIDER_EXECUTION_BOUNDARY, scope: RUN_TIME, value: digitalocean-app-platform }
      - { key: PHYSIQUEOS_MIGRATION_OPERATOR_ID, scope: RUN_TIME, value: ${MIGRATION_OPERATOR_ID} }
      - { key: PHYSIQUEOS_EXPECTED_PRODUCTION_SOURCE_COMMIT, scope: RUN_TIME, value: ${EXPECTED_PRODUCTION_SOURCE_COMMIT} }
      - { key: PHYSIQUEOS_EXPECTED_PRODUCTION_BUILD_ID, scope: RUN_TIME, value: ${EXPECTED_PRODUCTION_BUILD_ID} }
      - { key: PHYSIQUEOS_EXPECTED_FOUNDER_REVISION, scope: RUN_TIME, value: ${EXPECTED_FOUNDER_REVISION} }
      - { key: PHYSIQUEOS_EXPECTED_FOUNDER_SHA256, scope: RUN_TIME, value: ${EXPECTED_FOUNDER_SHA256} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_COUNT, scope: RUN_TIME, value: ${EXPECTED_MEDIA_COUNT} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_BYTES, scope: RUN_TIME, value: ${EXPECTED_MEDIA_BYTES} }
      - { key: PHYSIQUEOS_EXPECTED_MEDIA_INVENTORY_SHA256, scope: RUN_TIME, value: ${EXPECTED_MEDIA_INVENTORY_SHA256} }
      - { key: PHYSIQUEOS_EXPECTED_ROLLBACK_SOURCE_COMMIT, scope: RUN_TIME, value: ${EXPECTED_ROLLBACK_SOURCE_COMMIT} }
      - { key: PHYSIQUEOS_EXPECTED_ROLLBACK_BUILD_ID, scope: RUN_TIME, value: ${EXPECTED_ROLLBACK_BUILD_ID} }
      - { key: PHYSIQUEOS_EXPECTED_FINAL_BACKUP_SHA256SUMS_SHA256, scope: RUN_TIME, value: ${EXPECTED_FINAL_BACKUP_SHA256SUMS_SHA256} }
      - { key: PHYSIQUEOS_BUILD_ID, scope: RUN_AND_BUILD_TIME, value: ${BUILD_ID} }
      - { key: PHYSIQUEOS_GIT_SHA, scope: RUN_AND_BUILD_TIME, value: ${GIT_SHA} }
      - { key: PHYSIQUEOS_WORKER_ID, scope: RUN_TIME, value: ${WORKER_ID} }
      - { key: PHYSIQUEOS_WORKER_MAX_ATTEMPTS, scope: RUN_TIME, value: "3" }
